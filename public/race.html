<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · レース詳細</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=18" />
  <link rel="stylesheet" href="assets/screens.css?v=36" />
  <link rel="stylesheet" href="assets/ux.css?v=20" />
  <link rel="stylesheet" href="assets/vqa.css" />
  <link rel="stylesheet" href="assets/v11.css?v=11" />
  <script src="assets/api/calendar-weekend.js?v=15"></script>
  <script src="assets/auto-maintenance.js?v=11.3"></script>
  <script src="assets/auth.js?v=4"></script>
  <script>
    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }
  </script>
</head>
<body class="page-screen page-race-detail page-tab" data-nav="race">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <a class="back-btn" href="races.html" aria-label="戻る">‹</a>
          <div class="brand-block topbar-text">
            <p class="brand-name" id="raceTitle">レース詳細</p>
            <p class="brand-sub" id="raceSub">読み込み中…</p>
          </div>
        </div>
        <div class="topbar-tools">
          <button type="button" class="fav-btn fav-btn--icon" id="raceFavBtn" data-fav-toggle="" aria-label="お気に入りに追加">
            <span class="fav-star" aria-hidden="true">★</span>
          </button>
          <button type="button" class="icon-btn" aria-label="カレンダー">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="screen">
      <div class="chip-row" id="detailTabs" role="tablist" aria-label="レース詳細タブ">
        <button type="button" class="chip is-active" role="tab" aria-selected="true" data-tab="ai">AI予想</button>
        <button type="button" class="chip" role="tab" aria-selected="false" data-tab="shutuba">出馬表</button>
        <button type="button" class="chip" role="tab" aria-selected="false" data-tab="odds">オッズ</button>
        <button type="button" class="chip" role="tab" aria-selected="false" data-tab="data">データ</button>
        <button type="button" class="chip is-soon" role="tab" aria-selected="false" disabled aria-disabled="true" title="準備中">結果<span class="chip-soon">準備中</span></button>
      </div>

      <section class="race-meta-card" id="raceMetaCard" aria-label="レース情報">
        <p class="race-meta-name" id="raceMetaName">—</p>
        <p class="race-meta-line" id="raceMetaLine">読み込み中…</p>
      </section>

      <div id="raceProvenance" class="race-provenance-wrap" hidden></div>

      <div data-tab-panel="ai" id="tabPanelAi">
      <section class="chart-card" id="marksSection">
        <h3>印</h3>
        <div id="marksSectionBody"><p class="muted">読み込み中…</p></div>
      </section>

      <section class="chart-card" id="pickCardsSection">
        <h3>対抗・穴</h3>
        <div id="pickCardsBody" class="pick-cards"><p class="muted">読み込み中…</p></div>
      </section>

      <article class="honmei-card is-loading" id="honmeiCard">
        <div class="honmei-num">—</div>
        <div>
          <h2>読み込み中…</h2>
          <p>AI本命 · 信頼度 —</p>
          <p class="race-stars" style="margin-top:6px">☆☆☆☆☆</p>
        </div>
        <div class="radar-box" aria-label="強み項目">
          <span>—</span>
        </div>
      </article>

      <section class="pace-card" id="paceCard">
        <h3>最終着順予想（左→右　着順）</h3>
        <p>レースデータを読み込んでいます…</p>
        <div class="pace-track" id="paceTrack" aria-label="最終着順予想（左が1着）"></div>
      </section>

      <section class="chart-card is-loading" id="chartCard">
        <h3>評価内訳</h3>
        <div class="score-list">
          <div class="score-row"><span>近走成績</span><div class="score-bar"><i style="width:0%"></i></div><b>—</b></div>
          <div class="score-row"><span>距離適性</span><div class="score-bar"><i style="width:0%"></i></div><b>—</b></div>
          <div class="score-row"><span>脚質×距離</span><div class="score-bar"><i style="width:0%"></i></div><b>—</b></div>
          <div class="score-row"><span>先行傾向</span><div class="score-bar"><i style="width:0%"></i></div><b>—</b></div>
          <div class="score-row"><span>展開耐性</span><div class="score-bar"><i style="width:0%"></i></div><b>—</b></div>
        </div>
      </section>

      <section class="chart-card" id="confidenceSection">
        <h3>このレースの自信度</h3>
        <div id="raceConfidenceDetail"><p class="muted">読み込み中…</p></div>
      </section>

      <section class="chart-card" id="reasonsSection">
        <h3>◎を選んだ理由</h3>
        <div id="reasonsSectionBody"><p class="muted">読み込み中…</p></div>
      </section>

      <div class="fab-bet">
        <a id="strategyLink" href="strategy.html">買い目戦略を詳しく見る</a>
      </div>
      </div>

      <section class="chart-card" data-tab-panel="shutuba" id="tabPanelShutuba" hidden>
        <h3>出馬表</h3>
        <div id="tabShutubaBody"><p class="muted">タブを開くと読み込みます</p></div>
      </section>

      <section class="chart-card" data-tab-panel="odds" id="tabPanelOdds" hidden>
        <h3>単勝オッズ</h3>
        <div id="tabOddsBody"><p class="muted">タブを開くと読み込みます</p></div>
      </section>

      <section class="chart-card" data-tab-panel="data" id="tabPanelData" hidden>
        <h3>近走データ（各馬3件）</h3>
        <div id="tabDataBody"><p class="muted">タブを開くと読み込みます</p></div>
      </section>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/race-id-meta.js?v=2"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/contract-guard.js"></script>
  <script src="assets/api/prediction.js?v=10"></script>
  <script src="assets/api/prediction-bind.js?v=34"></script>
  <script src="assets/api/race-board.js?v=10"></script>
  <script src="assets/api/race-detail-tabs.js?v=11"></script>
  <script src="assets/api/analysis.js?v=10"></script>
  <script src="assets/api/analysis-bind.js?v=30"></script>
  <script src="assets/ux.js?v=20"></script>
  <script src="assets/api/conversation.js?v=6"></script>
  <script src="assets/api/conversation-ui.js?v=7"></script>
  <script src="assets/api/ui-features.js?v=11"></script>
  <script src="assets/v11.js?v=11"></script>
  <script src="assets/favorites.js?v=4"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js?v=2"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    ExpectShell.initMascotTalk([
      "逃げ・先行が厚いから<br>差し有利の展開に<br>なりそう！",
      "★ でお気に入り登録すると<br>ホームに最大3件まで<br>表示されるよ！"
    ]);

    var id = new URLSearchParams(location.search).get("race_id") || "";
    if (!id) {
      document.querySelector(".screen").innerHTML =
        "<p class='muted' style='padding:24px'>race_id を指定してください。<a href='races.html'>レース一覧</a></p>";
    } else {
    // 誤年 race_id（例: 2024-07-25-…）を開催カレンダー年へ補正
    var raceIdYearFixed = null;
    (function maybeFixRaceIdYear() {
      var m = String(id).match(/^(\d{4})-(\d{2}-\d{2})-(.+)$/);
      if (!m) return;
      var week = [];
      if (window.ExpectWeekendCalendar && ExpectWeekendCalendar.weekendRaceDates) {
        week = ExpectWeekendCalendar.weekendRaceDates(new Date()).filter(Boolean);
      }
      var matchIso = null;
      for (var i = 0; i < week.length; i++) {
        if (String(week[i]).slice(5) === m[2]) {
          matchIso = week[i];
          break;
        }
      }
      if (!matchIso) {
        var calDate = "";
        if (window.ExpectWeekendCalendar && ExpectWeekendCalendar.decide) {
          var cal = ExpectWeekendCalendar.decide(new Date());
          if (cal && cal.is_race_day && cal.date_jst) calDate = cal.date_jst;
          else if (cal && cal.next_open_date_jst) calDate = cal.next_open_date_jst;
        }
        if (calDate && calDate.slice(5) === m[2]) matchIso = calDate;
      }
      if (!matchIso || !/^\d{4}-\d{2}-\d{2}$/.test(matchIso)) return;
      if (m[1] !== matchIso.slice(0, 4)) {
        raceIdYearFixed = matchIso.slice(0, 4) + "-" + m[2] + "-" + m[3];
      }
    })();
    if (raceIdYearFixed) {
      location.replace("race?race_id=" + encodeURIComponent(raceIdYearFixed));
    } else {

    if (window.ExpectConversationUi) ExpectConversationUi.mountRaceCtas(id);
    if (window.ExpectRaceDetailTabs) ExpectRaceDetailTabs.bind(id);
    var meta =
      window.ExpectFavorites && typeof ExpectFavorites.getMeta === "function"
        ? ExpectFavorites.getMeta(id)
        : { place: "", name: "", badge: "", dateLabel: "", postTime: "" };
    var titleEl = document.getElementById("raceTitle");
    var subEl = document.getElementById("raceSub") || document.querySelector(".brand-sub");
    var placeHint =
      (window.ExpectRaceIdMeta && ExpectRaceIdMeta.displayPlace(id, meta.place)) ||
      meta.place ||
      "レース";
    if (titleEl) titleEl.textContent = placeHint;
    if (subEl) {
      var subBits = [];
      if (meta.name) subBits.push(meta.name);
      if (meta.postTime) {
        var pt = String(meta.postTime).trim();
        var m = pt.match(/^(\d{1,2}):(\d{2})/);
        subBits.push(
          m
            ? String(Number(m[1])).padStart(2, "0") + ":" + m[2] + "出走"
            : pt.indexOf("出走") >= 0
              ? pt
              : pt + "出走"
        );
      } else if (meta.badge) {
        subBits.push(meta.badge);
      }
      subEl.textContent = subBits.length ? subBits.join(" · ") : "読み込み中…";
    }
    var metaNameEl = document.getElementById("raceMetaName");
    var metaLineEl = document.getElementById("raceMetaLine");
    if (metaNameEl) metaNameEl.textContent = meta.name || placeHint || "—";
    if (metaLineEl) {
      var lineBits = [];
      if (meta.dateLabel) lineBits.push(meta.dateLabel);
      if (meta.postTime) {
        var pt2 = String(meta.postTime).trim();
        var m2 = pt2.match(/^(\d{1,2}):(\d{2})/);
        lineBits.push(
          m2
            ? String(Number(m2[1])).padStart(2, "0") + ":" + m2[2] + "出走"
            : pt2.indexOf("出走") >= 0
              ? pt2
              : pt2 + "出走"
        );
      }
      metaLineEl.textContent = lineBits.length ? lineBits.join(" · ") : "読み込み中…";
    }

    var favBtn = document.getElementById("raceFavBtn");
    if (favBtn) {
      favBtn.setAttribute("data-fav-toggle", id);
      favBtn.setAttribute("data-fav-place", meta.place || "");
      favBtn.setAttribute("data-fav-name", meta.name || "");
      favBtn.setAttribute("data-fav-badge", meta.badge || "");
      favBtn.setAttribute("data-fav-date", meta.dateLabel || "");
      if (meta.postTime) favBtn.setAttribute("data-fav-time", meta.postTime);
    }
    var strategyLink = document.getElementById("strategyLink");
    if (strategyLink) {
      strategyLink.href = "strategy.html?race_id=" + encodeURIComponent(id);
    }

    /* PB 入口 → race_id で Analysis（loading / 本命刷り込み） */
    var detailMount = document.querySelector(".screen");
    var honmeiCard = document.getElementById("honmeiCard");
    var chartCard = document.getElementById("chartCard");

    function markReady() {
      if (window.ExpectUx && ExpectUx.hideLoading) ExpectUx.hideLoading(detailMount);
      if (honmeiCard) {
        honmeiCard.classList.remove("is-loading");
        honmeiCard.classList.add("is-ready");
      }
      if (chartCard) chartCard.classList.remove("is-loading");
    }

    function withTimeout(promise, ms, label) {
      return new Promise(function (resolve, reject) {
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          var err = new Error(label || "timeout");
          err.code = "TIMEOUT";
          reject(err);
        }, ms);
        Promise.resolve(promise).then(
          function (value) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve(value);
          },
          function (err) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            reject(err);
          }
        );
      });
    }

    if (window.ExpectApi && ExpectApi.Prediction && window.ExpectPredictionBind) {
      var startDetail = function () {
      if (window.ExpectUx && ExpectUx.showLoading) {
        ExpectUx.showLoading(detailMount, {
          replace: false,
          title: "ロード中...",
          message: "レース詳細を準備しています。",
        });
      }
      withTimeout(ExpectApi.Prediction.getWithMeta(id), 14000, "prediction timeout")
        .then(function (result) {
          var bundle = result.bundle;
          var envelopeMeta = result.meta || {};
          var pbCheck =
            (bundle && bundle.__contract) ||
            (window.ExpectContractGuard && ExpectContractGuard.validatePredictionBundle(bundle)) ||
            { ok: true, errors: [] };
          if (!pbCheck.ok) {
            markReady();
            if (window.ExpectContractGuard) {
              ExpectContractGuard.showErrorCard(detailMount, {
                title: "レース詳細を更新できません",
                message: "PredictionBundle が契約と一致しません。",
                errors: pbCheck.errors,
              });
            }
            ExpectFavorites.bindButtons();
            return;
          }
          if (window.ExpectContractGuard) ExpectContractGuard.clearErrorCard(detailMount);

          if (bundle && ExpectFavorites.cacheBundle) {
            ExpectFavorites.cacheBundle(bundle);
          }

          var applied = ExpectPredictionBind.applyRaceDetail(bundle, envelopeMeta, id);
          // Prediction 反映時点でオーバーレイを閉じる（Analysis 待ちで固まるのを防ぐ）
          markReady();
          var chartsFromPb = false;
          if (window.ExpectAnalysisBind && ExpectAnalysisBind.applyFromPredictionBundle) {
            chartsFromPb = !!ExpectAnalysisBind.applyFromPredictionBundle(bundle);
            if (chartsFromPb && chartCard) {
              chartCard.classList.remove("is-loading");
            }
          }
          if (applied && applied.mismatch && window.ExpectUx && detailMount) {
            detailMount.insertBefore(
              ExpectUx.stateCard({
                kind: "warn",
                title: "race_id の不一致",
                message:
                  "URL race_id=" +
                  id +
                  " に対し API は " +
                  applied.raceId +
                  " を返しました。Core: " +
                  (envelopeMeta.core_race_id || "—"),
              }),
              detailMount.firstChild
            );
          }
          if (honmeiCard) {
            honmeiCard.classList.remove("is-loading");
            honmeiCard.classList.add("is-ready");
          }
          if (!chartsFromPb && chartCard) chartCard.classList.add("is-loading");
          if (applied && favBtn) {
            favBtn.setAttribute("data-fav-place", applied.place || meta.place || "");
            favBtn.setAttribute("data-fav-name", applied.name || meta.name || "");
            favBtn.setAttribute("data-fav-badge", applied.badge || meta.badge || "");
            if (applied.postTime) favBtn.setAttribute("data-fav-time", applied.postTime);
            if (applied.dateLabel) favBtn.setAttribute("data-fav-date", applied.dateLabel);
          }
          var narrative = bundle && bundle.explain && bundle.explain.narrative;
          var raceId = (bundle && bundle.race_id) || id;

          function afterAnalysis(analysis) {
            if (chartCard) chartCard.classList.remove("is-loading");
            if (analysis) {
              var aCheck =
                analysis.__contract ||
                (window.ExpectContractGuard && ExpectContractGuard.validateAnalysis(analysis)) ||
                { ok: true, errors: [] };
              if (!aCheck.ok) {
                if (!chartsFromPb && window.ExpectContractGuard) {
                  ExpectContractGuard.showErrorCard(detailMount, {
                    title: "評価内訳を更新できません",
                    message: "Analysis が契約と一致しません。本命カード等は Prediction のままです。",
                    errors: aCheck.errors,
                  });
                }
              } else if (window.ExpectAnalysisBind) {
                // PB 由来の評価内訳がある場合は mock Analysis で上書きしない
                if (!chartsFromPb) {
                  ExpectAnalysisBind.applyRaceDetailAnalysis(analysis);
                } else if (analysis.narrative) {
                  var narrativeEl = document.querySelector(".pace-card p");
                  if (narrativeEl) {
                    var current = (narrativeEl.textContent || "").trim();
                    if (!current) narrativeEl.textContent = analysis.narrative;
                  }
                }
                if (!narrative && analysis.narrative) narrative = analysis.narrative;
              }
            }
            if (ExpectShell.speakMascot && narrative) {
              ExpectShell.speakMascot(narrative.replace(/。/g, "。<br>"), 5200);
            }
            ExpectFavorites.bindButtons();
          }

          if (ExpectApi.Analysis) {
            return withTimeout(ExpectApi.Analysis.get(raceId), 15000, "analysis timeout")
              .then(afterAnalysis)
              .catch(function () {
                afterAnalysis(null);
              });
          }
          afterAnalysis(null);
        })
        .catch(function (err) {
          markReady();
          var status = err && err.status;
          var code = err && err.code;
          var msg = String((err && err.message) || "");
          var isUnauthorized =
            status === 401 ||
            code === "UNAUTHORIZED" ||
            /unauthorized|invalid token/i.test(msg);
          if (window.ExpectUx && detailMount) {
            if (isUnauthorized) {
              detailMount.insertBefore(
                ExpectUx.stateCard({
                  kind: "error",
                  title: "ログインの有効期限切れ",
                  message:
                    "ログイン情報の有効期限が切れました。もう一度ログインしてください。",
                  retryLabel: "再ログイン",
                  onRetry: function () {
                    try {
                      localStorage.removeItem("expect_access_token_v1");
                    } catch (e) { /* ignore */ }
                    location.href = "login.html";
                  },
                }),
                detailMount.firstChild
              );
            } else {
              detailMount.insertBefore(
                ExpectUx.stateCard({
                  kind: "error",
                  title: "レース詳細を更新できません",
                  message:
                    "PredictionBundle の取得に失敗またはタイムアウトしました。",
                  onRetry: function () {
                    location.reload();
                  },
                }),
                detailMount.firstChild
              );
            }
          } else if (window.ExpectContractGuard) {
            ExpectContractGuard.showErrorCard(detailMount, {
              title: isUnauthorized
                ? "ログインの有効期限切れ"
                : "レース詳細を更新できません",
              message: isUnauthorized
                ? "ログイン情報の有効期限が切れました。もう一度ログインしてください。"
                : "PredictionBundle の取得に失敗しました。",
            });
          }
          ExpectFavorites.bindButtons();
        });
      };
      // Feature flag 取得と並行して Prediction を開始（beta.json 待ちで遅延させない）
      startDetail();
    } else {
      markReady();
      ExpectFavorites.bindButtons();
    }
    } // raceIdYearFixed else
    } // !id else
  </script>
</body>
</html>
