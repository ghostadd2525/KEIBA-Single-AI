<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <title>Expect ～ KEIBA AI ～ · 初回設定</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/login.css" />
  <script src="assets/api/calendar-weekend.js?v=14"></script>
  <script src="assets/auto-maintenance.js?v=11.3"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/favorites.js?v=4"></script>
  <script src="assets/auth.js?v=4"></script>
  <script>
    (function () {
      if (typeof ExpectApi === "undefined" || !ExpectApi.Auth) return;
      if (!ExpectApi.Auth.getSetupToken()) {
        location.replace("login.html");
      }
    })();
  </script>
</head>
<body class="page-login page-setup">
  <div class="login-app">
    <header class="login-brand">
      <p class="brand-name">Expect</p>
      <p class="brand-sub">～ KEIBA AI ～</p>
    </header>

    <section class="login-card" aria-label="初回設定">
      <div class="login-block-head">
        <div class="login-ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 5 6v6c0 4.5 2.9 7.8 7 9 4.1-1.2 7-4.5 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </div>
        <div>
          <h2>初回設定</h2>
          <p>ログインIDとパスワードを決めて、利用を開始します</p>
        </div>
      </div>

      <form id="setupForm">
        <label class="login-field">
          <span class="login-field-label">ログインID</span>
          <input id="setupLoginId" type="text" autocomplete="username" placeholder="半角英数 4〜32文字" required minlength="4" maxlength="32" />
        </label>
        <label class="login-field">
          <span class="login-field-label">パスワード</span>
          <input id="setupPassword" type="password" autocomplete="new-password" placeholder="8文字以上" required minlength="8" />
        </label>
        <label class="login-field">
          <span class="login-field-label">パスワード（確認）</span>
          <input id="setupPassword2" type="password" autocomplete="new-password" placeholder="もう一度入力" required minlength="8" />
        </label>

        <label class="terms-check setup-terms">
          <input type="checkbox" id="setupTerms" />
          <span>
            <a href="terms.html" target="_blank" rel="noopener">利用規約</a>
            およびプライバシーポリシーに同意する
          </span>
        </label>

        <p class="login-error" id="setupError" role="alert"></p>

        <button class="login-submit" type="submit" id="setupSubmit">
          設定を完了して始める
          <span aria-hidden="true">›</span>
        </button>
      </form>

      <p class="login-tip">
        この画面は招待された初回のみ表示されます。完了後はログインIDでサインインしてください。
      </p>
      <p class="login-tip">
        <a href="login.html">ログイン画面へ戻る</a>
      </p>
    </section>
  </div>

  <script>
    (function () {
      var err = document.getElementById("setupError");
      var form = document.getElementById("setupForm");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.textContent = "";
        var loginId = (document.getElementById("setupLoginId").value || "").trim();
        var pw = document.getElementById("setupPassword").value || "";
        var pw2 = document.getElementById("setupPassword2").value || "";
        var terms = document.getElementById("setupTerms").checked;

        if (!/^[A-Za-z0-9_-]{4,32}$/.test(loginId)) {
          err.textContent = "ログインIDは半角英数・_・- の4〜32文字で入力してください";
          return;
        }
        if (pw.length < 8) {
          err.textContent = "パスワードは8文字以上にしてください";
          return;
        }
        if (pw !== pw2) {
          err.textContent = "パスワード（確認）が一致しません";
          return;
        }
        if (!terms) {
          err.textContent = "利用規約への同意が必要です";
          return;
        }

        ExpectAuth.completeSetup({
          login_id: loginId,
          password: pw,
          terms_accepted: true,
        })
          .then(function () {
            return ExpectAutoMaintenance.goPostAuthLanding();
          })
          .catch(function (e2) {
            err.textContent = (e2 && e2.message) || "設定に失敗しました";
          });
      });
    })();
  </script>
</body>
</html>
