<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · 買い目戦略</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/screens.css" />
  <script src="assets/auth.js"></script>
  <script>ExpectAuth.requireAuth();</script>
</head>
<body class="page-screen page-strategy" data-nav="race">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <a class="back-btn" id="strategyBack" href="race.html" aria-label="戻る">‹</a>
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">買い目戦略</p>
            <p class="brand-sub" id="strategySub">詳細分析</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen" id="strategyScreen">
      <p class="muted">読み込み中…</p>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/race-id-meta.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/prediction.js"></script>
  <script src="assets/api/analysis.js"></script>
  <script src="assets/api/prediction-bind.js"></script>
  <script src="assets/favorites.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("race_id") || "";
      if (!id) {
        document.getElementById("strategyScreen").innerHTML =
          "<p class='muted'>race_id を指定してください。<a href='races.html'>レース一覧</a></p>";
        return;
      }
      var meta = ExpectFavorites.getMeta(id);
      var ai = ExpectFavorites.getAi(id);

      function fallbackStrategy() {
        var overall = ai.overall || 75;
        return {
          axis: {
            num: "—",
            name: meta.name || "本命候補",
            role: "本命軸",
            odds: "—"
          },
          rivals: [
            { num: "—", name: "対抗候補", role: "対抗", reason: "展開・枠順の噛み合いを評価" },
            { num: "—", name: "穴候補", role: "単穴", reason: "上がり期待と人気薄妙味" },
            { num: "—", name: "連下候補", role: "連下", reason: "安定感で点数の土台に" }
          ],
          tickets: [
            { type: "馬連", legs: "軸→相手3頭", points: "3点", stake: "¥1,500", note: "信頼度 " + overall + "% を軸に構築" },
            { type: "ワイド", legs: "軸→相手2頭", points: "2点", stake: "¥1,000", note: "的中率を確保" },
            { type: "三連複", legs: "軸＋相手2〜3", points: "2-3点", stake: "¥1,000", note: "点数を抑えたフォーメーション" },
            { type: "三連単", legs: "1着固定マルチ抑制", points: "6点前後", stake: "¥1,200", note: "資金配分の上限を守る" }
          ],
          scenarios: [
            { title: "基本シナリオ", body: "AI総合 " + overall + "%。好位〜中団から差し切る展開を主軸に組み立てる。" },
            { title: "崩しシナリオ", body: "ペースが想定と異なる場合は対抗を厚めに残し、深追いは避ける。" },
            { title: "波乱シナリオ", body: "馬場・枠のバイアスが出た場合のみ穴を1頭まで許容する。" }
          ],
          risk: "総合評価が80%未満のレースは点数を増やさず、ワイド中心で抑える。",
          bankroll: { total: "¥4,700", main: "55%", cover: "30%", lottery: "15%" }
        };
      }

      function strategyFromBundle(bundle) {
        if (!bundle) return null;
        var bind = window.ExpectPredictionBind || {};
        var honmei = bind.honmeiRunner ? bind.honmeiRunner(bundle) : null;
        var taikou = bind.runnerByMark ? bind.runnerByMark(bundle, "taikou") : null;
        var ana = bind.runnerByMark ? bind.runnerByMark(bundle, "ana") : null;
        var chuuken = bind.runnerByMark ? bind.runnerByMark(bundle, "chuuken") : null;
        var conf = bind.scorePercent ? bind.scorePercent(bundle) : null;
        var reasons = ((bundle.explain || {}).reasons) || [];
        function horseName(r) {
          if (!r) return "";
          if (window.ExpectRaceIdMeta && ExpectRaceIdMeta.displayHorseName) {
            return ExpectRaceIdMeta.displayHorseName(r.horse_name, r.horse_number);
          }
          return r.horse_name || "";
        }
        function reasonFor(num) {
          for (var i = 0; i < reasons.length; i++) {
            if (Number(reasons[i].horse_number) === Number(num)) {
              return reasons[i].bullets && reasons[i].bullets[0]
                ? reasons[i].bullets[0]
                : "展開・実績から評価";
            }
          }
          return "展開・実績から評価";
        }
        var rivals = [];
        if (taikou) {
          rivals.push({
            num: String(taikou.horse_number),
            name: horseName(taikou),
            role: "対抗",
            reason: reasonFor(taikou.horse_number),
          });
        }
        if (ana) {
          rivals.push({
            num: String(ana.horse_number),
            name: horseName(ana),
            role: "単穴",
            reason: reasonFor(ana.horse_number),
          });
        }
        if (chuuken) {
          rivals.push({
            num: String(chuuken.horse_number),
            name: horseName(chuuken),
            role: "連下",
            reason: reasonFor(chuuken.horse_number),
          });
        }
        var BET_JA = {
          win: "単勝",
          place: "複勝",
          quinella: "馬連",
          exacta: "馬単",
          wide: "ワイド",
          trio: "三連複",
          trifecta: "三連単",
        };
        var items = ((bundle.betting_recommendations || {}).items) || [];
        var tickets = items.slice(0, 6).map(function (it) {
          var rawType = String(it.bet_type || "買い目");
          return {
            type: BET_JA[rawType.toLowerCase()] || rawType,
            legs: it.legs_display || "—",
            points: it.recommendation_rank != null ? "#" + it.recommendation_rank : "—",
            stake: it.recommendation_score != null ? "優先度 " + it.recommendation_score : "—",
            note: it.comment || "",
          };
        });
        return {
          axis: {
            num: honmei ? String(honmei.horse_number) : "—",
            name: honmei ? horseName(honmei) || "本命" : "本命候補",
            role: "本命軸",
            odds: "—",
          },
          rivals: rivals.length ? rivals : fallbackStrategy().rivals,
          tickets: tickets.length ? tickets : fallbackStrategy().tickets,
          scenarios: [
            {
              title: "基本シナリオ",
              body: (bundle.explain && bundle.explain.narrative) || "AI評価に基づく基本シナリオです。",
            },
          ],
          risk: "推奨買い目に準拠。点数は増やしすぎない。",
          bankroll: { total: "推奨額", main: "55%", cover: "30%", lottery: "15%" },
          aiOverall: conf,
        };
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function paramRows(analysisData) {
        var labels = ExpectFavorites.AI_PARAM_LABELS;
        var keys = ["pedigree", "pace", "jockey", "form", "odds"];
        var chart = analysisData && ExpectApi.Analysis.chartMap
          ? ExpectApi.Analysis.chartMap(analysisData)
          : ai;
        return keys
          .map(function (k) {
            var v = chart[k] || 0;
            return (
              '<div class="score-row"><span>' +
              escapeHtml(labels[k] || k) +
              '</span><div class="score-bar"><i style="width:' +
              v +
              '%"></i></div><b>' +
              v +
              "</b></div>"
            );
          })
          .join("");
      }

      function paintStrategy(data, analysisData, bundle) {
        var back = document.getElementById("strategyBack");
        var sub = document.getElementById("strategySub");
        if (back) back.href = "race.html?race_id=" + encodeURIComponent(id);
        if (bundle && bundle.race_info) {
          var info = bundle.race_info;
          meta.place =
            (window.ExpectRaceIdMeta && ExpectRaceIdMeta.displayPlace(id, null)) ||
            (info.venue || "") + (info.race_no != null ? " " + info.race_no + "R" : "") ||
            meta.place;
          meta.name = info.class_label || meta.name;
          meta.badge = info.grade || meta.badge;
          meta.postTime = info.post_time || meta.postTime;
        } else if (window.ExpectRaceIdMeta) {
          meta.place = ExpectRaceIdMeta.displayPlace(id, meta.place);
        }
        if (sub) sub.textContent = (meta.place || "レース") + (meta.name ? " · " + meta.name : "");

        var rivalsHtml = data.rivals
        .map(function (r) {
          return (
            '<li class="strategy-rival">' +
            '<span class="strategy-num">' +
            escapeHtml(r.num) +
            "</span>" +
            "<div><strong>" +
            escapeHtml(r.name) +
            ' <em>' +
            escapeHtml(r.role) +
            "</em></strong>" +
            "<p>" +
            escapeHtml(r.reason) +
            "</p></div></li>"
          );
        })
        .join("");

      var ticketsHtml = data.tickets
        .map(function (t, i) {
          return (
            '<article class="strategy-ticket' +
            (i === 0 ? " is-main" : "") +
            '">' +
            '<div class="strategy-ticket-top">' +
            "<h4>" +
            escapeHtml(t.type) +
            "</h4>" +
            "<b>" +
            escapeHtml(t.stake) +
            "</b></div>" +
            '<p class="strategy-legs">' +
            escapeHtml(t.legs) +
            "</p>" +
            '<p class="strategy-ticket-meta">' +
            escapeHtml(t.points) +
            " · " +
            escapeHtml(t.note) +
            "</p></article>"
          );
        })
        .join("");

      var scenariosHtml = data.scenarios
        .map(function (s) {
          return (
            '<li><strong>' +
            escapeHtml(s.title) +
            "</strong><p>" +
            escapeHtml(s.body) +
            "</p></li>"
          );
        })
        .join("");

      document.getElementById("strategyScreen").innerHTML =
        '<section class="strategy-hero">' +
        '<p class="strategy-kicker">買い目の組み立て</p>' +
        "<h2>" +
        escapeHtml(meta.place || "レース") +
        "</h2>" +
        "<p>" +
        escapeHtml(meta.name || "") +
        (meta.badge ? " · " + escapeHtml(meta.badge) : "") +
        (meta.postTime ? " · 発走 " + escapeHtml(meta.postTime) : "") +
        "</p>" +
        '<div class="strategy-hero-stats">' +
        "<div><span>AI総合</span><b>" +
        (data.aiOverall != null ? data.aiOverall : ai.overall || "—") +
        "%</b></div>" +
        "<div><span>推奨総額</span><b>" +
        escapeHtml(data.bankroll.total) +
        "</b></div>" +
        "<div><span>主軸配分</span><b>" +
        escapeHtml(data.bankroll.main) +
        "</b></div>" +
        "</div></section>" +
        '<section class="chart-card">' +
        "<h3>軸馬と相手評価</h3>" +
        '<div class="strategy-axis">' +
        '<span class="strategy-num strategy-num--axis">' +
        escapeHtml(data.axis.num) +
        "</span>" +
        "<div><strong>" +
        escapeHtml(data.axis.name) +
        "</strong>" +
        "<p>" +
        escapeHtml(data.axis.role) +
        " · 想定オッズ " +
        escapeHtml(data.axis.odds) +
        "</p></div></div>" +
        '<ul class="strategy-rivals">' +
        rivalsHtml +
        "</ul></section>" +
        '<section class="chart-card">' +
        "<h3>推奨買い目フォーメーション</h3>" +
        '<div class="strategy-tickets">' +
        ticketsHtml +
        "</div></section>" +
        '<section class="chart-card">' +
        "<h3>展開シナリオ別の立ち回り</h3>" +
        '<ol class="strategy-scenarios">' +
        scenariosHtml +
        "</ol></section>" +
        '<section class="chart-card">' +
        "<h3>資金配分</h3>" +
        '<div class="strategy-bank">' +
        "<div><span>主軸（馬連・ワイド）</span><b>" +
        escapeHtml(data.bankroll.main) +
        "</b></div>" +
        "<div><span>保険（三連複）</span><b>" +
        escapeHtml(data.bankroll.cover) +
        "</b></div>" +
        "<div><span>一発（三連単）</span><b>" +
        escapeHtml(data.bankroll.lottery) +
        "</b></div>" +
        "</div>" +
        '<p class="strategy-risk"><strong>リスク管理:</strong> ' +
        escapeHtml(data.risk) +
        "</p></section>" +
        '<section class="chart-card">' +
        "<h3>AIパラメータ根拠</h3>" +
        '<div class="score-list">' +
        paramRows(analysisData) +
        "</div></section>" +
        '<div class="strategy-actions">' +
        '<a class="strategy-btn strategy-btn--ghost" href="race.html?race_id=' +
        encodeURIComponent(id) +
        '">レース詳細へ戻る</a>' +
        '<button type="button" class="strategy-btn" id="consultKaobaBtn">KAOBAに相談する</button>' +
        "</div>";

      document.getElementById("consultKaobaBtn").addEventListener("click", function () {
        var payload = {
          type: "strategy_review",
          raceId: id,
          place: meta.place || "",
          name: meta.name || "",
          badge: meta.badge || "",
          postTime: meta.postTime || "",
          ai: ai,
          axis: data.axis,
          rivals: data.rivals,
          tickets: data.tickets,
          scenarios: data.scenarios,
          bankroll: data.bankroll,
          risk: data.risk,
          summaryText:
            "このレース（" +
            (meta.place || id) +
            (meta.name ? " " + meta.name : "") +
            "）の買い目戦略を評価して。軸は " +
            data.axis.num +
            "番、AI総合" +
            (ai.overall || "—") +
            "%。改善点と最終おすすめを短く教えて。",
          displaySummary:
            (meta.place || "対象レース") +
            " · 軸 " +
            data.axis.num +
            "番 · AI総合 " +
            (ai.overall || "—") +
            "%",
        };

        try {
          sessionStorage.setItem("expect_chat_context_v1", JSON.stringify(payload));
        } catch (e) {}
        location.href = "chat.html?from=strategy&race_id=" + encodeURIComponent(id);
      });

      ExpectShell.initMascotTalk([
        "買い目は点数を抑えつつ<br>軸を明確にするのがコツだよ！",
        "<strong>" +
          escapeHtml(data.axis.name) +
          "</strong> を軸に<br>シナリオ別で相手を変えよう♪"
      ]);
      }

      function loadAndPaint() {
        if (window.ExpectApi && ExpectApi.Prediction && ExpectApi.Prediction.getWithMeta) {
          Promise.all([
            ExpectApi.Prediction.getWithMeta(id),
            ExpectApi.Analysis
              ? ExpectApi.Analysis.get(id).catch(function () { return null; })
              : Promise.resolve(null),
          ])
            .then(function (parts) {
              var result = parts[0];
              var analysisData = parts[1];
              if (result && result.bundle && ExpectFavorites.cacheBundle) {
                ExpectFavorites.cacheBundle(result.bundle);
                meta = ExpectFavorites.getMeta(id);
                ai = ExpectFavorites.getAi(id);
              }
              var fromBundle = strategyFromBundle(result.bundle);
              var data = fromBundle || fallbackStrategy();
              if (fromBundle && fromBundle.aiOverall != null) {
                ai.overall = fromBundle.aiOverall;
              }
              paintStrategy(data, analysisData, result.bundle);
            })
            .catch(function () {
              paintStrategy(fallbackStrategy(), null, null);
            });
          return;
        }
        paintStrategy(fallbackStrategy(), null, null);
      }

      loadAndPaint();
    })();
  </script>
</body>
</html>
