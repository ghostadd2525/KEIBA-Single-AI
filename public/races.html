<body class="page-screen page-races" data-nav="race">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text">
            <p class="brand-name">Expect</p>
            <p class="brand-sub">～ KEIBA AI ～</p>
          </div>
        </div>
        <div class="topbar-tools">
          <div class="race-sort">
            <button type="button" class="icon-btn" id="raceSortOpen" aria-label="並び替え" aria-haspopup="menu" aria-expanded="false" title="並び替え">
              <svg class="nav-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="race-sort-panel" id="raceSortPanel" hidden role="menu" aria-label="並び替え">
              <p class="race-sort-head">並び替え</p>
              <button type="button" class="race-sort-item is-active" role="menuitem" data-sort="conf-desc">自信度が高い順</button>
              <button type="button" class="race-sort-item" role="menuitem" data-sort="conf-asc">自信度が低い順</button>
              <button type="button" class="race-sort-item" role="menuitem" data-sort="time-asc">発走が早い順</button>
              <button type="button" class="race-sort-item" role="menuitem" data-sort="time-desc">発走が遅い順</button>
              <button type="button" class="race-sort-item" role="menuitem" data-sort="venue-asc">会場名順</button>
            </div>
          </div>
          <button type="button" class="icon-btn" id="raceSearchOpen" aria-label="レース検索" aria-haspopup="dialog" title="レース検索">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="race-search-root" id="raceSearchRoot" hidden>
      <div class="race-search-backdrop" data-race-search-close></div>
      <div class="race-search-sheet" role="dialog" aria-modal="true" aria-labelledby="raceSearchTitle">
        <div class="race-search-head">
          <div>
            <p class="race-search-kicker">SEARCH</p>
            <h2 id="raceSearchTitle">レース検索</h2>
          </div>
          <button type="button" class="icon-btn race-search-close" data-race-search-close aria-label="閉じる">✕</button>
        </div>
        <label class="race-search-field">
          <span>キーワード</span>
          <input type="search" id="raceSearchQuery" placeholder="レース名・会場・R・本命馬名（例: コルドン / 阪神 11R）" autocomplete="off" />
        </label>
        <div class="race-search-block">
          <p class="race-search-label">開催日</p>
          <div class="chip-row" id="raceSearchDates"></div>
        </div>
        <div class="race-search-block">
          <p class="race-search-label">開催会場</p>
          <div class="chip-row" id="raceSearchVenues"></div>
        </div>
        <p class="race-search-count" id="raceSearchCount">条件に合うレースを表示します</p>
        <div class="race-search-actions">
          <button type="button" class="race-search-reset" id="raceSearchReset">条件クリア</button>
          <button type="button" class="race-search-apply" id="raceSearchApply">この条件で見る</button>
        </div>
      </div>
    </div>

    <div class="screen">
      <div class="race-filters" id="raceFilters">
        <div class="tab-row date-tabs chip-row" id="dateTabs"></div>
        <div class="chip-row" id="venueChips" aria-label="開催会場"></div>
        <p class="heat-note race-filters-note" id="raceFilterNote">今週の対象会場は3場（すべて／各会場で絞り込み）。お気に入りは最大3件です。</p>
      </div>

      <div class="race-list" id="raceList" aria-busy="true">
        <div class="expect-skeleton" id="raceListSkeleton" role="status" aria-label="レース読み込み中">
          <div class="expect-skel expect-skel--card"></div>
          <div class="expect-skel expect-skel--card"></div>
          <div class="expect-skel expect-skel--card"></div>
          <div class="expect-skel expect-skel--card"></div>
        </div>
        <p class="race-list-empty" id="raceListEmpty" hidden>レースを読み込み中…</p>
      </div>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KAOBAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>

  <script src="assets/api/auth.js"></script>
  <script src="assets/api/contract-guard.js"></script>

  <script src="assets/api/race.js"></script>
  <script src="assets/api/race-cards.js?v=12"></script>
  <script src="assets/api/prediction.js"></script>
  <script src="assets/api/race-id-meta.js"></script>
  <script src="assets/api/prediction-bind.js?v=13"></script>
  <script src="assets/api/real-data-bind.js"></script>
  <script src="assets/ux.js"></script>
  <script src="assets/api/ui-features.js?v=12"></script>
  <script src="assets/api/race-search.js?v=13"></script>
  <script src="assets/v11.js?v=11"></script>
  <script src="assets/favorites.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    ExpectShell.initMascotTalk([
      "気になるレースは<br>★ でお気に入り登録してね！",
      "お気に入りは最大3件だよ。<br>古いは順に外れるよ！"
    ]);
    ExpectShell.initChips("#dateTabs");
    ExpectShell.initChips("#venueChips");

    /** v2 一覧コントローラ（Flag ON 時の date 再 fetch） */
    var raceListController = {
      mode: "v1",
      loadedDate: "",
      reload: null,
    };

    var raceListUi = {
      booted: false,
      applyFilters: null,
      syncDateFromUrl: null,
    };

    function bootRaceUi() {
    ExpectFavorites.bindButtons();

    if (raceListUi.booted) {
      if (typeof raceListUi.syncDateFromUrl === "function") {
        raceListUi.syncDateFromUrl({ normalize: false });
      }
      if (typeof raceListUi.applyFilters === "function") {
        raceListUi.applyFilters();
      }
      return;
    }
    raceListUi.booted = true;

    (function initRaceSearch() {
      var root = document.getElementById("raceSearchRoot");
      var openBtn = document.getElementById("raceSearchOpen");
      var queryInput = document.getElementById("raceSearchQuery");
      var countEl = document.getElementById("raceSearchCount");
      var emptyEl = document.getElementById("raceListEmpty");
      var noteEl = document.getElementById("raceFilterNote");
      var list = document.getElementById("raceList");
      if (!root || !openBtn || !list) return;

      var state = { q: "", date: "all", venue: "all" };

      function items() {
        return Array.prototype.slice.call(list.querySelectorAll(".race-item"));
      }

      function setActive(container, attr, value) {
        if (!container) return;
        container.querySelectorAll("[" + attr + "]").forEach(function (el) {
          el.classList.toggle("is-active", el.getAttribute(attr) === value);
        });
      }

      function writeDateUrl(dateValue, mode) {
        if (!window.ExpectRaceListUrl || !ExpectRaceListUrl.writeDate) return;
        var iso =
          dateValue && dateValue !== "all" ? dateValue : null;
        ExpectRaceListUrl.writeDate(iso, { mode: mode || "push" });
      }

      /** URL ?date= を唯一の状態源として state.date へ反映 */
      function syncDateFromUrl(opts) {
        opts = opts || {};
        if (!window.ExpectRaceListUrl) return;
        var date =
          opts.normalize
            ? ExpectRaceListUrl.normalizeLocation()
            : (ExpectRaceListUrl.resolveFromLocation().date);
        state.date = date || "all";
      }

      function match(item) {
        if (window.ExpectRaceSearch && ExpectRaceSearch.matchElement) {
          return ExpectRaceSearch.matchElement(item, state);
        }
        // Fallback（race-search.js 未読込時）— Catalog のみ（v1.1 同等）
        var date = item.getAttribute("data-race-date") || "";
        var venue = item.getAttribute("data-race-venue") || "";
        var name = item.getAttribute("data-race-name") || "";
        var place = item.getAttribute("data-race-place") || "";
        var hay = (date + " " + venue + " " + name + " " + place).toLowerCase();
        if (state.date !== "all" && date !== state.date) return false;
        if (state.venue !== "all" && venue !== state.venue) return false;
        if (state.q) {
          var tokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
          for (var i = 0; i < tokens.length; i++) {
            if (hay.indexOf(tokens[i]) < 0) return false;
          }
        }
        return true;
      }

      function applyFilters() {
        var shown = 0;
        items().forEach(function (item) {
          var ok = match(item);
          item.hidden = !ok;
          if (ok) shown += 1;
        });
        if (emptyEl) emptyEl.hidden = shown > 0;
        if (countEl) {
          countEl.textContent =
            shown + "件のレースが見つかりました（全" + items().length + "件中）";
        }
        if (noteEl) {
          var parts = [];
          if (state.date !== "all") parts.push(state.date);
          if (state.venue !== "all") parts.push(state.venue);
          if (state.q) parts.push("「" + state.q + "」");
          var sortPart = list.getAttribute("data-sort-label") || "";
          if (parts.length) {
            noteEl.textContent =
              "検索中: " + parts.join(" / ") + " → " + shown + "件" +
              (sortPart ? " ／ " + sortPart : "");
          } else {
            noteEl.textContent = sortPart
              ? "並び替え: " + sortPart + " ／ 今週の対象会場は3場。お気に入りは最大3件です。"
              : "今週の対象会場は3場（すべて／各会場で絞り込み）。お気に入りは最大3件です。";
          }
        }
        // 上部チップと同期
        if (state.date !== "all") {
          setActive(document.getElementById("dateTabs"), "data-filter-date", state.date);
        } else {
          setActive(document.getElementById("dateTabs"), "data-filter-date", "all");
        }
        setActive(document.getElementById("venueChips"), "data-venue", state.venue);
        setActive(document.getElementById("raceSearchDates"), "data-search-date", state.date);
        setActive(document.getElementById("raceSearchVenues"), "data-search-venue", state.venue);
      }

      raceListUi.applyFilters = applyFilters;
      raceListUi.syncDateFromUrl = syncDateFromUrl;

      function openSearch() {
        root.hidden = false;
        document.body.classList.add("is-race-search");
        setActive(document.getElementById("raceSearchDates"), "data-search-date", state.date);
        setActive(document.getElementById("raceSearchVenues"), "data-search-venue", state.venue);
        if (queryInput) {
          queryInput.value = state.q;
          setTimeout(function () { queryInput.focus(); }, 40);
        }
        applyFilters();
      }

      function closeSearch() {
        root.hidden = true;
        document.body.classList.remove("is-race-search");
      }

      openBtn.addEventListener("click", function (e) {
        e.preventDefault();
        openSearch();
      });

      root.addEventListener("click", function (e) {
        if (e.target.closest("[data-race-search-close]")) closeSearch();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !root.hidden) closeSearch();
      });

      document.getElementById("raceSearchDates").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-search-date]");
        if (!btn) return;
        state.date = btn.getAttribute("data-search-date") || "all";
        writeDateUrl(state.date, "push");
        setActive(this, "data-search-date", state.date);
        applyFilters();
      });

      document.getElementById("raceSearchVenues").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-search-venue]");
        if (!btn) return;
        state.venue = btn.getAttribute("data-search-venue") || "all";
        setActive(this, "data-search-venue", state.venue);
        applyFilters();
      });

      queryInput.addEventListener("input", function () {
        state.q = (queryInput.value || "").trim();
        applyFilters();
      });

      document.getElementById("raceSearchReset").addEventListener("click", function () {
        state = { q: "", date: "all", venue: "all" };
        queryInput.value = "";
        writeDateUrl(null, "push");
        applyFilters();
      });

      document.getElementById("raceSearchApply").addEventListener("click", function () {
        applyFilters();
        closeSearch();
        if (ExpectShell.speakMascot) {
          ExpectShell.speakMascot("条件で絞り込んだよ！<br>気になるレースを選んでね♪", 4200);
        }
      });

      function onDateSelected(nextDate) {
        state.date = nextDate || "all";
        writeDateUrl(state.date, "push");
        if (
          raceListController.mode === "v2" &&
          state.date !== "all" &&
          state.date !== raceListController.loadedDate &&
          typeof raceListController.reload === "function"
        ) {
          raceListController.reload(state.date);
          return;
        }
        applyFilters();
      }

      // 上部の日付・会場チップでも絞り込み（日付は URL 同期）
      document.getElementById("dateTabs").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-filter-date]");
        if (!btn) return;
        onDateSelected(btn.getAttribute("data-filter-date") || "all");
      });

      document.getElementById("venueChips").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-venue]");
        if (!btn) return;
        state.venue = btn.getAttribute("data-venue") || "all";
        applyFilters();
      });

      syncDateFromUrl({ normalize: true });
      applyFilters();

      if (window.ExpectRaceListUrl && ExpectRaceListUrl.bindPopState) {
        ExpectRaceListUrl.bindPopState(function () {
          syncDateFromUrl({ normalize: false });
          if (
            raceListController.mode === "v2" &&
            state.date !== "all" &&
            state.date !== raceListController.loadedDate &&
            typeof raceListController.reload === "function"
          ) {
            raceListController.reload(state.date);
            return;
          }
          applyFilters();
        });
      }

      (function initRaceSort() {
        var wrap = document.querySelector(".race-sort");
        var btn = document.getElementById("raceSortOpen");
        var panel = document.getElementById("raceSortPanel");
        if (!wrap || !btn || !panel) return;

        var sortKey = "conf-desc";
        var labels = {
          "conf-desc": "自信度が高い順",
          "conf-asc": "自信度が低い順",
          "time-asc": "発走が早い順",
          "time-desc": "発走が遅い順",
          "venue-asc": "会場名順"
        };

        function timeValue(t) {
          var p = String(t || "0:0").split(":");
          return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
        }

        function applySort() {
          var rows = items().slice();
          rows.sort(function (a, b) {
            var ca = parseInt(a.getAttribute("data-race-conf") || "0", 10);
            var cb = parseInt(b.getAttribute("data-race-conf") || "0", 10);
            var ta = timeValue(a.getAttribute("data-race-time"));
            var tb = timeValue(b.getAttribute("data-race-time"));
            var va = a.getAttribute("data-race-venue") || "";
            var vb = b.getAttribute("data-race-venue") || "";
            if (sortKey === "conf-desc") return cb - ca;
            if (sortKey === "conf-asc") return ca - cb;
            if (sortKey === "time-asc") return ta - tb;
            if (sortKey === "time-desc") return tb - ta;
            if (sortKey === "venue-asc") {
              if (va === vb) return ta - tb;
              return va.localeCompare(vb, "ja");
            }
            return 0;
          });
          rows.forEach(function (row) {
            list.appendChild(row);
          });
          if (emptyEl) list.insertBefore(emptyEl, list.firstChild);
          list.setAttribute("data-sort-label", labels[sortKey] || "");
          panel.querySelectorAll("[data-sort]").forEach(function (el) {
            el.classList.toggle("is-active", el.getAttribute("data-sort") === sortKey);
          });
        }

        function close() {
          wrap.classList.remove("is-open");
          panel.hidden = true;
          btn.setAttribute("aria-expanded", "false");
        }

        function open() {
          wrap.classList.add("is-open");
          panel.hidden = false;
          btn.setAttribute("aria-expanded", "true");
        }

        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (wrap.classList.contains("is-open")) close();
          else open();
        });

        panel.addEventListener("click", function (e) {
          var item = e.target.closest("[data-sort]");
          if (!item) return;
          sortKey = item.getAttribute("data-sort") || "conf-desc";
          applySort();
          applyFilters();
          close();
          if (ExpectShell.speakMascot) {
            ExpectShell.speakMascot(
              "並び替えたよ！<br><strong>" + (labels[sortKey] || "") + "</strong>",
              3800
            );
          }
        });

        document.addEventListener("click", function (e) {
          if (!wrap.contains(e.target)) close();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") close();
        });

        applySort();
      })();
    })();
    } // bootRaceUi

    (function loadRacesFromApi() {
      var list = document.getElementById("raceList");
      if (!list) return;

      function renderError(message) {
        list.setAttribute("aria-busy", "false");
        list.innerHTML = "";
        if (window.ExpectUx) {
          list.appendChild(
            ExpectUx.stateCard({
              kind: "error",
              title: "レース一覧を表示できません",
              message: message || "通信エラーのため一覧を更新できませんでした。",
              onRetry: function () {
                location.reload();
              },
            })
          );
        } else {
          list.innerHTML =
            '<p class="race-list-empty" id="raceListEmpty">レースの取得に失敗しました。再読み込みしてください。</p>';
        }
        bootRaceUi();
      }

      function cardsToFilterShapes(cards, listDate) {
        return (cards || []).map(function (c) {
          var info = (c && c.race_info) || {};
          var conf =
            c && c.summary && c.summary.confidence && typeof c.summary.confidence.score === "number"
              ? c.summary.confidence.score
              : null;
          return {
            race_id: c.race_id,
            race_info: {
              date: listDate || "",
              venue: info.venue || "",
              race_no: info.race_number,
              race_name: info.race_name || "",
              post_time: info.post_time || "",
              date_label:
                window.ExpectRaceListUrl && ExpectRaceListUrl.dateLabelFromIso
                  ? ExpectRaceListUrl.dateLabelFromIso(listDate)
                  : "",
            },
            ai_confidence: { score: conf },
          };
        });
      }

      function renderV1Bundles(bundles) {
        var filtered = window.ExpectContractGuard
          ? ExpectContractGuard.filterValidBundles(bundles)
          : { ok: bundles || [], rejected: [] };
        var races = filtered.ok;
        var html = races.map(ExpectPredictionBind.raceCardHtml).join("");
        list.setAttribute("aria-busy", "false");
        list.innerHTML =
          '<p class="race-list-empty" id="raceListEmpty" hidden>条件に合うレースがありません。検索条件を変えてみてください。</p>' +
          html;
        if (filtered.rejected.length && window.ExpectContractGuard) {
          ExpectContractGuard.showErrorCard(list, {
            title: "一部レースを表示できません",
            message:
              filtered.rejected.length +
              "件が PredictionBundle 契約違反のため除外しました。",
            errors: (filtered.rejected[0] && filtered.rejected[0].errors) || [],
          });
        }
        if (!races.length) {
          var e2 = document.getElementById("raceListEmpty");
          if (e2) {
            e2.hidden = false;
            e2.textContent = filtered.rejected.length
              ? "契約を満たすレースがありません。"
              : "レースがありません。";
          }
        }
        if (window.ExpectRealDataBind) {
          ExpectRealDataBind.cacheBundles(races);
          ExpectRealDataBind.applyRacesFilters(races);
        }
        bootRaceUi();
      }

      function renderV2Cards(payload) {
        var cards = (payload && payload.race_cards) || [];
        var listDate = (payload && payload.date) || "";
        raceListController.loadedDate = listDate;
        var html = cards
          .map(function (card) {
            return ExpectPredictionBind.raceCardSummaryHtml(card, { listDate: listDate });
          })
          .join("");
        list.setAttribute("aria-busy", "false");
        list.innerHTML =
          '<p class="race-list-empty" id="raceListEmpty" hidden>条件に合うレースがありません。検索条件を変えてみてください。</p>' +
          html;
        if (!cards.length) {
          var e2 = document.getElementById("raceListEmpty");
          if (e2) {
            e2.hidden = false;
            e2.textContent = "レースがありません。";
          }
        }
        var shapes = cardsToFilterShapes(cards, listDate);
        if (window.ExpectRealDataBind) {
          ExpectRealDataBind.cacheBundles(shapes);
          ExpectRealDataBind.applyRacesFilters(shapes);
        }
        // Phase 5: RaceCardSummary を最後に cache（shapes 上書き後に summary を復元）
        if (window.ExpectFavorites && typeof ExpectFavorites.cacheBundles === "function") {
          ExpectFavorites.cacheBundles(cards);
        }
        bootRaceUi();
      }

      function loadV1() {
        raceListController.mode = "v1";
        if (!window.ExpectApi || !ExpectApi.Prediction || !window.ExpectPredictionBind) {
          renderError("API クライアントが読み込めていません。");
          return;
        }
        ExpectApi.Prediction.list({})
          .then(renderV1Bundles)
          .catch(function () {
            renderError("通信エラーのため一覧を更新できませんでした。");
          });
      }

      function loadV2(dateOpt) {
        raceListController.mode = "v2";
        if (!window.ExpectApi || !ExpectApi.RaceCards || !window.ExpectPredictionBind) {
          renderError("RaceCardSummary クライアントが読み込めていません。");
          return;
        }
        list.setAttribute("aria-busy", "true");
        ExpectApi.RaceCards.list({ date: dateOpt || undefined })
          .then(renderV2Cards)
          .catch(function (err) {
            renderError(
              (err && err.message) ||
                "通信エラーのため一覧を更新できませんでした。"
            );
          });
      }

      raceListController.reload = function (date) {
        loadV2(date);
      };

      function start() {
        var useV2 =
          window.ExpectUiFeatures &&
          typeof ExpectUiFeatures.enabled === "function" &&
          ExpectUiFeatures.enabled("v2_race_list_ui");
        if (useV2) loadV2();
        else loadV1();
      }

      if (window.ExpectUiFeatures && typeof ExpectUiFeatures.ready === "function") {
        ExpectUiFeatures.ready(function () {
          start();
        });
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
