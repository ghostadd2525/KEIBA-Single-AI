  <script>
    ExpectShell.initMascotTalk([
      "気になるレースは<br>★ でお気に入り登録してね！",
      "お気に入りは最大3件だよ。<br>古いは順に外れるよ！"
    ]);
    ExpectShell.initChips("#dateTabs");
    ExpectShell.initChips("#venueChips");

    /** v2 一覧コントローラ（Flag ON 時の date 再 fetch） */
    var raceListController = {
      mode: "v1",
      loadedDate: "",
      reload: null,
    };

    var raceListUi = {
      booted: false,
      applyFilters: null,
      syncDateFromUrl: null,
    };

    function bootRaceUi() {
    ExpectFavorites.bindButtons();

    if (raceListUi.booted) {
      if (typeof raceListUi.syncDateFromUrl === "function") {
        raceListUi.syncDateFromUrl({ normalize: false });
      }
      if (typeof raceListUi.applyFilters === "function") {
        raceListUi.applyFilters();
      }
      return;
    }
    raceListUi.booted = true;

    (function initRaceSearch() {
      var root = document.getElementById("raceSearchRoot");
      var openBtn = document.getElementById("raceSearchOpen");
      var queryInput = document.getElementById("raceSearchQuery");
      var countEl = document.getElementById("raceSearchCount");
      var emptyEl = document.getElementById("raceListEmpty");
      var noteEl = document.getElementById("raceFilterNote");
      var list = document.getElementById("raceList");
      if (!root || !openBtn || !list) return;

      var state = { q: "", date: "all", venue: "all" };

      function items() {
        return Array.prototype.slice.call(list.querySelectorAll(".race-item"));
      }

      function setActive(container, attr, value) {
        if (!container) return;
        container.querySelectorAll("[" + attr + "]").forEach(function (el) {
          el.classList.toggle("is-active", el.getAttribute(attr) === value);
        });
      }

      function writeDateUrl(dateValue, mode) {
        if (!window.ExpectRaceListUrl || !ExpectRaceListUrl.writeDate) return;
        var iso =
          dateValue && dateValue !== "all" ? dateValue : null;
        ExpectRaceListUrl.writeDate(iso, { mode: mode || "push" });
      }

      /** URL ?date= を唯一の状態源として state.date へ反映 */
      function syncDateFromUrl(opts) {
        opts = opts || {};
        if (!window.ExpectRaceListUrl) return;
        var date =
          opts.normalize
            ? ExpectRaceListUrl.normalizeLocation()
            : (ExpectRaceListUrl.resolveFromLocation().date);
        state.date = date || "all";
      }

      function match(item) {
        if (window.ExpectRaceSearch && ExpectRaceSearch.matchElement) {
          return ExpectRaceSearch.matchElement(item, state);
        }
        // Fallback（race-search.js 未読込時）— Catalog のみ（v1.1 同等）
        var date = item.getAttribute("data-race-date") || "";
        var venue = item.getAttribute("data-race-venue") || "";
        var name = item.getAttribute("data-race-name") || "";
        var place = item.getAttribute("data-race-place") || "";
        var time = item.getAttribute("data-race-time") || "";
        var hay = (date + " " + venue + " " + name + " " + place).toLowerCase();
        if (state.date !== "all" && date !== state.date) return false;
        if (state.venue !== "all" && venue !== state.venue) return false;
        if (
          window.ExpectRaceSearch &&
          ExpectRaceSearch.isPostTimePassed &&
          ExpectRaceSearch.isPostTimePassed(date, time)
        ) {
          return false;
        }
        if (state.q) {
          var tokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
          for (var i = 0; i < tokens.length; i++) {
            if (hay.indexOf(tokens[i]) < 0) return false;
          }
        }
        return true;
      }

      function applyFilters() {
        var shown = 0;
        var emptyNow = document.getElementById("raceListEmpty");
        var rows = items();
        rows.forEach(function (item) {
          var ok = match(item);
          item.hidden = !ok;
          item.classList.toggle("is-filtered-out", !ok);
          if (ok) shown += 1;
        });
        // 選択日のカードが DOM に無い → その日を再ロード（誤った日のまま絞り込みしている状態を救済）
        if (
          shown === 0 &&
          rows.length > 0 &&
          state.date &&
          state.date !== "all" &&
          raceListController.mode === "v2" &&
          typeof raceListController.reload === "function"
        ) {
          var hasSelectedDate = rows.some(function (item) {
            var d = item.getAttribute("data-race-date") || "";
            if (window.ExpectRaceSearch && ExpectRaceSearch.matchRaceSearch) {
              return ExpectRaceSearch.matchRaceSearch({ date: d }, { date: state.date, venue: "all" });
            }
            return d === state.date;
          });
          if (!hasSelectedDate && raceListController.loadedDate !== state.date) {
            raceListController.reload(state.date);
            return;
          }
        }
        if (emptyNow) {
          emptyNow.hidden = shown > 0;
          if (shown === 0) {
            emptyNow.textContent =
              rows.length === 0
                ? "レースがありません。"
                : "条件に合うレースがありません。検索条件を変えてみてください。";
          }
        }
        if (countEl) {
          countEl.textContent =
            shown + "件のレースが見つかりました（全" + rows.length + "件中）";
        }
        if (noteEl) {
          var parts = [];
          if (state.date !== "all") parts.push(state.date);
          if (state.venue !== "all") parts.push(state.venue);
          if (state.q) parts.push("「" + state.q + "」");
          var sortPart = list.getAttribute("data-sort-label") || "";
          if (parts.length) {
            noteEl.textContent =
              "検索中: " + parts.join(" / ") + " → " + shown + "件" +
              (sortPart ? " ／ " + sortPart : "");
          } else {
            noteEl.textContent = sortPart
              ? "並び替え: " + sortPart + " ／ 今週の対象会場は3場。お気に入りは最大3件です。"
              : "今週の対象会場は3場（すべて／各会場で絞り込み）。お気に入りは最大3件です。";
          }
        }
        // 上部チップと同期
        if (state.date !== "all") {
          setActive(document.getElementById("dateTabs"), "data-filter-date", state.date);
        } else {
          setActive(document.getElementById("dateTabs"), "data-filter-date", "all");
        }
        setActive(document.getElementById("venueChips"), "data-venue", state.venue);
        setActive(document.getElementById("raceSearchDates"), "data-search-date", state.date);
        setActive(document.getElementById("raceSearchVenues"), "data-search-venue", state.venue);
      }

      raceListUi.applyFilters = applyFilters;
      raceListUi.syncDateFromUrl = syncDateFromUrl;

      function openSearch() {
        root.hidden = false;
        document.body.classList.add("is-race-search");
        setActive(document.getElementById("raceSearchDates"), "data-search-date", state.date);
        setActive(document.getElementById("raceSearchVenues"), "data-search-venue", state.venue);
        if (queryInput) {
          queryInput.value = state.q;
          setTimeout(function () { queryInput.focus(); }, 40);
        }
        applyFilters();
      }

      function closeSearch() {
        root.hidden = true;
        document.body.classList.remove("is-race-search");
      }

      openBtn.addEventListener("click", function (e) {
        e.preventDefault();
        openSearch();
      });

      root.addEventListener("click", function (e) {
        if (e.target.closest("[data-race-search-close]")) closeSearch();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !root.hidden) closeSearch();
      });

      document.getElementById("raceSearchDates").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-search-date]");
        if (!btn) return;
        state.date = btn.getAttribute("data-search-date") || "all";
        writeDateUrl(state.date, "push");
        setActive(this, "data-search-date", state.date);
        applyFilters();
      });

      document.getElementById("raceSearchVenues").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-search-venue]");
        if (!btn) return;
        state.venue = btn.getAttribute("data-search-venue") || "all";
        setActive(this, "data-search-venue", state.venue);
        applyFilters();
      });

      queryInput.addEventListener("input", function () {
        state.q = (queryInput.value || "").trim();
        applyFilters();
      });

      document.getElementById("raceSearchReset").addEventListener("click", function () {
        state = { q: "", date: "all", venue: "all" };
        queryInput.value = "";
        writeDateUrl(null, "push");
        applyFilters();
      });

      document.getElementById("raceSearchApply").addEventListener("click", function () {
        applyFilters();
        closeSearch();
        if (ExpectShell.speakMascot) {
          ExpectShell.speakMascot("条件で絞り込んだよ！<br>気になるレースを選んでね♪", 4200);
        }
      });

      function onDateSelected(nextDate) {
        state.date = nextDate || "all";
        // 日付切替時は会場フィルタをリセット（別日に会場だけ残って 0 件になるのを防ぐ）
        state.venue = "all";
        writeDateUrl(state.date, "push");
        if (
          raceListController.mode === "v2" &&
          typeof raceListController.reload === "function"
        ) {
          raceListController.reload(state.date === "all" ? "all" : state.date);
          return;
        }
        applyFilters();
      }

      // 上部の日付・会場チップでも絞り込み（日付は URL 同期）
      document.getElementById("dateTabs").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-filter-date]");
        if (!btn) return;
        onDateSelected(btn.getAttribute("data-filter-date") || "all");
      });

      document.getElementById("venueChips").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-venue]");
        if (!btn) return;
        e.preventDefault();
        state.venue = btn.getAttribute("data-venue") || "all";
        setActive(this, "data-venue", state.venue);
        applyFilters();
      });

      syncDateFromUrl({ normalize: true });
      applyFilters();

      // 出走時刻経過後にカードを落とすため、1分ごとに再フィルタ
      setInterval(function () {
        applyFilters();
      }, 60000);

      window.addEventListener("expect:race-filters-ready", function () {
        applyFilters();
      });

      if (window.ExpectRaceListUrl && ExpectRaceListUrl.bindPopState) {
        ExpectRaceListUrl.bindPopState(function () {
          syncDateFromUrl({ normalize: false });
          if (
            raceListController.mode === "v2" &&
            typeof raceListController.reload === "function" &&
            (state.date === "all" || state.date !== raceListController.loadedDate)
          ) {
            raceListController.reload(state.date === "all" ? "all" : state.date);
            return;
          }
          applyFilters();
        });
      }

      (function initRaceSort() {
        var wrap = document.querySelector(".race-sort");
        var btn = document.getElementById("raceSortOpen");
        var panel = document.getElementById("raceSortPanel");
        if (!wrap || !btn || !panel) return;

        var sortKey = "conf-desc";
        var labels = {
          "conf-desc": "自信度が高い順",
          "conf-asc": "自信度が低い順",
          "time-asc": "発走が早い順",
          "time-desc": "発走が遅い順",
          "venue-asc": "会場名順"
        };

        function timeValue(t) {
          var p = String(t || "0:0").split(":");
          return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
        }

        function applySort() {
          var rows = items().slice();
          rows.sort(function (a, b) {
            var ca = parseInt(a.getAttribute("data-race-conf") || "0", 10);
            var cb = parseInt(b.getAttribute("data-race-conf") || "0", 10);
            var ta = timeValue(a.getAttribute("data-race-time"));
            var tb = timeValue(b.getAttribute("data-race-time"));
            var va = a.getAttribute("data-race-venue") || "";
            var vb = b.getAttribute("data-race-venue") || "";
            if (sortKey === "conf-desc") return cb - ca;
            if (sortKey === "conf-asc") return ca - cb;
            if (sortKey === "time-asc") return ta - tb;
            if (sortKey === "time-desc") return tb - ta;
            if (sortKey === "venue-asc") {
              if (va === vb) return ta - tb;
              return va.localeCompare(vb, "ja");
            }
            return 0;
          });
          rows.forEach(function (row) {
            list.appendChild(row);
          });
          if (emptyEl) list.insertBefore(emptyEl, list.firstChild);
          list.setAttribute("data-sort-label", labels[sortKey] || "");
          panel.querySelectorAll("[data-sort]").forEach(function (el) {
            el.classList.toggle("is-active", el.getAttribute("data-sort") === sortKey);
          });
        }

        function close() {
          wrap.classList.remove("is-open");
          panel.hidden = true;
          btn.setAttribute("aria-expanded", "false");
        }

        function open() {
          wrap.classList.add("is-open");
          panel.hidden = false;
          btn.setAttribute("aria-expanded", "true");
        }

        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (wrap.classList.contains("is-open")) close();
          else open();
        });

        panel.addEventListener("click", function (e) {
          var item = e.target.closest("[data-sort]");
          if (!item) return;
          sortKey = item.getAttribute("data-sort") || "conf-desc";
          applySort();
          applyFilters();
          close();
          if (ExpectShell.speakMascot) {
            ExpectShell.speakMascot(
              "並び替えたよ！<br><strong>" + (labels[sortKey] || "") + "</strong>",
              3800
            );
          }
        });

        document.addEventListener("click", function (e) {
          if (!wrap.contains(e.target)) close();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") close();
        });

        applySort();
      })();
    })();
    } // bootRaceUi

    (function loadRacesFromApi() {
      var list = document.getElementById("raceList");
      if (!list) return;

      // v4: 日付フィルタ不整合キャッシュを破棄
      var RACE_LIST_CACHE_KEY = "expect_race_list_cache_v4";
      var RACE_CARDS_TIMEOUT_MS = 65000;
      var RACE_LIST_CACHE_TTL_MS = 5 * 60 * 1000;

      function resolveListDate(dateOpt) {
        if (window.ExpectApi && ExpectApi.RaceCards && ExpectApi.RaceCards.resolveDate) {
          return ExpectApi.RaceCards.resolveDate({ date: dateOpt || undefined }) || "";
        }
        if (window.ExpectApi && ExpectApi.Race && ExpectApi.Race.resolveListDate) {
          return ExpectApi.Race.resolveListDate({ date: dateOpt || undefined }) || "";
        }
        if (dateOpt) return String(dateOpt);
        if (window.ExpectRaceListUrl && ExpectRaceListUrl.calendarFallbackDate) {
          return ExpectRaceListUrl.calendarFallbackDate(new Date()) || "";
        }
        return "";
      }

      function cacheSlotKey(mode, dateKey) {
        return String(mode || "v1") + ":" + String(dateKey || "");
      }

      function readRaceListStore() {
        try {
          var raw = localStorage.getItem(RACE_LIST_CACHE_KEY);
          if (!raw) return { entries: {} };
          var o = JSON.parse(raw);
          if (!o || typeof o !== "object") return { entries: {} };
          if (!o.entries || typeof o.entries !== "object") o.entries = {};
          return o;
        } catch (e) {
          return { entries: {} };
        }
      }

      function writeRaceListStore(store) {
        try {
          localStorage.setItem(RACE_LIST_CACHE_KEY, JSON.stringify(store));
        } catch (e) { /* quota / private mode */ }
      }

      function readRaceListCache(mode, dateKey) {
        var store = readRaceListStore();
        var hit = store.entries[cacheSlotKey(mode, dateKey)];
        if (!hit || !hit.payload) return null;
        if (hit.at && Date.now() - Number(hit.at) > RACE_LIST_CACHE_TTL_MS) {
          return null;
        }
        // missing / processing のみのスナップショットは自信度欠落の原因になるので使わない
        if (mode === "v2" && !cacheHasReadyCards(hit.payload)) {
          return null;
        }
        return hit;
      }

      function writeRaceListCache(mode, dateKey, payload) {
        if (!dateKey && mode === "v2") return;
        // カタログ先行表示や enrich 失敗結果は永続化しない
        if (mode === "v2" && !cacheHasReadyCards(payload)) {
          return;
        }
        var store = readRaceListStore();
        store.entries[cacheSlotKey(mode, dateKey)] = {
          mode: mode,
          date: dateKey || "",
          payload: payload,
          at: Date.now(),
        };
        writeRaceListStore(store);
      }

      function withTimeout(promise, ms, label) {
        return new Promise(function (resolve, reject) {
          var settled = false;
          var timer = setTimeout(function () {
            if (settled) return;
            settled = true;
            var err = new Error(label || "timeout");
            err.code = "TIMEOUT";
            reject(err);
          }, ms);
          Promise.resolve(promise).then(
            function (value) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              resolve(value);
            },
            function (err) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              reject(err);
            }
          );
        });
      }

      function catalogItemsToRaceCards(items, listDate) {
        return (items || []).map(function (item) {
          var info = (item && item.race_info) || {};
          var raceNo =
            info.race_no != null
              ? info.race_no
              : item.race_number != null
                ? item.race_number
                : null;
          return {
            schema_version: "expect-race-card-summary/1.0",
            race_id: item.race_id,
            race_info: {
              venue: info.venue || item.course || "",
              race_number: raceNo,
              race_name: info.race_name || item.race_name || "",
              post_time: info.post_time || null,
              date: info.date || listDate || "",
              date_label: info.date_label || "",
              date_full: info.date_full || "",
              race_label: info.race_label || item.race_label || "",
              class_label: info.class_label || "",
            },
            prediction: { status: "processing", engine_source: null },
            summary: null,
          };
        });
      }

      function cacheHasReadyCards(payload) {
        var cards = (payload && payload.race_cards) || [];
        if (!cards.length) return false;
        if (payload && payload.enriched === true) return true;
        return cards.some(function (c) {
          return c && c.prediction && c.prediction.status === "ready";
        });
      }

      function renderError(message) {
        if (window.ExpectUx && ExpectUx.hideLoading) ExpectUx.hideLoading(list);
        list.setAttribute("aria-busy", "false");
        list.innerHTML = "";
        if (window.ExpectUx) {
          list.appendChild(
            ExpectUx.stateCard({
              kind: "error",
              title: "レース一覧を表示できません",
              message: message || "通信エラーのため一覧を更新できませんでした。",
              onRetry: function () {
                location.reload();
              },
            })
          );
        } else {
          list.innerHTML =
            '<p class="race-list-empty" id="raceListEmpty">レースの取得に失敗しました。再読み込みしてください。</p>';
        }
        bootRaceUi();
      }

      function cardsToFilterShapes(cards, listDate) {
        return (cards || []).map(function (c) {
          var info = (c && c.race_info) || {};
          var conf =
            c && c.summary && c.summary.confidence && typeof c.summary.confidence.score === "number"
              ? c.summary.confidence.score
              : null;
          var iso =
            String(info.date || "").trim() ||
            (String(c.race_id || "").match(/^(\d{4}-\d{2}-\d{2})/) || [])[1] ||
            listDate ||
            "";
          return {
            race_id: c.race_id,
            race_info: {
              date: iso,
              venue: info.venue || "",
              race_no: info.race_number,
              race_name: info.race_name || "",
              post_time: info.post_time || "",
              date_label:
                window.ExpectRaceListUrl && ExpectRaceListUrl.dateLabelFromIso
                  ? ExpectRaceListUrl.dateLabelFromIso(iso)
                  : "",
            },
            ai_confidence: { score: conf },
          };
        });
      }

      function renderV1Bundles(bundles, opts) {
        opts = opts || {};
        if (window.ExpectUx && ExpectUx.hideLoading) ExpectUx.hideLoading(list);
        var filtered = window.ExpectContractGuard
          ? ExpectContractGuard.filterValidBundles(bundles)
          : { ok: bundles || [], rejected: [] };
        var races = filtered.ok;
        var html = races.map(ExpectPredictionBind.raceCardHtml).join("");
        list.setAttribute("aria-busy", "false");
        list.innerHTML =
          '<p class="race-list-empty" id="raceListEmpty" hidden>条件に合うレースがありません。検索条件を変えてみてください。</p>' +
          html;
        if (filtered.rejected.length && window.ExpectContractGuard) {
          ExpectContractGuard.showErrorCard(list, {
            title: "一部レースを表示できません",
            message:
              filtered.rejected.length +
              "件が PredictionBundle 契約違反のため除外しました。",
            errors: (filtered.rejected[0] && filtered.rejected[0].errors) || [],
          });
        }
        if (!races.length) {
          var e2 = document.getElementById("raceListEmpty");
          if (e2) {
            e2.hidden = false;
            e2.textContent = filtered.rejected.length
              ? "契約を満たすレースがありません。"
              : "レースがありません。";
          }
        }
        if (window.ExpectRealDataBind) {
          ExpectRealDataBind.cacheBundles(races);
          ExpectRealDataBind.applyRacesFilters(races);
        }
        if (!opts.fromCache) {
          writeRaceListCache("v1", "all", { bundles: races });
        }
        bootRaceUi();
      }

      function renderV2Cards(payload, opts) {
        opts = opts || {};
        if (window.ExpectUx && ExpectUx.hideLoading) ExpectUx.hideLoading(list);
        var cards = (payload && payload.race_cards) || [];
        var listDate = (payload && payload.date) || "";
        // loadedDate: 複数日は all、単日はその ISO
        if (payload && payload.dates && payload.dates.length > 1) {
          raceListController.loadedDate = "all";
        } else if (listDate) {
          raceListController.loadedDate = listDate;
        }
        var html = cards
          .map(function (card) {
            // カード個別の日付を優先（weekend 混在時の誤ラベル防止）
            var cardDate =
              (card && card.race_info && card.race_info.date) ||
              (String((card && card.race_id) || "").match(/^(\d{4}-\d{2}-\d{2})/) ||
                [])[1] ||
              listDate;
            return ExpectPredictionBind.raceCardSummaryHtml(card, { listDate: cardDate });
          })
          .join("");
        list.setAttribute("aria-busy", "false");
        list.innerHTML =
          '<p class="race-list-empty" id="raceListEmpty" hidden>条件に合うレースがありません。検索条件を変えてみてください。</p>' +
          html;
        if (!cards.length) {
          var e2 = document.getElementById("raceListEmpty");
          if (e2) {
            e2.hidden = false;
            e2.textContent = "レースがありません。";
          }
        }
        var shapes = cardsToFilterShapes(cards, listDate);
        if (window.ExpectRealDataBind) {
          ExpectRealDataBind.cacheBundles(shapes);
          ExpectRealDataBind.applyRacesFilters(shapes);
        }
        if (window.ExpectFavorites && typeof ExpectFavorites.cacheBundles === "function") {
          ExpectFavorites.cacheBundles(cards);
        }
        if (!opts.fromCache) {
          writeRaceListCache("v2", listDate || resolveListDate(""), payload);
        }
        bootRaceUi();
      }

      function enrichFromRaceCards(dateKey, dateOpt) {
        if (!window.ExpectApi || !ExpectApi.RaceCards) return Promise.resolve(null);
        return withTimeout(
          ExpectApi.RaceCards.list({ date: dateOpt || dateKey }),
          RACE_CARDS_TIMEOUT_MS,
          "race-cards timeout"
        )
          .then(function (payload) {
            if (!payload) return null;
            payload.enriched = true;
            renderV2Cards(payload);
            return payload;
          })
          .catch(function (err) {
            if (!list.querySelector(".race-item")) {
              var timedOut = err && err.code === "TIMEOUT";
              renderError(
                timedOut
                  ? "予想データの取得がタイムアウトしました。再読み込みしてください。"
                  : "予想データの取得に失敗しました。通信環境を確認して再読み込みしてください。"
              );
            }
            return null;
          });
      }

      function weekendDates() {
        if (window.ExpectWeekendCalendar && ExpectWeekendCalendar.weekendRaceDates) {
          return ExpectWeekendCalendar.weekendRaceDates(new Date()).filter(Boolean);
        }
        var one = resolveListDate("");
        return one ? [one] : [];
      }

      function resolveLoadDates(dateOpt) {
        // 明示指定（単日）
        if (dateOpt && dateOpt !== "all") {
          return [String(dateOpt)];
        }
        // 明示的に「すべて」(null) → URL に date が残っていても土日両方
        if (dateOpt === null || dateOpt === "all") {
          var daysAll = weekendDates();
          return daysAll.length ? daysAll : [resolveListDate("")].filter(Boolean);
        }
        // 初期ロードなど: URL 優先、なければ今週末
        if (window.ExpectRaceListUrl) {
          var fromUrl = ExpectRaceListUrl.resolveFromLocation().date;
          if (fromUrl) return [fromUrl];
        }
        var days = weekendDates();
        return days.length ? days : [resolveListDate("")].filter(Boolean);
      }

      function paintWeekendDateTabs(extraDates) {
        var map = {};
        weekendDates().forEach(function (iso) {
          map[iso] = window.ExpectRaceListUrl && ExpectRaceListUrl.dateLabelFromIso
            ? ExpectRaceListUrl.dateLabelFromIso(iso)
            : iso;
        });
        (extraDates || []).forEach(function (d) {
          var iso = typeof d === "object" ? d.iso : d;
          var label = typeof d === "object" ? d.label : d;
          if (iso) map[iso] = label || map[iso] || iso;
        });
        var dates = Object.keys(map)
          .sort()
          .map(function (iso) {
            return { iso: iso, label: map[iso] };
          });
        if (window.ExpectRealDataBind && ExpectRealDataBind.applyRacesFilters) {
          /* tabs are refreshed in renderV2Cards via applyRacesFilters; seed here too */
        }
        var tabs = document.getElementById("dateTabs");
        if (!tabs || !dates.length) return;
        var html =
          '<button type="button" class="tab-pill" data-filter-date="all">すべて</button>';
        dates.forEach(function (d) {
          html +=
            '<button type="button" class="tab-pill" data-filter-date="' +
            d.iso +
            '">' +
            d.label +
            "</button>";
        });
        tabs.innerHTML = html;
      }

      /**
       * 一覧自信度: 1レースずつ Prediction を取り、揃い次第カードを更新
       * （race-cards 一括が CF 制限で落ちても自信度が出る）
       */
      function enrichProgressive(seedPayload) {
        if (
          !window.ExpectApi ||
          !ExpectApi.Prediction ||
          !window.ExpectPredictionBind ||
          !ExpectPredictionBind.bundleToRaceCardSummary
        ) {
          return Promise.resolve(seedPayload);
        }
        var cards = (seedPayload && seedPayload.race_cards) || [];
        if (!cards.length) return Promise.resolve(seedPayload);

        var byId = {};
        cards.forEach(function (c) {
          byId[c.race_id] = c;
        });
        var ids = cards.map(function (c) {
          return c.race_id;
        });
        var concurrency = 8;
        var next = 0;
        var done = 0;
        var readyCount = 0;

        function snapshot() {
          return {
            schema_version: "expect-race-cards/1.0",
            date: seedPayload.date,
            dates: seedPayload.dates,
            count: ids.length,
            race_cards: ids.map(function (id) {
              return byId[id];
            }),
            enriched: readyCount > 0,
          };
        }

        function paint() {
          renderV2Cards(snapshot());
        }

        function worker() {
          return new Promise(function (resolve) {
            function step() {
              var i = next++;
              if (i >= ids.length) {
                resolve();
                return;
              }
              var rid = ids[i];
              var seed = byId[rid];
              var getter =
                typeof ExpectApi.Prediction.getWithMeta === "function"
                  ? ExpectApi.Prediction.getWithMeta(rid)
                  : ExpectApi.Prediction.get(rid).then(function (b) {
                      return { bundle: b, meta: {} };
                    });
              withTimeout(getter, 20000, "pred " + rid)
                .then(function (result) {
                  var bundle = result && result.bundle ? result.bundle : result;
                  if (bundle && bundle.race_id) {
                    byId[rid] = ExpectPredictionBind.bundleToRaceCardSummary(bundle, seed);
                    readyCount += 1;
                  } else {
                    byId[rid] = Object.assign({}, seed, {
                      prediction: { status: "missing", engine_source: null },
                      summary: null,
                    });
                  }
                })
                .catch(function () {
                  byId[rid] = Object.assign({}, seed, {
                    prediction: { status: "missing", engine_source: null },
                    summary: null,
                  });
                })
                .then(function () {
                  done += 1;
                  if (done % 4 === 0 || done === ids.length) paint();
                  step();
                });
            }
            step();
          });
        }

        var workers = [];
        for (var w = 0; w < Math.min(concurrency, ids.length); w++) {
          workers.push(worker());
        }
        return Promise.all(workers).then(function () {
          var finalPayload = snapshot();
          finalPayload.enriched = true;
          renderV2Cards(finalPayload);
          return finalPayload;
        });
      }

      function loadCatalogsForDates(dates) {
        if (!window.ExpectApi || !ExpectApi.Race) {
          return Promise.reject(new Error("Race catalog unavailable"));
        }
        return Promise.all(
          dates.map(function (d) {
            return withTimeout(
              ExpectApi.Race.list({ date: d }),
              12000,
              "catalog " + d
            ).then(
              function (catalog) {
                return { date: d, items: (catalog && catalog.items) || [] };
              },
              function () {
                return { date: d, items: [] };
              }
            );
          })
        ).then(function (rows) {
          var items = [];
          rows.forEach(function (row) {
            (row.items || []).forEach(function (it) {
              items.push(it);
            });
          });
          return { dates: dates, items: items };
        });
      }

      function enrichDates(dates, seedPayload) {
        // 1) 可能なら race-cards（日付ごと・edge cache あり）
        // 2) 並行で progressive Prediction（確実に自信度を埋める）
        var raceCardsPromise = Promise.resolve(null);
        if (window.ExpectApi && ExpectApi.RaceCards && dates.length === 1) {
          raceCardsPromise = enrichFromRaceCards(dates[0], dates[0]);
        } else if (window.ExpectApi && ExpectApi.RaceCards && dates.length > 1) {
          raceCardsPromise = Promise.all(
            dates.map(function (d) {
              return withTimeout(
                ExpectApi.RaceCards.list({ date: d }),
                RACE_CARDS_TIMEOUT_MS,
                "race-cards " + d
              ).catch(function () {
                return null;
              });
            })
          ).then(function (parts) {
            var merged = [];
            parts.forEach(function (p) {
              if (p && Array.isArray(p.race_cards)) {
                merged = merged.concat(p.race_cards);
              }
            });
            if (!merged.length) return null;
            var payload = {
              schema_version: "expect-race-cards/1.0",
              date: dates[0],
              dates: dates,
              count: merged.length,
              race_cards: merged,
              enriched: true,
            };
            renderV2Cards(payload);
            return payload;
          });
        }

        var progressivePromise = enrichProgressive(seedPayload);

        // 先に揃った方で表示。最終は progressive 完了を優先（欠けを埋める）
        raceCardsPromise.then(function (p) {
          if (p && cacheHasReadyCards(p)) {
            /* already rendered inside enrichFromRaceCards / merge */
          }
        });
        return progressivePromise;
      }

      function loadV1() {
        raceListController.mode = "v1";
        if (!window.ExpectApi || !ExpectApi.Prediction || !window.ExpectPredictionBind) {
          renderError("API クライアントが読み込めていません。");
          return;
        }
        var cached = readRaceListCache("v1", "all");
        if (cached && cached.payload && Array.isArray(cached.payload.bundles)) {
          renderV1Bundles(cached.payload.bundles, { fromCache: true });
          return;
        }
        if (window.ExpectUx && ExpectUx.showLoading) {
          ExpectUx.showLoading(list);
        }
        withTimeout(ExpectApi.Prediction.list({}), RACE_CARDS_TIMEOUT_MS, "predictions timeout")
          .then(function (bundles) {
            renderV1Bundles(bundles);
          })
          .catch(function () {
            renderError("通信エラーまたはタイムアウトのため一覧を更新できませんでした。");
          });
      }

      function loadV2(dateOpt) {
        raceListController.mode = "v2";
        if (!window.ExpectApi || !ExpectApi.Race || !window.ExpectPredictionBind) {
          var missing = [];
          if (!window.ExpectApi || !ExpectApi.Race) missing.push("Race");
          if (!window.ExpectPredictionBind) missing.push("PredictionBind");
          renderError(
            "レース表示用スクリプトが読み込めていません（" +
              missing.join(", ") +
              "）。"
          );
          return;
        }

        var dates = resolveLoadDates(dateOpt);
        if (!dates.length) {
          renderError("開催日を特定できませんでした。");
          return;
        }

        var cacheKey = dates.length === 1 ? dates[0] : "weekend:" + dates.join(",");
        raceListController.loadedDate =
          dateOpt == null || dateOpt === "all" || dates.length > 1 ? "all" : dates[0];

        paintWeekendDateTabs();

        var cached = readRaceListCache("v2", cacheKey);
        if (cached && cached.payload && Array.isArray(cached.payload.race_cards)) {
          renderV2Cards(cached.payload, { fromCache: true });
          enrichDates(dates, cached.payload);
          return;
        }

        if (window.ExpectUx && ExpectUx.showLoading) {
          ExpectUx.showLoading(list, {
            compact: true,
            title: "ロード中...",
            message: "レース一覧を準備しています。",
          });
        } else {
          list.setAttribute("aria-busy", "true");
        }

        loadCatalogsForDates(dates)
          .then(function (cat) {
            var cards = catalogItemsToRaceCards(cat.items, dates[0]);
            var payload = {
              schema_version: "expect-race-cards/1.0",
              date: dates.length === 1 ? dates[0] : dates[0],
              dates: dates,
              count: cards.length,
              race_cards: cards,
              enriched: false,
            };
            // cache write key
            payload._cacheKey = cacheKey;
            renderV2Cards(payload);
            return enrichDates(dates, payload);
          })
          .catch(function () {
            if (!list.querySelector(".race-item")) {
              renderError("通信エラーのため一覧を更新できませんでした。");
            }
          });
      }

      // cache key: weekend multi-day
      var _writeRaceListCacheOrig = writeRaceListCache;
      writeRaceListCache = function (mode, dateKey, payload) {
        var key =
          payload && payload._cacheKey
            ? payload._cacheKey
            : payload && payload.dates && payload.dates.length > 1
              ? "weekend:" + payload.dates.join(",")
              : dateKey;
        return _writeRaceListCacheOrig(mode, key, payload);
      };

      raceListController.reload = function (date) {
        loadV2(date);
      };

      function start() {
        var useV2 =
          window.ExpectUiFeatures &&
          typeof ExpectUiFeatures.enabled === "function" &&
          ExpectUiFeatures.enabled("v2_race_list_ui");
        if (useV2) loadV2("all");
        else loadV1();
      }

      if (window.ExpectUiFeatures && typeof ExpectUiFeatures.ready === "function") {
        ExpectUiFeatures.ready(function () {
          start();
        });
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
