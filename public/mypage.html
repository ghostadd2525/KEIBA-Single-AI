<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=21" />
  <link rel="stylesheet" href="assets/screens.css?v=35" />
  <link rel="stylesheet" href="assets/ux.css?v=17" />

    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }
  </script>
</head>
<body class="page-screen page-tab" data-nav="mypage">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">マイページ</p>
          </div>
        </div>
        <div class="topbar-tools">
          <button type="button" class="icon-btn" id="brightnessBtn" aria-label="明るさ設定" aria-pressed="false" title="明るさ設定">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M5.8 18.2l1.6-1.6M16.6 7.4l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="screen">
      <section class="profile-card">
        <img class="profile-avatar" id="profileAvatarImg" src="assets/images/mascot-ka0ba.png?v=10" alt="" />
        <div>
          <h2 id="profileDisplayName">—</h2>
          <p class="meta" id="profileLoginMeta">会員ID · —</p>
          <span class="badge-premium" id="profileRoleBadge">—</span>
          <p class="meta" id="profileActivityMeta" style="margin-top:8px">Lv. —</p>
          <div class="level-bar" aria-hidden="true"><i></i></div>
        </div>
      </section>

      <section class="stats-grid">
        <h3>今月の成績</h3>
        <div class="stat-cell"><span>的中率</span><b>—</b></div>
        <div class="stat-cell"><span>回収率</span><b>—</b></div>
        <div class="stat-cell"><span>収支</span><b>—</b></div>
        <div class="stat-cell"><span>的中数</span><b>—</b></div>
      </section>

      <section class="mypage-menu-section" aria-labelledby="mypageMenuHeading">
        <h3 id="mypageMenuHeading" class="mypage-menu-heading">メニュー</h3>
        <nav class="menu-list" id="mypageMenu" aria-label="マイページメニュー">
          <a href="chat.html?mode=chat" id="mypagePersonalChatLink" class="menu-list-chat">チャットルーム <span>›</span></a>
          <a href="profile.html" id="mypageProfileLink">プロフィール設定 <span>›</span></a>
          <a href="profile.html#notify" id="mypageNotifyLink">通知設定 <span>›</span></a>
          <a href="saved.html" id="mypageSavedLink">今月の成績 <span>›</span></a>
          <a href="analysis.html">購入履歴 <span>›</span></a>
          <a href="analysis.html">年間成績レポート <span>›</span></a>
          <a href="#" id="logoutLink">ログアウト <span>›</span></a>
        </nav>
      </section>

      <section class="chart-card" id="adminInvitePanel" hidden>
        <h3>管理者 · 一時ID発行</h3>
        <p class="muted">ログイン画面の「一時ID」欄で使える招待コードを自動発行します。有効日数は期限切れ判定に反映されます。</p>
        <form id="inviteForm" class="profile-form" autocomplete="off">
          <label class="profile-field">
            <span>有効日数</span>
            <input type="number" id="inviteDays" name="expires_days" min="1" max="90" value="14" required />
          </label>
          <p class="profile-form-msg muted" id="inviteFormMsg" role="status"></p>
          <button type="submit" class="profile-save" id="inviteIssueBtn">一時IDを発行</button>
        </form>
        <div id="inviteResult" class="invite-result" hidden></div>
        <div id="inviteList" class="invite-list"></div>
      </section>

      <section class="chart-card" id="supplyPanel">
        <h3>Data Supply / Coverage</h3>
        <div id="supplyPanelBody"><p class="muted">読み込み中…</p></div>
      </section>

    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/supply.js?v=3"></script>
  <script src="assets/api/user.js?v=3"></script>
  <script src="assets/api/user-prefs.js?v=1"></script>
  <script src="assets/api/i18n.js?v=1"></script>
  <script src="assets/api/real-data-bind.js?v=15"></script>
  <script src="assets/api/conversation.js?v=6"></script>
  <script src="assets/api/conversation-ui.js?v=7"></script>
  <script src="assets/favorites.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    if (window.ExpectConversationUi) {
      ExpectConversationUi.ensureMypageMenu();
      ExpectConversationUi.bindMypagePersonalChat();
    }
  </script>
  <script>
    (function () {
      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function isAdminRole(role) {
        var r = String(role || "").toUpperCase();
        return r === "ADMIN" || r === "OPS" || r === "DEVELOPER";
      }

      function paintHeader(me, hist, chat) {
        if (window.ExpectRealDataBind && me) {
          ExpectRealDataBind.bindMypageProfile(me, hist, chat);
        }
        var badge = document.getElementById("profileRoleBadge");
        if (badge) badge.textContent = me.role || "USER";
        var loginMeta = document.getElementById("profileLoginMeta");
        if (loginMeta) loginMeta.textContent = "会員ID · " + (me.login_id || me.user_id || "—");
        var av = document.getElementById("profileAvatarImg");
        if (av && me.profile && me.profile.avatar_url) av.src = me.profile.avatar_url;
        if (window.ExpectUserPrefs) ExpectUserPrefs.fromMe(me);
        if (window.ExpectI18n) ExpectI18n.apply();
      }

      function renderInviteList(items) {
        var el = document.getElementById("inviteList");
        if (!el) return;
        if (!items || !items.length) {
          el.innerHTML = '<p class="muted">最近発行された一時IDはまだありません。</p>';
          return;
        }
        el.innerHTML =
          "<h4 class='invite-list-title'>最近発行（最大5件）</h4><ul>" +
          items
            .slice(0, 5)
            .map(function (inv) {
              var st = String(inv.status || "");
              var stLabel =
                st === "issued" ? "未使用" : st === "activated" ? "利用済" : st;
              return (
                "<li><code>" +
                escapeHtml(inv.invite_id) +
                "</code> · " +
                escapeHtml(stLabel) +
                (inv.expires_at
                  ? " · 期限 " + escapeHtml(String(inv.expires_at).slice(0, 10))
                  : "") +
                "</li>"
              );
            })
            .join("") +
          "</ul>";
      }

      function loadAdminInvites() {
        return ExpectApi.User.listInvites()
          .then(function (data) {
            renderInviteList(
              (data && (data.recent_issued || data.invitations || data.recent_used)) || []
            );
          })
          .catch(function () {
            renderInviteList([]);
          });
      }

      function showIssuedInvite(inv, days, hint) {
        var msg = document.getElementById("inviteFormMsg");
        var result = document.getElementById("inviteResult");
        if (!inv || !inv.invite_id) {
          if (msg) msg.textContent = "発行レスポンスが不正です。もう一度お試しください。";
          return;
        }
        try {
          sessionStorage.setItem(
            "expect_last_invite_v1",
            JSON.stringify({ invite: inv, expires_days: days, at: Date.now() })
          );
        } catch (e) { /* ignore */ }
        if (msg) {
          msg.textContent =
            "発行しました（有効 " +
            (days || 14) +
            "日 · 期限 " +
            String(inv.expires_at || "").slice(0, 10) +
            "）";
        }
        if (!result) return;
        result.hidden = false;
        result.innerHTML =
          "<p class='invite-result-label'>発行された一時ID</p>" +
          "<p class='invite-result-code'><code id='issuedInviteCode'>" +
          escapeHtml(inv.invite_id) +
          "</code></p>" +
          "<p class='muted'>" +
          escapeHtml(hint || "ログイン画面の「一時ID」欄に入力してください") +
          "</p>" +
          "<button type='button' class='profile-save profile-save--ghost' id='copyInviteBtn'>コピー</button>";
        var copyBtn = document.getElementById("copyInviteBtn");
        if (copyBtn) {
          copyBtn.addEventListener("click", function () {
            var code = inv.invite_id;
            if (!code) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(code).then(function () {
                if (msg) msg.textContent = "コピーしました。";
              });
            } else {
              var range = document.createRange();
              var node = document.getElementById("issuedInviteCode");
              if (node) {
                range.selectNodeContents(node);
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
              }
              if (msg) msg.textContent = "一時IDを選択しました。手動でコピーしてください。";
            }
          });
        }
      }

      ExpectShell.initMascotTalk([
        "プロフィール編集から<br>表示名や通知を変えられるよ♪",
        "チャットで何でも<br>聞いてね♪",
      ]);

      document.getElementById("logoutLink").addEventListener("click", function (e) {
        e.preventDefault();
        Promise.resolve(ExpectAuth.logout()).finally(function () {
          location.href = "login.html";
        });
      });

      document.getElementById("inviteForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = document.getElementById("inviteFormMsg");
        var btn = document.getElementById("inviteIssueBtn");
        var result = document.getElementById("inviteResult");
        var days = Number(document.getElementById("inviteDays").value) || 14;
        if (btn) btn.disabled = true;
        if (msg) msg.textContent = "発行中…";
        if (result) result.hidden = true;

        var timedOut = false;
        var timer = window.setTimeout(function () {
          timedOut = true;
          if (msg) msg.textContent = "応答が遅いです。到着次第表示します…";
          if (btn) btn.disabled = false;
        }, 12000);

        ExpectApi.User.issueInvite({ expires_days: days })
          .then(function (data) {
            // タイムアウト後でも成功レスポンスは必ず表示する
            showIssuedInvite(
              data && data.invite,
              (data && data.expires_days) || days,
              data && data.login_hint
            );
            return loadAdminInvites();
          })
          .catch(function (err) {
            if (msg) {
              msg.textContent = (err && err.message) || "発行に失敗しました。";
            }
            if (result && !(result.querySelector && result.querySelector("#issuedInviteCode"))) {
              result.hidden = true;
            }
          })
          .finally(function () {
            window.clearTimeout(timer);
            if (btn) btn.disabled = false;
            if (timedOut && msg && msg.textContent.indexOf("到着次第") >= 0) {
              /* showIssuedInvite が上書き済みなら触らない */
            }
          });
      });

      function loadMe() {
        if (ExpectApi.User && ExpectApi.User.me) {
          return ExpectApi.User.me().catch(function () {
            return null;
          });
        }
        return Promise.resolve(null);
      }

      function loadMeFallback() {
        return fetch("/api/auth/me", {
          headers: {
            Accept: "application/json",
            Authorization: "Bearer " + (localStorage.getItem("expect_access_token_v1") || ""),
          },
        })
          .then(function (res) {
            return res.json().then(function (payload) {
              if (!res.ok || !payload || payload.ok === false) return null;
              var u = (payload.data && payload.data.user) || payload.data || null;
              if (!u) return null;
              return {
                user_id: u.id || u.user_id,
                login_id: u.id || u.user_id || u.login_id,
                role: u.role || "USER",
                status: "active",
                profile: {
                  display_name: u.display_name || u.id || "",
                  avatar_url: "",
                  locale: "ja",
                  preferences: {},
                },
              };
            });
          })
          .catch(function () {
            return null;
          });
      }

      Promise.all([
        loadMe().then(function (me) {
          return me || loadMeFallback();
        }),
        ExpectApi.User.history().catch(function () {
          return null;
        }),
        ExpectApi.User.chat().catch(function () {
          return null;
        }),
      ]).then(function (parts) {
        var me = parts[0];
        if (!me) return;
        paintHeader(me, parts[1], parts[2]);
        if (isAdminRole(me.role)) {
          document.getElementById("adminInvitePanel").hidden = false;
          loadAdminInvites();
          try {
            var cached = JSON.parse(sessionStorage.getItem("expect_last_invite_v1") || "null");
            if (cached && cached.invite && cached.at && Date.now() - cached.at < 86400000) {
              showIssuedInvite(cached.invite, cached.expires_days, null);
            }
          } catch (e) { /* ignore */ }
        }
      });

      (function () {
        var el = document.getElementById("supplyPanelBody");
        if (!el || !ExpectApi.Supply) return;
        Promise.all([
          ExpectApi.Supply.coverage().catch(function () {
            return null;
          }),
          ExpectApi.Supply.diagnosticsMissing().catch(function () {
            return null;
          }),
        ]).then(function (pair) {
          var cov = pair[0];
          var diag = pair[1];
          var html = "";
          if (!cov && !diag) {
            el.innerHTML =
              "<p class=\"muted\">データ供給状況を取得できませんでした（タイムアウトまたは一時障害）。発行機能には影響しません。</p>";
            return;
          }
          if (cov) {
            var total = Number(cov.race_total) || 0;
            var real = Number(cov.real_ai) || 0;
            var rate = total ? Math.round((real / total) * 1000) / 10 : 0;
            html +=
              "<p><strong>Coverage</strong> " +
              rate +
              "% (" +
              real +
              "/" +
              total +
              " real_ai)</p>";
          }
          if (diag) {
            var summary =
              typeof diag.summary === "string"
                ? diag.summary
                : diag.summary && typeof diag.summary === "object"
                  ? JSON.stringify(diag.summary)
                  : diag.message || diag.status || "";
            if (summary) {
              html += "<p><strong>Diagnostics</strong> " + escapeHtml(summary) + "</p>";
            }
          }
          el.innerHTML = html || "<p class='muted'>Supply API 未接続</p>";
        });
      })();

      (function () {
        var btn = document.getElementById("brightnessBtn");
        if (!btn || !window.ExpectShell) return;
        ExpectShell.syncBrightnessButton(btn);
        btn.addEventListener("click", function () {
          ExpectShell.toggleBrightness();
          ExpectShell.syncBrightnessButton(btn);
        });
      })();
    })();
  </script>
</body>
</html>
