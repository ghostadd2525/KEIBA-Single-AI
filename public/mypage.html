<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · マイページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=17" />
  <link rel="stylesheet" href="assets/screens.css" />
  <script src="assets/api/calendar-weekend.js?v=11"></script>
  <script src="assets/auto-maintenance.js?v=11.3"></script>
  <script src="assets/auth.js"></script>
  <script>
    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }
  </script>
</head>
<body class="page-screen page-tab" data-nav="mypage">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">マイページ</p>
          </div>
        </div>
        <div class="topbar-tools">
          <button type="button" class="icon-btn" id="brightnessBtn" aria-label="明るさ設定" aria-pressed="false" title="明るさ設定">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M5.8 18.2l1.6-1.6M16.6 7.4l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="screen">
      <section class="profile-card">
        <img class="profile-avatar" src="assets/images/mascot-ka0ba.png?v=10" alt="" />
        <div>
          <h2>KAOBA Fan</h2>
          <p class="meta">会員ID · EX-204185</p>
          <span class="badge-premium">Premium Member</span>
          <p class="meta" style="margin-top:8px">Lv.12</p>
          <div class="level-bar" aria-hidden="true"><i></i></div>
        </div>
      </section>

      <section class="stats-grid">
        <h3>今月の成績</h3>
        <div class="stat-cell"><span>的中率</span><b>71%</b></div>
        <div class="stat-cell"><span>回収率</span><b>132%</b></div>
        <div class="stat-cell"><span>収支</span><b>+58,400</b></div>
        <div class="stat-cell"><span>的中数</span><b>23R</b></div>
      </section>

      <section class="chart-card" id="userProfilePanel">
        <h3>プロフィール（User Domain）</h3>
        <div id="userProfileBody"><p class="muted">読み込み中…</p></div>
      </section>

      <section class="chart-card" id="supplyPanel">
        <h3>Data Supply / Coverage</h3>
        <div id="supplyPanelBody"><p class="muted">読み込み中…</p></div>
      </section>

      <nav class="menu-list" aria-label="マイページメニュー">
        <a href="saved.html">今月の成績 <span>›</span></a>
        <a href="analysis.html">購入履歴 <span>›</span></a>
        <a href="analysis.html">年間成績レポート <span>›</span></a>
        <a href="chat.html">KAOBAチャット履歴 <span>›</span></a>
        <a href="#settings">設定 <span>›</span></a>
        <a href="#" id="logoutLink">ログアウト <span>›</span></a>
      </nav>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/supply.js"></script>
  <script src="assets/api/user.js"></script>
  <script src="assets/api/real-data-bind.js"></script>
  <script src="assets/favorites.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    ExpectShell.initMascotTalk([
      "今月も好調だね！<br>この調子で一緒に<br>頑張ろう！",
      "チャットで何でも<br>聞いてね♪"
    ]);
    document.getElementById("logoutLink").addEventListener("click", function (e) {
      e.preventDefault();
      Promise.resolve(ExpectAuth.logout()).finally(function () {
        location.href = "login.html";
      });
    });
    (function () {
      var profileEl = document.getElementById("userProfileBody");
      if (profileEl && window.ExpectApi && ExpectApi.User) {
        Promise.all([
          ExpectApi.User.me().catch(function () {
            return null;
          }),
          ExpectApi.User.history().catch(function () {
            return null;
          }),
          ExpectApi.User.chat().catch(function () {
            return null;
          }),
        ]).then(function (parts) {
          var me = parts[0];
          var hist = parts[1];
          var chat = parts[2];
          if (window.ExpectRealDataBind && me) {
            ExpectRealDataBind.bindMypageProfile(me, hist, chat);
          }
          if (!me) {
            profileEl.innerHTML =
              "<p class='muted'>ログイン後に User Service からプロフィールを表示します。</p>";
            return;
          }
          var p = me.profile || {};
          profileEl.innerHTML =
            "<p><strong>" +
            (p.display_name || me.login_id) +
            "</strong> · " +
            me.status +
            "</p>" +
            "<p class='muted'>login_id: " +
            me.login_id +
            "</p>" +
            "<p>予測履歴: " +
            ((hist && hist.count) || 0) +
            " 件 · チャット: " +
            ((chat && chat.count) || 0) +
            " セッション</p>" +
            (me.subscription
              ? "<p>プラン: " + me.subscription.plan_id + " (" + me.subscription.status + ")</p>"
              : "<p class='muted'>サブスクリプション未設定</p>");
        });
      }
    })();
    (function () {
      var el = document.getElementById("supplyPanelBody");
      if (!el || !window.ExpectApi || !ExpectApi.Supply) return;
      Promise.all([
        ExpectApi.Supply.coverage().catch(function () {
          return null;
        }),
        ExpectApi.Supply.diagnosticsMissing().catch(function () {
          return null;
        }),
      ]).then(function (pair) {
        var cov = pair[0];
        var diag = pair[1];
        var html = "";
        if (cov) {
          var total = Number(cov.race_total) || 0;
          var real = Number(cov.real_ai) || 0;
          var rate = total ? Math.round((real / total) * 1000) / 10 : 0;
          html +=
            "<p><strong>Coverage</strong> " +
            rate +
            "% (" +
            real +
            "/" +
            total +
            " real_ai)</p>";
          if (cov.by_reason) {
            html += "<ul>";
            Object.keys(cov.by_reason).forEach(function (k) {
              html += "<li>" + k + ": " + cov.by_reason[k] + "</li>";
            });
            html += "</ul>";
          }
        }
        if (diag && diag.summary) {
          html += "<p><strong>Diagnostics</strong> " + diag.summary + "</p>";
        }
        el.innerHTML = html || "<p class='muted'>Supply API 未接続（AI_BASE_URL 設定時に表示）</p>";
      });
    })();
    (function () {
      var btn = document.getElementById("brightnessBtn");
      if (!btn || !window.ExpectShell) return;
      ExpectShell.syncBrightnessButton(btn);
      btn.addEventListener("click", function () {
        ExpectShell.toggleBrightness();
        ExpectShell.syncBrightnessButton(btn);
      });
    })();
  </script>
</body>
</html>
