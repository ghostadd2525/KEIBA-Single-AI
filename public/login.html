<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <title>Expect ～ KEIBA AI ～ · ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/login.css" />
</head>
<body class="page-login">
  <div class="login-app">
    <header class="login-brand">
      <p class="brand-name">Expect</p>
      <p class="brand-sub">～ KEIBA AI ～</p>
    </header>

    <div class="login-hero">
      <div class="login-hero-glow" aria-hidden="true"></div>
      <img class="login-hero-img" src="assets/images/mascot-ka0ba-login.png?v=6" alt="KAOBA" width="520" height="719" />
      <div class="login-hero-label">
        <b>KAOBA</b>
        <span>Your AI Partner</span>
      </div>
    </div>

    <section class="login-card" aria-label="ログイン">
      <div class="login-tabs" role="tablist" aria-label="認証方法">
        <button type="button" class="login-tab is-active" role="tab" aria-selected="true" data-tab="invite" id="tabInvite">一時ID（初回）</button>
        <button type="button" class="login-tab" role="tab" aria-selected="false" data-tab="account" id="tabAccount">ログイン</button>
      </div>

      <!-- 一時ID初回（初期表示） -->
      <div class="login-pane" id="paneInvite" role="tabpanel">
        <div class="login-block-head">
          <div class="login-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </div>
          <div>
            <h2>一時IDで開始</h2>
            <p>招待された方の初回設定へ進みます</p>
          </div>
        </div>

        <form id="inviteForm">
          <label class="login-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 8l8 5 8-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            <input id="tempId" name="tempId" type="text" autocomplete="off" placeholder="例: BETA-7X4P-Q8MN" required />
          </label>
          <button class="login-submit" type="submit">
            初回設定へ
            <span aria-hidden="true">›</span>
          </button>
        </form>

        <p class="login-tip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 10v6M12 7.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          一時IDは1回のみ有効です。設定後はログインIDでサインインしてください
        </p>
      </div>

      <!-- 正式ログイン -->
      <div class="login-pane" id="paneAccount" role="tabpanel" hidden>
        <div class="login-block-head">
          <div class="login-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="7" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 7V6a4 4 0 0 1 8 0v1" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="13" r="1.4" fill="currentColor"/>
            </svg>
          </div>
          <div>
            <h2>ログイン</h2>
            <p>設定済みのログインIDとパスワード</p>
          </div>
        </div>

        <form id="accountForm">
          <label class="login-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/>
              <path d="M5 19c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input id="loginId" name="loginId" type="text" autocomplete="username" placeholder="ログインID" required />
          </label>
          <label class="login-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="パスワード" required />
          </label>
          <button class="login-submit" type="submit">
            ログイン
            <span aria-hidden="true">›</span>
          </button>
        </form>
      </div>

      <p class="login-error" id="loginError" role="alert"></p>

      <div class="login-notice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 5 6v6c0 4.5 2.9 7.8 7 9 4.1-1.2 7-4.5 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m9.5 12 1.8 1.8L15 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <strong>招待制β版です</strong>
          <p>一般登録はありません。管理者が発行した一時IDをお持ちの方のみ初回設定できます。</p>
        </div>
      </div>
    </section>
  </div>

  <script src="assets/api/calendar-weekend.js?v=11.2"></script>
  <script src="assets/auto-maintenance.js?v=11.3"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/favorites.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      if (ExpectAuth.isLoggedIn()) {
        if (!ExpectAuth.hasAcceptedTerms()) {
          location.replace("terms.html");
          return;
        }
        ExpectAutoMaintenance.goPostAuthLanding();
        return;
      }

      var err = document.getElementById("loginError");
      var paneAccount = document.getElementById("paneAccount");
      var paneInvite = document.getElementById("paneInvite");
      var tabAccount = document.getElementById("tabAccount");
      var tabInvite = document.getElementById("tabInvite");

      function showTab(name) {
        var isAccount = name === "account";
        paneAccount.hidden = !isAccount;
        paneInvite.hidden = isAccount;
        tabAccount.classList.toggle("is-active", isAccount);
        tabInvite.classList.toggle("is-active", !isAccount);
        tabAccount.setAttribute("aria-selected", isAccount ? "true" : "false");
        tabInvite.setAttribute("aria-selected", isAccount ? "false" : "true");
        err.textContent = "";
      }

      tabAccount.addEventListener("click", function () { showTab("account"); });
      tabInvite.addEventListener("click", function () { showTab("invite"); });
      showTab("invite");

      document.getElementById("accountForm").addEventListener("submit", function (e) {
        e.preventDefault();
        err.textContent = "";
        var id = (document.getElementById("loginId").value || "").trim();
        var password = document.getElementById("loginPassword").value || "";
        if (id.length < 4) {
          err.textContent = "ログインIDを入力してください";
          return;
        }
        if (!password) {
          err.textContent = "パスワードを入力してください";
          return;
        }
        ExpectAuth.loginWithApi(id, password)
          .then(function () {
            return ExpectAutoMaintenance.goPostAuthLanding();
          })
          .catch(function (e2) {
            err.textContent = (e2 && e2.message) || "ログインに失敗しました";
          });
      });

      document.getElementById("inviteForm").addEventListener("submit", function (e) {
        e.preventDefault();
        err.textContent = "";
        var inviteId = (document.getElementById("tempId").value || "").trim();
        if (inviteId.length < 4) {
          err.textContent = "一時IDを入力してください";
          return;
        }
        ExpectAuth.startInvite(inviteId)
          .then(function () {
            location.href = "setup.html";
          })
          .catch(function (e2) {
            err.textContent = (e2 && e2.message) || "一時IDを確認できませんでした";
          });
      });
    })();
  </script>
</body>
</html>
