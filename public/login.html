<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <title>Expect ～ KEIBA AI ～ · ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/login.css?v=16" />
</head>
<body class="page-login">
  <div class="login-app">
    <header class="login-brand">
      <p class="brand-name">Expect</p>
      <p class="brand-sub">～ KEIBA AI ～</p>
    </header>

    <div class="login-hero">
      <div class="login-hero-glow" aria-hidden="true"></div>
      <img class="login-hero-img" src="assets/images/mascot-ka0ba-login.png?v=6" alt="KAOBA" width="520" height="719" />
      <div class="login-hero-label">
        <b>KAOBA</b>
        <span>Your AI Partner</span>
      </div>
    </div>

    <section class="login-card" aria-label="ログイン">
      <!-- 一時ID初回（この端末で未設定のとき） -->
      <div class="login-pane" id="paneInvite" role="region" aria-label="一時IDで開始" hidden>
        <div class="login-block-head">
          <div class="login-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </div>
          <div>
            <h2>一時IDで開始</h2>
            <p>招待された方の初回設定へ進みます</p>
          </div>
        </div>

        <form id="inviteForm">
          <label class="login-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 8l8 5 8-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            <input id="tempId" name="tempId" type="text" autocomplete="off" placeholder="例: BETA-7X4P-Q8MN" required />
          </label>
          <button class="login-submit" type="submit">
            初回設定へ
            <span aria-hidden="true">›</span>
          </button>
        </form>

        <p class="login-tip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 10v6M12 7.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          一時IDは1回のみ有効です。設定後はログインIDでサインインしてください
        </p>

        <button type="button" class="login-mode-switch" id="toAccountBtn">
          すでに設定済みの方はログイン
        </button>
      </div>

      <!-- 正式ログイン（設定後・2回目以降） -->
      <div class="login-pane" id="paneAccount" role="region" aria-label="ログイン">
        <div class="login-block-head">
          <div class="login-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="7" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 7V6a4 4 0 0 1 8 0v1" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="13" r="1.4" fill="currentColor"/>
            </svg>
          </div>
          <div>
            <h2>ログイン</h2>
            <p>設定済みのログインIDとパスワード</p>
          </div>
        </div>

        <form id="accountForm">
          <label class="login-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/>
              <path d="M5 19c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input id="loginId" name="loginId" type="text" autocomplete="username" placeholder="ログインID" required />
          </label>
          <div class="login-field login-field--password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="パスワード" required />
            <button type="button" class="login-eye" id="togglePassword" aria-label="パスワードを表示" aria-pressed="false" title="パスワードを表示">
              <svg class="login-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="login-eye-closed is-hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
                <path d="M3 4.5 20.5 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M9.6 9.8A3 3 0 0 0 12 15a3 3 0 0 0 2.9-2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M6.2 7.1C4.1 8.6 2.5 12 2.5 12s3.5 6.5 9.5 6.5c1.6 0 3-.4 4.2-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11.2 5.6c.3 0 .5 0 .8 0 6 0 9.5 6.4 9.5 6.4s-.7 1.3-2 2.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <button class="login-submit" type="submit">
            ログイン
            <span aria-hidden="true">›</span>
          </button>
        </form>

        <button type="button" class="login-mode-switch" id="toInviteBtn">
          一時IDで初回設定する
        </button>
      </div>

      <p class="login-error" id="loginError" role="alert"></p>

      <p class="login-session" id="loginSession" hidden>
        <span id="loginSessionLabel"></span>
        <button type="button" class="login-session-out" id="loginLogoutBtn">ログアウトして切り替え</button>
      </p>

      <div class="login-notice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 5 6v6c0 4.5 2.9 7.8 7 9 4.1-1.2 7-4.5 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m9.5 12 1.8 1.8L15 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <strong>招待制β版です</strong>
          <p>一般登録はありません。管理者が発行した一時IDをお持ちの方のみ初回設定できます。</p>
        </div>
      </div>
    </section>
  </div>

  <script src="assets/api/calendar-weekend.js?v=13"></script>
  <script src="assets/auto-maintenance.js?v=11.5"></script>
  <script src="assets/api/auth.js?v=16"></script>
  <script src="assets/favorites.js?v=3"></script>
  <script src="assets/auth.js?v=3"></script>
  <script>
    (function () {
      // login /login: Auto Maintenance は SKIP。既ログインでも自動遷移しない（アカウント切替テスト用）
      var MSG_EMPTY = "入力してください";
      var MSG_WRONG = "入力が間違っています";
      var MSG_LOCKED = "管理者にご確認の上、再度ご入力ください";
      var FAIL_LIMIT = 5;
      var FAIL_KEY_ACCOUNT = "expect_login_fail_account_v1";
      var FAIL_KEY_INVITE = "expect_login_fail_invite_v1";

      var err = document.getElementById("loginError");
      var sessionEl = document.getElementById("loginSession");
      var sessionLabel = document.getElementById("loginSessionLabel");
      var logoutBtn = document.getElementById("loginLogoutBtn");
      var paneAccount = document.getElementById("paneAccount");
      var paneInvite = document.getElementById("paneInvite");
      var toAccountBtn = document.getElementById("toAccountBtn");
      var toInviteBtn = document.getElementById("toInviteBtn");
      var togglePassword = document.getElementById("togglePassword");
      var loginIdInput = document.getElementById("loginId");
      var passwordInput = document.getElementById("loginPassword");
      var tempIdInput = document.getElementById("tempId");

      function storeGet(key) {
        try {
          return sessionStorage.getItem(key) || "";
        } catch (e) {
          return "";
        }
      }

      function storeSet(key, value) {
        try {
          sessionStorage.setItem(key, String(value));
        } catch (e) { /* ignore */ }
      }

      function getFailCount(key) {
        var n = Number(storeGet(key) || "0");
        return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
      }

      function setFailCount(key, n) {
        storeSet(key, Math.max(0, Math.floor(n)));
      }

      function fieldWrap(input) {
        return input && input.closest ? input.closest(".login-field") : null;
      }

      function rememberDefaultPlaceholder(input) {
        if (!input || input.dataset.defaultPlaceholder != null) return;
        input.dataset.defaultPlaceholder = input.getAttribute("placeholder") || "";
      }

      function clearFieldHint(input) {
        if (!input) return;
        rememberDefaultPlaceholder(input);
        input.classList.remove("is-hint-empty", "is-hint-error", "is-hint-locked");
        input.setAttribute("placeholder", input.dataset.defaultPlaceholder || "");
        var wrap = fieldWrap(input);
        if (wrap) wrap.classList.remove("is-invalid");
      }

      function showFieldHint(input, message, kind) {
        if (!input) return;
        rememberDefaultPlaceholder(input);
        input.classList.remove("is-hint-empty", "is-hint-error", "is-hint-locked");
        input.classList.add(kind || "is-hint-error");
        input.setAttribute("placeholder", message);
        var wrap = fieldWrap(input);
        if (wrap) wrap.classList.add("is-invalid");
      }

      function bindClearOnInput(input) {
        if (!input || input.dataset.hintBound === "1") return;
        input.dataset.hintBound = "1";
        rememberDefaultPlaceholder(input);
        input.addEventListener("input", function () {
          clearFieldHint(input);
          if (err) err.textContent = "";
        });
      }

      [loginIdInput, passwordInput, tempIdInput].forEach(bindClearOnInput);

      function syncSessionBanner() {
        if (!sessionEl || !sessionLabel) return;
        var cur = ExpectAuth.current && ExpectAuth.current();
        if (ExpectAuth.isLoggedIn() && cur && cur.id) {
          sessionLabel.textContent = "現在: " + cur.id + " でサインイン中";
          sessionEl.hidden = false;
        } else {
          sessionEl.hidden = true;
          sessionLabel.textContent = "";
        }
      }

      syncSessionBanner();

      if (logoutBtn) {
        logoutBtn.addEventListener("click", function () {
          if (err) err.textContent = "";
          setFailCount(FAIL_KEY_ACCOUNT, 0);
          setFailCount(FAIL_KEY_INVITE, 0);
          clearFieldHint(loginIdInput);
          clearFieldHint(passwordInput);
          clearFieldHint(tempIdInput);
          var done = ExpectAuth.logout && ExpectAuth.logout();
          Promise.resolve(done)
            .catch(function () { /* ignore */ })
            .then(function () {
              syncSessionBanner();
            });
        });
      }

      var inviteFromUrl = new URLSearchParams(location.search).get("id");
      if (inviteFromUrl && tempIdInput) {
        tempIdInput.value = inviteFromUrl.trim();
      }

      function showMode(name) {
        var isAccount = name === "account";
        paneAccount.hidden = !isAccount;
        paneInvite.hidden = isAccount;
        if (err) err.textContent = "";
        if (isAccount) {
          if (loginIdInput) loginIdInput.focus();
        } else if (tempIdInput) {
          tempIdInput.focus();
        }
      }

      if (toAccountBtn) {
        toAccountBtn.addEventListener("click", function () {
          showMode("account");
        });
      }
      if (toInviteBtn) {
        toInviteBtn.addEventListener("click", function () {
          showMode("invite");
        });
      }

      // 初回（未設定）は一時IDのみ。設定後・再訪問はログインID/パスワード。
      // ?id= 付きの招待リンクは一時ID画面を優先。
      var preferInvite =
        !!inviteFromUrl || !(ExpectAuth.hasAccountReady && ExpectAuth.hasAccountReady());
      showMode(preferInvite ? "invite" : "account");

      if (togglePassword && passwordInput) {
        function syncEyeIcons(showingText) {
          var openIcon = togglePassword.querySelector(".login-eye-open");
          var closedIcon = togglePassword.querySelector(".login-eye-closed");
          if (openIcon) {
            openIcon.hidden = !!showingText;
            openIcon.classList.toggle("is-hidden", !!showingText);
          }
          if (closedIcon) {
            closedIcon.hidden = !showingText;
            closedIcon.classList.toggle("is-hidden", !showingText);
          }
          togglePassword.setAttribute("aria-pressed", showingText ? "true" : "false");
          togglePassword.setAttribute(
            "aria-label",
            showingText ? "パスワードを隠す" : "パスワードを表示"
          );
          togglePassword.setAttribute(
            "title",
            showingText ? "パスワードを隠す" : "パスワードを表示"
          );
        }

        syncEyeIcons(passwordInput.type === "text");

        togglePassword.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var show = passwordInput.type !== "text";
          passwordInput.type = show ? "text" : "password";
          syncEyeIcons(show);
        });
      }

      function applyAuthFailHints(inputs, failKey) {
        var count = getFailCount(failKey) + 1;
        setFailCount(failKey, count);
        var message = count >= FAIL_LIMIT ? MSG_LOCKED : MSG_WRONG;
        var kind = count >= FAIL_LIMIT ? "is-hint-locked" : "is-hint-error";
        inputs.forEach(function (input) {
          if (!input) return;
          input.value = "";
          showFieldHint(input, message, kind);
        });
      }

      document.getElementById("accountForm").addEventListener("submit", function (e) {
        e.preventDefault();
        if (err) err.textContent = "";
        clearFieldHint(loginIdInput);
        clearFieldHint(passwordInput);

        var id = (loginIdInput && loginIdInput.value || "").trim();
        var password = (passwordInput && passwordInput.value) || "";
        var missing = false;

        if (!id) {
          if (loginIdInput) loginIdInput.value = "";
          showFieldHint(loginIdInput, MSG_EMPTY, "is-hint-empty");
          missing = true;
        }
        if (!password) {
          if (passwordInput) passwordInput.value = "";
          showFieldHint(passwordInput, MSG_EMPTY, "is-hint-empty");
          missing = true;
        }
        if (missing) return;

        if (getFailCount(FAIL_KEY_ACCOUNT) >= FAIL_LIMIT) {
          if (loginIdInput) loginIdInput.value = "";
          if (passwordInput) passwordInput.value = "";
          showFieldHint(loginIdInput, MSG_LOCKED, "is-hint-locked");
          showFieldHint(passwordInput, MSG_LOCKED, "is-hint-locked");
          return;
        }

        ExpectAuth.loginWithApi(id, password)
          .then(function () {
            setFailCount(FAIL_KEY_ACCOUNT, 0);
            syncSessionBanner();
            if (window.ExpectAutoMaintenance && ExpectAutoMaintenance.goPostAuthLanding) {
              return ExpectAutoMaintenance.goPostAuthLanding().catch(function () {
                location.replace("index.html");
              });
            }
            location.replace("index.html");
          })
          .catch(function () {
            applyAuthFailHints([loginIdInput, passwordInput], FAIL_KEY_ACCOUNT);
          });
      });

      document.getElementById("inviteForm").addEventListener("submit", function (e) {
        e.preventDefault();
        if (err) err.textContent = "";
        clearFieldHint(tempIdInput);

        var inviteId = (tempIdInput && tempIdInput.value || "").trim();
        if (!inviteId) {
          if (tempIdInput) tempIdInput.value = "";
          showFieldHint(tempIdInput, MSG_EMPTY, "is-hint-empty");
          return;
        }

        if (getFailCount(FAIL_KEY_INVITE) >= FAIL_LIMIT) {
          if (tempIdInput) tempIdInput.value = "";
          showFieldHint(tempIdInput, MSG_LOCKED, "is-hint-locked");
          return;
        }

        ExpectAuth.startInvite(inviteId)
          .then(function () {
            setFailCount(FAIL_KEY_INVITE, 0);
            location.href = "setup.html";
          })
          .catch(function () {
            applyAuthFailHints([tempIdInput], FAIL_KEY_INVITE);
          });
      });
    })();
  </script>
</body>
</html>
