<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <title>Expect ～ KEIBA AI ～ · ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/login.css" />
</head>
<body class="page-login">
  <div class="login-app">
    <header class="login-brand">
      <p class="brand-name">Expect</p>
      <p class="brand-sub">～ KEIBA AI ～</p>
    </header>

    <div class="login-hero">
      <div class="login-hero-glow" aria-hidden="true"></div>
      <img class="login-hero-img" src="assets/images/mascot-ka0ba-login.png?v=6" alt="KAOBA" width="520" height="719" />
      <div class="login-hero-label">
        <b>KAOBA</b>
        <span>Your AI Partner</span>
      </div>
    </div>

    <section class="login-card" aria-label="ログイン">
      <div class="login-block-head">
        <div class="login-ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="4" y="7" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 7V6a4 4 0 0 1 8 0v1" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="13" r="1.4" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h2>一時IDでログイン</h2>
          <p>招待された方のみご利用いただけます</p>
        </div>
      </div>

      <form id="loginForm">
        <label class="login-field">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 8l8 5 8-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <input id="tempId" name="tempId" type="text" inputmode="text" autocomplete="username" placeholder="一時IDを入力してください" required />
        </label>

        <button class="login-submit" type="submit">
          ログイン
          <span aria-hidden="true">›</span>
        </button>
        <p class="login-error" id="loginError" role="alert"></p>
      </form>

      <p class="login-tip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 10v6M12 7.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        一時IDは招待時に発行されたものをご利用ください
      </p>

      <div class="login-or">または</div>

      <button type="button" class="login-invite" id="inviteToggle">
        <span class="login-invite-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          招待コードをお持ちの方はこちら
        </span>
        <span aria-hidden="true">›</span>
      </button>

      <div class="login-invite-panel" id="invitePanel" hidden>
        <label class="login-field">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <input id="inviteCode" type="text" placeholder="招待コードを入力" />
        </label>
        <button class="login-submit" type="button" id="inviteLoginBtn">
          招待コードで続行
          <span aria-hidden="true">›</span>
        </button>
      </div>

      <div class="login-notice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 5 6v6c0 4.5 2.9 7.8 7 9 4.1-1.2 7-4.5 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m9.5 12 1.8 1.8L15 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <strong>当サービスは招待制です</strong>
          <p>不正アクセス防止のため、限られた方のみご利用いただけます。</p>
        </div>
      </div>
    </section>
  </div>

  <script src="assets/auth.js"></script>
  <script>
    (function () {
      if (ExpectAuth.isLoggedIn()) {
        // 規約は端末で初回同意済みならスキップ
        location.replace(ExpectAuth.hasAcceptedTerms() ? "index.html" : "terms.html");
        return;
      }

      var form = document.getElementById("loginForm");
      var err = document.getElementById("loginError");
      var inviteToggle = document.getElementById("inviteToggle");
      var invitePanel = document.getElementById("invitePanel");
      var inviteLoginBtn = document.getElementById("inviteLoginBtn");

      function goAfterLogin(id) {
        if (!ExpectAuth.login(id)) {
          err.textContent = "ログイン状態を保存できませんでした。ブラウザの保存設定を確認してください";
          return;
        }
        location.href = ExpectAuth.hasAcceptedTerms() ? "index.html" : "terms.html";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var id = (document.getElementById("tempId").value || "").trim();
        if (id.length < 4) {
          err.textContent = "一時IDを正しく入力してください（4文字以上）";
          return;
        }
        err.textContent = "";
        goAfterLogin(id);
      });

      inviteToggle.addEventListener("click", function () {
        invitePanel.hidden = !invitePanel.hidden;
      });

      inviteLoginBtn.addEventListener("click", function () {
        var code = (document.getElementById("inviteCode").value || "").trim();
        if (code.length < 4) {
          err.textContent = "招待コードを正しく入力してください";
          return;
        }
        err.textContent = "";
        goAfterLogin("invite:" + code);
      });
    })();
  </script>
</body>
</html>
