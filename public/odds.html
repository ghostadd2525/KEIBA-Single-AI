<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · オッズ変動AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=19" />
  <link rel="stylesheet" href="assets/screens.css?v=35" />
  <link rel="stylesheet" href="assets/ux.css?v=16" />
  <link rel="stylesheet" href="assets/vqa.css?v=2" />
  <script src="assets/api/calendar-weekend.js?v=15"></script>
  <script src="assets/auto-maintenance.js?v=11.5"></script>
  <script src="assets/auth.js?v=4"></script>
  <script>
    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }
  </script>
</head>
<body class="page-screen page-odds page-tab" data-nav="analysis">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <a class="back-btn" href="index.html" aria-label="戻る">‹</a>
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">オッズ変動AI</p>
            <p class="brand-sub">単勝オッズの推移</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen">
      <div class="race-filters odds-filters" id="oddsFilters">
        <div class="tab-row date-tabs chip-row" id="oddsDateTabs" aria-label="開催日"></div>
        <div class="chip-row" id="oddsVenueChips" aria-label="開催会場"></div>
        <p class="heat-note race-filters-note" id="oddsFilterNote">日付・会場でレースを絞り込めます。</p>
      </div>

      <section class="chart-card odds-race-panel" aria-labelledby="oddsRaceListTitle">
        <h3 id="oddsRaceListTitle">レースを選択</h3>
        <label class="odds-race-select-label" for="oddsRaceSelect">
          <select id="oddsRaceSelect" class="odds-race-select" aria-label="レース一覧"></select>
        </label>
      </section>

      <section class="chart-card odds-chart-card" id="oddsChartCard" aria-labelledby="oddsChartTitle">
        <h3 id="oddsChartTitle">単勝オッズ推移</h3>
        <p class="analysis-lead" id="oddsChartMeta">レースを選んでください</p>
        <div id="oddsChartMount" class="odds-chart-mount">
          <svg class="odds-line-chart" id="oddsLineChart" viewBox="0 0 640 280" role="img" aria-label="単勝オッズの折れ線グラフ"></svg>
        </div>
        <div id="oddsLegend" class="odds-legend-wrap"></div>
        <p class="odds-chart-note muted" id="oddsChartNote">約5分ごとに自動更新します。</p>
      </section>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/race-list-url.js?v=15"></script>
  <script src="assets/api/race.js?v=15"></script>
  <script src="assets/api/odds-series.js?v=2"></script>
  <script src="assets/api/user-prefs.js?v=1"></script>
  <script src="assets/api/odds-chart.js?v=10"></script>
  <script src="assets/ux.js?v=21"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.ExpectOddsChart) ExpectOddsChart.bind();
      if (window.ExpectShell) {
        ExpectShell.initNav("analysis");
        ExpectShell.mountGlobalTools();
      }
    });
  </script>
</body>
</html>
