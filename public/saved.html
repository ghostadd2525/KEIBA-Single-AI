<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · 今月の成績</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/screens.css" />
  <script src="assets/auth.js"></script>
  <script>ExpectAuth.requireAuth();</script>
</head>
<body class="page-screen page-balance" data-nav="balance">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">今月の成績</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen">
      <section class="balance-hero" aria-label="今月の成績サマリー">
        <p class="balance-hero-label">2026年7月 · 成績サマリー</p>
        <p class="balance-hero-value is-plus">+¥58,400</p>
        <p class="balance-hero-sub">前月比 <span class="is-plus">+12,800</span> · 回収率 <strong>132%</strong></p>
      </section>

      <section class="stats-grid">
        <h3>今月の成績</h3>
        <div class="stat-cell"><span>的中率</span><b>71%</b></div>
        <div class="stat-cell"><span>回収率</span><b>132%</b></div>
        <div class="stat-cell"><span>収支</span><b class="is-plus">+58,400</b></div>
        <div class="stat-cell"><span>的中数</span><b>23R</b></div>
      </section>

      <section class="balance-week">
        <h3>週次の成績</h3>
        <ul class="balance-week-list">
          <li>
            <span>第1週</span>
            <b class="is-plus">+18,200</b>
          </li>
          <li>
            <span>第2週</span>
            <b class="is-plus">+9,600</b>
          </li>
          <li>
            <span>第3週</span>
            <b class="is-minus">-4,200</b>
          </li>
          <li>
            <span>第4週（今月）</span>
            <b class="is-plus">+34,800</b>
          </li>
        </ul>
      </section>

      <section class="balance-notes">
        <h3>ポイント</h3>
        <p>重賞レースの的中が収支を押し上げています。来週は芝中距離の信頼度が高い会場を中心に確認しよう。</p>
        <a class="balance-link" href="mypage.html">マイページで詳細を見る ›</a>
      </section>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/favorites.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    ExpectShell.initMascotTalk([
      "今月の成績は<br><strong>+58,400円</strong> だよ！<br>好調だね♪",
      "回収率 <strong>132%</strong>！<br>この調子でいこう！"
    ]);
  </script>
</body>
</html>
