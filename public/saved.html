<!DOCTYPE html>
<html lang="ja">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=17" />

<body class="page-screen page-balance page-tab" data-nav="balance">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">今月の成績</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen">
      <section class="balance-hero" aria-label="今月の成績サマリー">
        <p class="balance-hero-label">読み込み中…</p>
        <p class="balance-hero-value">—</p>
        <p class="balance-hero-sub">User API / Coverage から取得</p>
      </section>

      <section class="stats-grid">
        <h3>今月のアクティビティ</h3>
        <div class="stat-cell"><span>閲覧数</span><b>—</b></div>
        <div class="stat-cell"><span>AIカバレッジ</span><b>—</b></div>
        <div class="stat-cell"><span>収支</span><b>—</b></div>
        <div class="stat-cell"><span>閲覧R</span><b>—</b></div>
      </section>

      <section class="balance-week">
        <h3>最近の閲覧履歴</h3>
        <ul class="balance-week-list">
          <li><span>読み込み中…</span><b>—</b></li>
        </ul>
      </section>

      <section class="balance-notes">
        <h3>ポイント</h3>
        <p>的中・収支 API は未提供のため、User API の予測閲覧履歴を表示しています。</p>
        <a class="balance-link" href="mypage.html">マイページで詳細を見る ›</a>
      </section>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/user.js"></script>
  <script src="assets/api/supply.js"></script>
  <script src="assets/api/real-data-bind.js"></script>
  <script src="assets/favorites.js?v=3"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    (function () {
      Promise.all([
        ExpectApi.User.history().catch(function () { return null; }),
        ExpectApi.Supply.coverage().catch(function () { return null; }),
      ]).then(function (pair) {
        if (window.ExpectRealDataBind) {
          ExpectRealDataBind.bindSavedPage(pair[0], pair[1]);
        }
        var n = (pair[0] && pair[0].count) || 0;
        ExpectShell.initMascotTalk([
          "今月 <strong>" + n + "件</strong> の<br>レースを見たね！",
          "AIカバレッジも<br>チェックしてみてね！"
        ]);
      });
    })();
  </script>
