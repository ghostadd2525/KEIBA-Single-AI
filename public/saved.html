<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · チャレンジ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=33" />
  <link rel="stylesheet" href="assets/screens.css?v=74" />
  <link rel="stylesheet" href="assets/vqa.css?v=52" />
  <script src="assets/api/calendar-weekend.js?v=14"></script>
  <script src="assets/auto-maintenance.js?v=12.4"></script>
  <script src="assets/auth.js?v=6"></script>
  <script>
    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }
  </script>
</head>
<body class="page-screen page-challenge page-tab" data-nav="challenge">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">チャレンジ</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen">
      <div class="ledger-month-nav" aria-label="月切り替え">
        <button type="button" class="ledger-month-btn" data-ledger-prev aria-label="前月">‹</button>
        <p class="ledger-month-nav-label">—</p>
        <button type="button" class="ledger-month-btn" data-ledger-next aria-label="翌月">›</button>
      </div>

      <section
        id="userChallengeEntrySection"
        class="chart-card user-challenge-entry"
        aria-label="User Challenge"
        hidden
      ></section>

      <section id="challengeBanner" class="challenge-banner" aria-live="polite">
        <p class="challenge-kicker">読み込み中…</p>
        <h2>今月のAIチャレンジ</h2>
        <p class="challenge-msg muted">月間成績を取得しています</p>
      </section>

      <section class="dash-cards" aria-label="Game MasterとUser Challengeの成績">
        <article class="dash-score-card" id="aiScoreCard">
          <h3>Game Master</h3>
          <p class="dash-card-profit">Pending</p>
        </article>
        <article class="dash-score-card" id="userScoreCard">
          <h3>User Challenge</h3>
          <p class="dash-card-profit">Pending</p>
        </article>
      </section>

      <section id="purchaseLabSection" class="chart-card purchase-lab-section" aria-label="Purchase Lab" hidden></section>

      <section class="chart-card" aria-label="収支比較">
        <h3>収支比較</h3>
        <div class="cmp-bars" id="profitCompareBars"></div>
      </section>

      <section class="chart-card" aria-label="週次比較">
        <h3>週次の成績</h3>
        <div class="cmp-weeks" id="weekCompareBars"></div>
      </section>

      <section class="chart-card" id="challengeProgressCard" aria-label="ランキング・進捗">
        <h3>ランキング / 進捗</h3>
        <div id="challengeProgress" class="challenge-progress">
          <p class="muted">Pending</p>
        </div>
      </section>

      <section class="ledger-races chart-card" aria-label="月間購入レース">
        <h3>月間の購入レース</h3>
        <ul class="ledger-race-list">
          <li class="ledger-race-empty"><span>Pending</span></li>
        </ul>
      </section>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.webp?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/roles.js?v=1"></script>
  <script src="assets/api/user.js?v=8"></script>
  <script src="assets/api/challenge-dashboard.js?v=10"></script>
  <script src="assets/api/ui-features.js?v=16"></script>
  <script src="assets/api/ui-test-race.js?v=3"></script>
  <script src="assets/api/challenge-lifecycle.js?v=3"></script>
  <script src="assets/api/challenge-notifications.js?v=1"></script>
  <script src="assets/api/ui-test-challenge-entry.js?v=15"></script>
  <script src="assets/favorites.js?v=4"></script>
  <script src="assets/shell.js?v=5"></script>
  <script src="assets/reminders.js?v=5"></script>
  <script src="assets/partials-nav.js?v=2"></script>
  <script>
    if (window.ExpectChallengeDashboard) {
      ExpectChallengeDashboard.bindDashboard(document);
    }
    if (window.ExpectUiTestChallengeEntry && ExpectUiTestChallengeEntry.bindSavedPage) {
      ExpectUiTestChallengeEntry.bindSavedPage(
        document.getElementById("userChallengeEntrySection")
      );
    } else if (window.ExpectUiTestChallengeEntry && ExpectUiTestChallengeEntry.mount) {
      ExpectUiTestChallengeEntry.mount(
        document.getElementById("userChallengeEntrySection")
      );
    }
  </script>
</body>
</html>
