<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/screens.css?v=39" />
  <link rel="stylesheet" href="assets/ux.css?v=18" />
  <link rel="stylesheet" href="assets/vqa.css?v=4" />

  <script src="assets/auto-maintenance.js?v=12.4"></script>

    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }

</head>
<body class="page-screen page-analysis page-tab" data-nav="analysis">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text">
            <p class="brand-name">Expect</p>
            <p class="brand-sub">～ KEIBA AI ～</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen">
      <section class="chart-card analysis-summary is-loading" id="analysisSummary" aria-labelledby="aiSummaryTitle">
        <h3 id="aiSummaryTitle">AI総評パラメータ</h3>
        <p class="analysis-lead">お気に入りに登録したレースをもとに、AI評価をまとめて表示しています。</p>
        <div class="pie-layout">
          <div class="pie-chart pie-chart--lg" id="summaryPie" role="img" aria-label="AI総評の円グラフ">
            <div class="pie-chart-center">
              <strong id="summaryOverall">—</strong>
              <small>総合</small>
            </div>
          </div>
          <ul class="pie-legend" id="summaryLegend"></ul>
        </div>
      </section>

      <section class="chart-card" aria-labelledby="favAiTitle">
        <h3 id="favAiTitle">お気に入りレースのAI評価</h3>
        <p class="analysis-lead">お気に入りに登録したレースごとのAI評価を確認できます。</p>
        <div class="fav-ai-grid" id="favAiGrid" aria-busy="true">
          <div class="expect-loading expect-loading--compact" role="status" aria-live="polite" aria-busy="true" data-expect-loading="1">
            <div class="expect-loading__spinner" aria-hidden="true"></div>
            <p class="expect-loading__title">ロード中...</p>
            <p class="expect-loading__msg">しばらくお待ちください。</p>
            <div class="expect-loading__progress" data-expect-load-track role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="expect-loading__track">
                <img class="expect-loading__runner" data-expect-load-runner src="assets/images/mascot-loading-run.webp?v=3" alt="" width="56" height="56" draggable="false" />
                <div class="expect-loading__bar"><span class="expect-loading__fill" data-expect-load-fill></span></div>
              </div>
              <p class="expect-loading__meta" data-expect-load-meta>経過 0.0秒</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.webp?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/contract-guard.js"></script>
  <script src="assets/api/http-cache.js?v=1"></script>
  <script src="assets/api/prediction.js?v=16"></script>
  <script src="assets/api/analysis-bind.js?v=31"></script>
  <script src="assets/ux.js?v=15"></script>
  <script src="assets/favorites.js?v=7"></script>
  <script src="assets/shell.js?v=5"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    (function () {
      var COLORS = ["#c1a26d", "#7eb8a8", "#d4a574", "#8fa4d4", "#c98989"];
      var PARAM_KEYS =
        (window.ExpectAnalysisBind && ExpectAnalysisBind.KEYS) ||
        ["history", "distance", "style_fit", "front", "pace_resilience"];
      var LABELS =
        (window.ExpectAnalysisBind && ExpectAnalysisBind.DEFAULT_LABELS) ||
        {
          history: "近走成績",
          distance: "距離適性",
          style_fit: "脚質×距離",
          front: "先行傾向",
          pace_resilience: "展開耐性",
        };
      var EMPTY_MSG =
        "お気に入りレースはまだありません。<br>レース画面から登録するとここに表示されます。";

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function emptyAi() {
        return {
          overall: null,
          history: null,
          distance: null,
          style_fit: null,
          front: null,
          pace_resilience: null,
        };
      }

      function hasRealAi(ai) {
        if (!ai) return false;
        return PARAM_KEYS.some(function (k) {
          return ai[k] != null && isFinite(Number(ai[k]));
        });
      }

      function conicFromScores(ai) {
        var values = PARAM_KEYS.map(function (k) {
          return Number(ai && ai[k]) || 0;
        });
        var total = values.reduce(function (a, b) {
          return a + b;
        }, 0);
        if (!total) {
          return "conic-gradient(from -90deg, rgba(255,255,255,0.08) 0 100%)";
        }
        var cursor = 0;
        var parts = [];
        values.forEach(function (v, i) {
          var start = (cursor / total) * 100;
          cursor += v;
          var end = (cursor / total) * 100;
          parts.push(COLORS[i] + " " + start.toFixed(2) + "% " + end.toFixed(2) + "%");
        });
        return "conic-gradient(from -90deg, " + parts.join(", ") + ")";
      }

      function avgParams(rows) {
        var usable = (rows || []).filter(function (r) {
          return r && r.ready && hasRealAi(r.ai);
        });
        if (!usable.length) return emptyAi();
        var acc = {
          overall: 0,
          history: 0,
          distance: 0,
          style_fit: 0,
          front: 0,
          pace_resilience: 0,
        };
        var counts = {
          overall: 0,
          history: 0,
          distance: 0,
          style_fit: 0,
          front: 0,
          pace_resilience: 0,
        };
        usable.forEach(function (item) {
          var ai = item.ai;
          Object.keys(acc).forEach(function (k) {
            if (ai[k] == null || !isFinite(Number(ai[k]))) return;
            acc[k] += Number(ai[k]);
            counts[k] += 1;
          });
        });
        Object.keys(acc).forEach(function (k) {
          acc[k] = counts[k] ? Math.round(acc[k] / counts[k]) : null;
        });
        return acc;
      }

      function raceTitle(item) {
        return (item && (item.name || item.place)) || "レース";
      }

      function raceSub(item) {
        var bits = [];
        if (item.place && item.name && item.place !== item.name) bits.push(item.place);
        if (item.badge) bits.push(item.badge);
        return bits.join(" · ");
      }

      function renderSummary(rows) {
        var pie = document.getElementById("summaryPie");
        var overall = document.getElementById("summaryOverall");
        var legend = document.getElementById("summaryLegend");
        if (!pie || !overall || !legend) return;

        var ready = (rows || []).filter(function (r) {
          return r && r.ready && hasRealAi(r.ai);
        });
        if (!ready.length) {
          pie.style.background = "conic-gradient(from -90deg, rgba(255,255,255,0.08) 0 100%)";
          overall.textContent = "—";
          legend.innerHTML =
            '<li class="pie-legend-empty">' +
            (rows && rows.length
              ? "Prediction データ取得後に総評が表示されます。"
              : EMPTY_MSG) +
            "</li>";
          return;
        }

        var ai = avgParams(ready);
        pie.style.background = conicFromScores(ai);
        overall.textContent = ai.overall != null ? ai.overall + "%" : "—";
        legend.innerHTML = PARAM_KEYS.map(function (key, i) {
          var v = ai[key];
          return (
            '<li><i style="background:' +
            COLORS[i] +
            '"></i><span>' +
            escapeHtml(LABELS[key] || key) +
            "</span><b>" +
            (v != null ? v + "%" : "—") +
            "</b></li>"
          );
        }).join("");
      }

      function renderFavorites(rows) {
        var grid = document.getElementById("favAiGrid");
        if (!grid) return;

        if (!rows.length) {
          grid.innerHTML =
            '<div class="fav-ai-empty"><p>' + EMPTY_MSG + "</p></div>";
          return;
        }

        grid.innerHTML = rows
          .map(function (item) {
            var ai = item.ai || emptyAi();
            var ready = item.ready && hasRealAi(ai);
            var href = "race.html?race_id=" + encodeURIComponent(item.id);
            var title = raceTitle(item);
            var sub = raceSub(item);
            var overallLabel = ready && ai.overall != null ? ai.overall + "%" : "—";

            var legend = PARAM_KEYS.map(function (key, i) {
              var v = ready ? ai[key] : null;
              return (
                '<li><i style="background:' +
                COLORS[i] +
                '"></i><span>' +
                escapeHtml(LABELS[key] || key) +
                "</span><b>" +
                (v != null ? v + "%" : "—") +
                "</b></li>"
              );
            }).join("");

            return (
              '<article class="fav-ai-card' +
              (ready ? "" : " is-pending") +
              '">' +
              '<div class="fav-ai-card-top">' +
              '<div class="pie-chart pie-chart--md" style="background:' +
              (ready ? conicFromScores(ai) : "conic-gradient(from -90deg, rgba(255,255,255,0.08) 0 100%)") +
              '" role="img" aria-label="' +
              escapeHtml(title) +
              'のAI評価円グラフ">' +
              '<div class="pie-chart-center">' +
              "<strong>" +
              overallLabel +
              "</strong>" +
              "<small>AI総合</small>" +
              "</div></div>" +
              '<div class="fav-ai-meta">' +
              "<h4>" +
              escapeHtml(title) +
              "</h4>" +
              (sub ? "<p>" + escapeHtml(sub) + "</p>" : "<p></p>") +
              '<p class="fav-ai-conf">AI総合 ' +
              overallLabel +
              "</p>" +
              (ready
                ? ""
                : '<p class="fav-ai-pending">データ取得中または未取得</p>') +
              '<a href="' +
              href +
              '">詳細を見る ›</a>' +
              "</div></div>" +
              '<ul class="pie-legend pie-legend--compact">' +
              legend +
              "</ul>" +
              "</article>"
            );
          })
          .join("");
      }

      function paint(rows) {
        renderSummary(rows);
        renderFavorites(rows);

        var ready = rows.filter(function (r) {
          return r.ready && hasRealAi(r.ai);
        });
        var top = ready[0];
        var lines = [
          "お気に入りはあなた専用だよ<br>（最大3件）",
          "パラメータの平均で<br>総評をまとめているよ♪",
        ];
        if (top) {
          lines.unshift(
            "注目レースは<br><strong>" +
              escapeHtml(raceTitle(top)) +
              "</strong><br>AI総合 <strong>" +
              (top.ai.overall != null ? top.ai.overall : "—") +
              "%</strong>"
          );
        } else if (!rows.length) {
          lines = [
            "お気に入りはまだないよ<br>レース画面の ★ から登録してね",
          ];
        }
        if (window.ExpectShell && ExpectShell.initMascotTalk) {
          ExpectShell.initMascotTalk(lines);
        }
      }

      function finishLoading() {
        var summary = document.getElementById("analysisSummary");
        var grid = document.getElementById("favAiGrid");
        if (summary) summary.classList.remove("is-loading");
        if (grid) {
          if (window.ExpectUx && ExpectUx.hideLoading) ExpectUx.hideLoading(grid);
          else grid.setAttribute("aria-busy", "false");
        }
      }

      function favoriteRows() {
        var list = (window.ExpectFavorites && ExpectFavorites.list()) || [];
        return list.slice(0, 3).map(function (item) {
          return {
            id: item.id,
            place: item.place || "",
            name: item.name || "",
            badge: item.badge || "",
            postTime: item.postTime || "",
            ai: emptyAi(),
            ready: false,
          };
        });
      }

      function enrichFromPrediction(rows) {
        if (!rows.length) {
          paint(rows);
          finishLoading();
          return;
        }
        if (!window.ExpectApi || !ExpectApi.Prediction || !ExpectApi.Prediction.get) {
          paint(rows);
          finishLoading();
          return;
        }

        Promise.all(
          rows.map(function (item) {
            return ExpectApi.Prediction.get(item.id)
              .then(function (bundle) {
                var pbOk = !bundle || !bundle.__contract || bundle.__contract.ok;
                if (!bundle || !pbOk) return;
                if (window.ExpectFavorites && ExpectFavorites.cacheBundle) {
                  ExpectFavorites.cacheBundle(bundle);
                }
                var ai =
                  window.ExpectAnalysisBind && ExpectAnalysisBind.toAiParams
                    ? ExpectAnalysisBind.toAiParams(bundle, null)
                    : null;
                if (!ai || !hasRealAi(ai)) return;
                item.ai = {
                  overall: ai.overall != null ? ai.overall : null,
                  history: ai.history != null ? ai.history : null,
                  distance: ai.distance != null ? ai.distance : null,
                  style_fit: ai.style_fit != null ? ai.style_fit : null,
                  front: ai.front != null ? ai.front : null,
                  pace_resilience:
                    ai.pace_resilience != null ? ai.pace_resilience : null,
                };
                item.ready = true;
                if (bundle.race_info) {
                  var info = bundle.race_info;
                  var raceNo =
                    info.race_no != null ? info.race_no : info.race_number;
                  item.place =
                    info.race_label ||
                    (info.venue || "") +
                      (raceNo != null ? " " + raceNo + "R" : "") ||
                    item.place;
                  item.name =
                    info.race_name || info.class_label || item.name || "";
                  item.badge = info.grade || item.badge || "";
                }
              })
              .catch(function () {
                /* keep pending — no mock 70% */
              });
          })
        ).then(function () {
          paint(rows);
          finishLoading();
        });
      }

      function loadDashboard() {
        var rows = favoriteRows();
        enrichFromPrediction(rows);
      }

      loadDashboard();
      window.addEventListener("expect:favorites-changed", function () {
        var grid = document.getElementById("favAiGrid");
        var summary = document.getElementById("analysisSummary");
        if (summary) summary.classList.add("is-loading");
        if (grid) {
          grid.setAttribute("aria-busy", "true");
          if (window.ExpectUx && ExpectUx.showLoading) {
            ExpectUx.showLoading(grid, { compact: true, title: "更新中..." });
          }
        }
        loadDashboard();
      });
    })();
  </script>
</body>
</html>
