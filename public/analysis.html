        <div class="fav-ai-grid" id="favAiGrid" aria-busy="true">

            <div class="expect-loading__progress" data-expect-load-track role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

  <script src="assets/partials-nav.js"></script>
  <script>
    (function () {
      var COLORS = ["#c1a26d", "#7eb8a8", "#d4a574", "#8fa4d4", "#c98989"];
      var PARAM_KEYS = ["pedigree", "pace", "jockey", "form", "odds"];
      var LABELS = (window.ExpectFavorites && ExpectFavorites.AI_PARAM_LABELS) || {
        pedigree: "陦邨ｱ驕ｩ諤ｧ",
        pace: "螻暮幕莠域ｸｬ",
        jockey: "鬨取焔逶ｸ諤ｧ",
        form: "霑題ｵｰ蜀・ｮｹ",
        odds: "繧ｪ繝・ぜ螯吝袖"
      };

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function conicFromScores(ai) {
        var values = PARAM_KEYS.map(function (k) { return Number(ai[k]) || 0; });
        var total = values.reduce(function (a, b) { return a + b; }, 0) || 1;
        var cursor = 0;
        var parts = [];
        values.forEach(function (v, i) {
          var start = (cursor / total) * 100;
          cursor += v;
          var end = (cursor / total) * 100;
          parts.push(COLORS[i] + " " + start.toFixed(2) + "% " + end.toFixed(2) + "%");
        });
        return "conic-gradient(from -90deg, " + parts.join(", ") + ")";
      }

      function donutConfidence(score) {
        var s = Math.max(0, Math.min(100, Number(score) || 0));
        return (
          "conic-gradient(from -90deg, #d4b37d 0% " +
          s +
          "%, rgba(255,255,255,0.08) " +
          s +
          "% 100%)"
        );
      }

      function avgParams(list) {
        if (!list.length) {
          return { overall: 0, pedigree: 0, pace: 0, jockey: 0, form: 0, odds: 0 };
        }
        var acc = { overall: 0, pedigree: 0, pace: 0, jockey: 0, form: 0, odds: 0 };
        list.forEach(function (item) {
          var ai = item.ai || ExpectFavorites.getAi(item.id);
          Object.keys(acc).forEach(function (k) {
            acc[k] += Number(ai[k]) || 0;
          });
        });
        Object.keys(acc).forEach(function (k) {
          acc[k] = Math.round(acc[k] / list.length);
        });
        return acc;
      }

      function renderSummary(list) {
        var ai = avgParams(list);
        var pie = document.getElementById("summaryPie");
        var overall = document.getElementById("summaryOverall");
        var legend = document.getElementById("summaryLegend");
        if (!pie || !overall || !legend) return;

        if (!list.length) {
          pie.style.background = "conic-gradient(from -90deg, rgba(255,255,255,0.08) 0 100%)";
          overall.textContent = "窶・;
          legend.innerHTML =
            '<li class="pie-legend-empty">縺頑ｰ励↓蜈･繧翫Ξ繝ｼ繧ｹ繧堤匳骭ｲ縺吶ｋ縺ｨ縲・br>邱剰ｩ輔ヱ繝ｩ繝｡繝ｼ繧ｿ縺悟・繧ｰ繝ｩ繝輔〒陦ｨ遉ｺ縺輔ｌ縺ｾ縺吶・/li>';
          return;
        }

        pie.style.background = conicFromScores(ai);
        overall.textContent = ai.overall + "%";
        legend.innerHTML = PARAM_KEYS.map(function (key, i) {
          return (
            '<li><i style="background:' +
            COLORS[i] +
            '"></i><span>' +
            escapeHtml(LABELS[key] || key) +
            '</span><b>' +
            ai[key] +
            "%</b></li>"
          );
        }).join("");
      }

      function renderFavorites(list) {
        var grid = document.getElementById("favAiGrid");
        if (!grid) return;

        if (!list.length) {
          grid.innerHTML =
            '<div class="fav-ai-empty">' +
            "<p>縺ｾ縺縺頑ｰ励↓蜈･繧翫′縺ゅｊ縺ｾ縺帙ｓ縲・/p>" +
            '<a href="races.html">繝ｬ繝ｼ繧ｹ荳隕ｧ縺ｧ 笘・逋ｻ骭ｲ縺吶ｋ 窶ｺ</a>' +
            "</div>";
          return;
        }

        grid.innerHTML = list
          .map(function (item) {
            var ai = item.ai || ExpectFavorites.getAi(item.id);
            var href = "race.html?race_id=" + encodeURIComponent(item.id);
            var legend = PARAM_KEYS.map(function (key, i) {
              return (
                '<li><i style="background:' +
                COLORS[i] +
                '"></i><span>' +
                escapeHtml(LABELS[key] || key) +
                "</span><b>" +
                ai[key] +
                "%</b></li>"
              );
            }).join("");

            return (
              '<article class="fav-ai-card">' +
              '<div class="fav-ai-card-top">' +
              '<div class="pie-chart pie-chart--md" style="background:' +
              conicFromScores(ai) +
              '" role="img" aria-label="' +
              escapeHtml(item.place) +
              '縺ｮAI隧穂ｾ｡蜀・げ繝ｩ繝・>' +
              '<div class="pie-chart-center">' +
              "<strong>" +
              ai.overall +
              "%</strong>" +
              "<small>邱丞粋</small>" +
              "</div></div>" +
              '<div class="fav-ai-meta">' +
              "<h4>" +
              escapeHtml(item.place) +
              "</h4>" +
              "<p>" +
              escapeHtml(item.name || "") +
              (item.badge ? " ﾂｷ " + escapeHtml(item.badge) : "") +
              "</p>" +
              '<div class="pie-chart pie-chart--sm" style="background:' +
              donutConfidence(ai.overall) +
              '" title="AI菫｡鬆ｼ蠎ｦ"></div>' +
              '<p class="fav-ai-conf">AI菫｡鬆ｼ蠎ｦ ' +
              ai.overall +
              "%</p>" +
              '<a href="' +
              href +
              '">隧ｳ邏ｰ繧定ｦ九ｋ 窶ｺ</a>' +
              "</div></div>" +
              '<ul class="pie-legend pie-legend--compact">' +
              legend +
              "</ul>" +
              "</article>"
            );
          })
          .join("");
      }

      function render() {
        var list = ExpectFavorites.list();
        renderSummary(list);
        renderFavorites(list);

        var top = list[0];
        var lines = [
          "縺頑ｰ励↓蜈･繧翫・AI隧穂ｾ｡繧・br>蜀・げ繝ｩ繝輔〒縺ｾ縺ｨ繧√◆繧茨ｼ・,
          "繝代Λ繝｡繝ｼ繧ｿ縺ｮ繝舌Λ繝ｳ繧ｹ繧・br>隕九※雋ｷ縺・岼繧定・∴繧医≧笙ｪ"
        ];
        if (top && top.ai) {
          lines.unshift(
            "縺・∪荳逡ｪ縺ｮ豕ｨ逶ｮ縺ｯ<br><strong>" +
              top.place +
              "</strong><br>邱丞粋 <strong>" +
              top.ai.overall +
              "%</strong> 縺繧茨ｼ・
          );
        }
        ExpectShell.initMascotTalk(lines);
      }

      function finishLoading() {
        var summary = document.getElementById("analysisSummary");
        var grid = document.getElementById("favAiGrid");
        if (summary) summary.classList.remove("is-loading");
        if (grid) {
          if (window.ExpectUx && ExpectUx.hideLoading) ExpectUx.hideLoading(grid);
          else grid.setAttribute("aria-busy", "false");
        }
      }

      function enrichFromApi(list) {
        var grid = document.getElementById("favAiGrid");
        if (!list.length || !window.ExpectApi || !ExpectApi.Prediction || !ExpectApi.Analysis) {
          render();
          finishLoading();
          return;
        }
        var rejected = 0;
        Promise.all(
          list.map(function (item) {
            var rid = item.id;
            return Promise.all([
              ExpectApi.Prediction.get(rid),
              ExpectApi.Analysis.get(rid),
            ]).then(function (pair) {
              var bundle = pair[0];
              var analysis = pair[1];
              var pbOk = !bundle || !bundle.__contract || bundle.__contract.ok;
              var aOk = !analysis || !analysis.__contract || analysis.__contract.ok;
              if (!pbOk || !aOk) {
                rejected += 1;
                return;
              }
              item.ai = ExpectAnalysisBind.toAiParams(bundle, analysis);
              if (bundle && bundle.race_info) {
                var info = bundle.race_info;
                item.place =
                  item.place ||
                  (info.venue || "") + (info.race_no != null ? " " + info.race_no + "R" : "");
                item.name = item.name || info.class_label || "";
                item.badge = item.badge || info.grade || "";
              }
            });
          })
        ).then(function () {
          if (rejected && window.ExpectContractGuard && grid) {
            ExpectContractGuard.showErrorCard(grid, {
              title: "荳驛ｨ縺ｮ縺頑ｰ励↓蜈･繧翫ｒ譖ｴ譁ｰ縺ｧ縺阪∪縺帙ｓ",
              message: rejected + "莉ｶ縺・API 螂醍ｴ・＆蜿阪・縺溘ａ繧ｹ繧ｭ繝・・縺励∪縺励◆縲・,
            });
          }
          render();
          finishLoading();
        }).catch(function () {
          if (window.ExpectUx && grid) {
            grid.innerHTML = "";
            grid.appendChild(
              ExpectUx.stateCard({
                kind: "error",
                title: "AI蛻・梵繧呈峩譁ｰ縺ｧ縺阪∪縺帙ｓ",
                message: "Prediction / Analysis 縺ｮ蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆縲・,
                onRetry: function () {
                  location.reload();
                },
              })
            );
          } else if (window.ExpectContractGuard && grid) {
            ExpectContractGuard.showErrorCard(grid, {
              title: "AI蛻・梵繧呈峩譁ｰ縺ｧ縺阪∪縺帙ｓ",
              message: "Prediction / Analysis 縺ｮ蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆縲・,
            });
          }
          finishLoading();
        });
      }

      enrichFromApi(ExpectFavorites.list());
    })();
  </script>
</body>
