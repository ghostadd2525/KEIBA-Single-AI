<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · 分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/screens.css" />
  <script src="assets/auth.js"></script>
  <script>ExpectAuth.requireAuth();</script>
</head>
<body class="page-screen page-analysis" data-nav="analysis">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text">
            <p class="brand-name">Expect</p>
            <p class="brand-sub">～ KEIBA AI ～</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen">
      <section class="chart-card analysis-summary" aria-labelledby="aiSummaryTitle">
        <h3 id="aiSummaryTitle">AI総評パラメータ</h3>
        <p class="analysis-lead">お気に入り登録レースを集計した総合評価です。</p>
        <div class="pie-layout">
          <div class="pie-chart pie-chart--lg" id="summaryPie" role="img" aria-label="AI総評の円グラフ">
            <div class="pie-chart-center">
              <strong id="summaryOverall">—</strong>
              <small>総合</small>
            </div>
          </div>
          <ul class="pie-legend" id="summaryLegend"></ul>
        </div>
      </section>

      <section class="chart-card" aria-labelledby="favAiTitle">
        <h3 id="favAiTitle">お気に入りレースのAI評価</h3>
        <p class="analysis-lead">登録中のレースごとにパラメータを円グラフ表示します。</p>
        <div class="fav-ai-grid" id="favAiGrid"></div>
      </section>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.png?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/favorites.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    (function () {
      var COLORS = ["#c1a26d", "#7eb8a8", "#d4a574", "#8fa4d4", "#c98989"];
      var PARAM_KEYS = ["pedigree", "pace", "jockey", "form", "odds"];
      var LABELS = (window.ExpectFavorites && ExpectFavorites.AI_PARAM_LABELS) || {
        pedigree: "血統適性",
        pace: "展開予測",
        jockey: "騎手相性",
        form: "近走内容",
        odds: "オッズ妙味"
      };

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function conicFromScores(ai) {
        var values = PARAM_KEYS.map(function (k) { return Number(ai[k]) || 0; });
        var total = values.reduce(function (a, b) { return a + b; }, 0) || 1;
        var cursor = 0;
        var parts = [];
        values.forEach(function (v, i) {
          var start = (cursor / total) * 100;
          cursor += v;
          var end = (cursor / total) * 100;
          parts.push(COLORS[i] + " " + start.toFixed(2) + "% " + end.toFixed(2) + "%");
        });
        return "conic-gradient(from -90deg, " + parts.join(", ") + ")";
      }

      function donutConfidence(score) {
        var s = Math.max(0, Math.min(100, Number(score) || 0));
        return (
          "conic-gradient(from -90deg, #d4b37d 0% " +
          s +
          "%, rgba(255,255,255,0.08) " +
          s +
          "% 100%)"
        );
      }

      function avgParams(list) {
        if (!list.length) {
          return { overall: 0, pedigree: 0, pace: 0, jockey: 0, form: 0, odds: 0 };
        }
        var acc = { overall: 0, pedigree: 0, pace: 0, jockey: 0, form: 0, odds: 0 };
        list.forEach(function (item) {
          var ai = item.ai || ExpectFavorites.getAi(item.id);
          Object.keys(acc).forEach(function (k) {
            acc[k] += Number(ai[k]) || 0;
          });
        });
        Object.keys(acc).forEach(function (k) {
          acc[k] = Math.round(acc[k] / list.length);
        });
        return acc;
      }

      function renderSummary(list) {
        var ai = avgParams(list);
        var pie = document.getElementById("summaryPie");
        var overall = document.getElementById("summaryOverall");
        var legend = document.getElementById("summaryLegend");
        if (!pie || !overall || !legend) return;

        if (!list.length) {
          pie.style.background = "conic-gradient(from -90deg, rgba(255,255,255,0.08) 0 100%)";
          overall.textContent = "—";
          legend.innerHTML =
            '<li class="pie-legend-empty">お気に入りレースを登録すると、<br>総評パラメータが円グラフで表示されます。</li>';
          return;
        }

        pie.style.background = conicFromScores(ai);
        overall.textContent = ai.overall + "%";
        legend.innerHTML = PARAM_KEYS.map(function (key, i) {
          return (
            '<li><i style="background:' +
            COLORS[i] +
            '"></i><span>' +
            escapeHtml(LABELS[key] || key) +
            '</span><b>' +
            ai[key] +
            "%</b></li>"
          );
        }).join("");
      }

      function renderFavorites(list) {
        var grid = document.getElementById("favAiGrid");
        if (!grid) return;

        if (!list.length) {
          grid.innerHTML =
            '<div class="fav-ai-empty">' +
            "<p>まだお気に入りがありません。</p>" +
            '<a href="races.html">レース一覧で ★ 登録する ›</a>' +
            "</div>";
          return;
        }

        grid.innerHTML = list
          .map(function (item) {
            var ai = item.ai || ExpectFavorites.getAi(item.id);
            var href = "race.html?race_id=" + encodeURIComponent(item.id);
            var legend = PARAM_KEYS.map(function (key, i) {
              return (
                '<li><i style="background:' +
                COLORS[i] +
                '"></i><span>' +
                escapeHtml(LABELS[key] || key) +
                "</span><b>" +
                ai[key] +
                "%</b></li>"
              );
            }).join("");

            return (
              '<article class="fav-ai-card">' +
              '<div class="fav-ai-card-top">' +
              '<div class="pie-chart pie-chart--md" style="background:' +
              conicFromScores(ai) +
              '" role="img" aria-label="' +
              escapeHtml(item.place) +
              'のAI評価円グラフ">' +
              '<div class="pie-chart-center">' +
              "<strong>" +
              ai.overall +
              "%</strong>" +
              "<small>総合</small>" +
              "</div></div>" +
              '<div class="fav-ai-meta">' +
              "<h4>" +
              escapeHtml(item.place) +
              "</h4>" +
              "<p>" +
              escapeHtml(item.name || "") +
              (item.badge ? " · " + escapeHtml(item.badge) : "") +
              "</p>" +
              '<div class="pie-chart pie-chart--sm" style="background:' +
              donutConfidence(ai.overall) +
              '" title="AI信頼度"></div>' +
              '<p class="fav-ai-conf">AI信頼度 ' +
              ai.overall +
              "%</p>" +
              '<a href="' +
              href +
              '">詳細を見る ›</a>' +
              "</div></div>" +
              '<ul class="pie-legend pie-legend--compact">' +
              legend +
              "</ul>" +
              "</article>"
            );
          })
          .join("");
      }

      function render() {
        var list = ExpectFavorites.list();
        renderSummary(list);
        renderFavorites(list);

        var top = list[0];
        var lines = [
          "お気に入りのAI評価を<br>円グラフでまとめたよ！",
          "パラメータのバランスを<br>見て買い目を考えよう♪"
        ];
        if (top && top.ai) {
          lines.unshift(
            "いま一番の注目は<br><strong>" +
              top.place +
              "</strong><br>総合 <strong>" +
              top.ai.overall +
              "%</strong> だよ！"
          );
        }
        ExpectShell.initMascotTalk(lines);
      }

      render();
    })();
  </script>
</body>
</html>
