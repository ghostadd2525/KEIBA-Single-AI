<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · KAOBAチャット</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/screens.css" />
  <script src="assets/auth.js"></script>
  <script>ExpectAuth.requireAuth();</script>
</head>
<body class="page-screen page-chat" data-nav="mypage">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left chat-head">
          <a class="back-btn" href="mypage.html" aria-label="戻る">‹</a>
          <img src="assets/images/mascot-ka0ba.png?v=10" alt="" />
          <div class="brand-block topbar-text topbar-title-only">
            <h1 class="brand-name">KAOBA</h1>
          </div>
        </div>
      </div>
    </header>

    <div class="screen chat-shell">
      <div class="chat-log" id="chatLog">
        <div class="msg msg-ai">
          <img src="assets/images/mascot-ka0ba.png?v=10" alt="" />
          <div class="msg-bubble">こんにちは！今日のレース、何が気になる？展開・血統・買い目、なんでも聞いてね。</div>
        </div>
        <div class="msg msg-user">
          <div class="msg-bubble">阪神11Rの本命は？</div>
        </div>
        <div class="msg msg-ai">
          <img src="assets/images/mascot-ka0ba.png?v=10" alt="" />
          <div class="msg-bubble">AI本命は <strong>7番 エンプレスリターン</strong>（信頼度92%）。差し有利の展開見込みで、血統・近走の評価も高いよ！</div>
        </div>
        <div class="msg msg-user">
          <div class="msg-bubble">対抗と穴は？</div>
        </div>
        <div class="msg msg-ai">
          <img src="assets/images/mascot-ka0ba.png?v=10" alt="" />
          <div class="msg-bubble">対抗は <strong>3番</strong>、穴は <strong>9番</strong> を推奨。三連単は 7-3-9 / 7-9-3 の軸流しがバランスいいよ。</div>
        </div>
      </div>

      <div class="chat-composer">
        <div class="chat-quick chip-row" id="quickChips">
          <button type="button" class="chip" data-q="展開予想を教えて">展開予想</button>
          <button type="button" class="chip" data-q="オッズの動きは？">オッズ変動</button>
          <button type="button" class="chip" data-q="血統について教えて">血統</button>
          <button type="button" class="chip" data-q="買い目を提案して">買い目提案</button>
        </div>
        <form class="chat-input-row" id="chatForm">
          <input id="chatInput" type="text" placeholder="KAOBAにメッセージ…" autocomplete="off" />
          <button class="chat-send" type="submit" aria-label="送信">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12 20 4l-6 16-2.5-6.5L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var log = document.getElementById("chatLog");
      var form = document.getElementById("chatForm");
      var input = document.getElementById("chatInput");
      var replies = [
        "いい質問！データ上は差し馬の評価が伸びてるよ。",
        "いまのところ本命評価に大きな変動はないよ。安心して見てて！",
        "血統面ではディープ産駒の適性が高いコースだね。",
        "買い目は軸1頭流しで点数を抑えるのがおすすめ！"
      ];
      var r = 0;

      function addMsg(text, who) {
        var row = document.createElement("div");
        row.className = "msg msg-" + who;
        if (who === "ai") {
          row.innerHTML = '<img src="assets/images/mascot-ka0ba.png?v=10" alt="" /><div class="msg-bubble"></div>';
          row.querySelector(".msg-bubble").textContent = text;
        } else {
          row.innerHTML = '<div class="msg-bubble"></div>';
          row.querySelector(".msg-bubble").textContent = text;
        }
        log.appendChild(row);
        log.scrollTop = log.scrollHeight;
      }

      function send(text) {
        text = (text || "").trim();
        if (!text) return;
        addMsg(text, "user");
        input.value = "";
        setTimeout(function () {
          addMsg(replies[r % replies.length], "ai");
          r += 1;
        }, 450);
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        send(input.value);
      });

      document.getElementById("quickChips").addEventListener("click", function (e) {
        var chip = e.target.closest("[data-q]");
        if (!chip) return;
        send(chip.getAttribute("data-q"));
      });
    })();
  </script>
</body>
</html>
