<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · KAOBAチャット</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/screens.css" />
  <link rel="stylesheet" href="assets/ux.css" />
  <link rel="stylesheet" href="assets/vqa.css" />
  <script src="assets/api/calendar-weekend.js?v=11"></script>
  <script src="assets/auto-maintenance.js?v=11.1"></script>
  <script src="assets/auth.js"></script>
  <script>ExpectAuth.requireAuth();</script>
  <script src="assets/favorites.js" defer></script>
  <script src="assets/shell.js" defer></script>
  <script src="assets/reminders.js" defer></script>
</head>
<body class="page-screen page-chat" data-nav="mypage">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left chat-head">
          <a class="back-btn" id="chatBack" href="mypage.html" aria-label="戻る">‹</a>
          <img src="assets/images/mascot-ka0ba.png?v=10" alt="" />
          <div class="brand-block topbar-text topbar-title-only">
            <h1 class="brand-name">KAOBA</h1>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen chat-shell">
      <div class="chat-live2d-slot is-compact" id="live2dSlot" aria-label="KAOBA">
        <button type="button" class="chat-live2d-dismiss" id="live2dDismiss" aria-label="閉じる">×</button>
        <span><strong>KAOBA</strong> がチャットでサポートします</span>
      </div>
      <div class="chat-log" id="chatLog"></div>

      <div class="chat-composer">
        <div class="chat-return-row" id="chatReturnRow" hidden>
          <a class="chat-return-link" id="chatReturnStrategy" href="strategy.html">← 買い目戦略に戻る</a>
        </div>
        <div class="chat-quick chip-row" id="quickChips">
          <button type="button" class="chip" data-q="展開予想を教えて">展開予想</button>
          <button type="button" class="chip" data-q="オッズの動きは？">オッズ変動</button>
          <button type="button" class="chip" data-q="血統について教えて">血統</button>
          <button type="button" class="chip" data-q="買い目を提案して">買い目提案</button>
        </div>
        <form class="chat-input-row" id="chatForm">
          <input id="chatInput" type="text" placeholder="KAOBAにメッセージ…" autocomplete="off" />
          <button class="chat-send" type="submit" aria-label="送信" id="chatSend">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12 20 4l-6 16-2.5-6.5L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/conversation.js"></script>
  <script src="assets/api/kaoba.js"></script>
  <script src="assets/ux.js"></script>
  <script>
    (function () {
      var log = document.getElementById("chatLog");
      var form = document.getElementById("chatForm");
      var input = document.getElementById("chatInput");
      var back = document.getElementById("chatBack");
      var params = new URLSearchParams(location.search);
      var fromStrategy = params.get("from") === "strategy";
      var raceId = params.get("race_id") || "";
      var strategyCtx = null;
      var history = [];

      function addMsg(text, who, asHtml) {
        if (window.ExpectUx) ExpectUx.removeTyping(log);
        var row = document.createElement("div");
        row.className = "msg msg-" + who;
        if (who === "ai") {
          row.innerHTML = '<img src="assets/images/mascot-ka0ba.png?v=10" alt="" /><div class="msg-bubble"></div>';
        } else {
          row.innerHTML = '<div class="msg-bubble"></div>';
        }
        var bubble = row.querySelector(".msg-bubble");
        if (asHtml) bubble.innerHTML = text;
        else bubble.textContent = text;
        log.appendChild(row);
        if (window.ExpectUx) ExpectUx.scrollLogToBottom(log);
        else log.scrollTop = log.scrollHeight;
        return row;
      }

      function buildStrategyReview(ctx) {
        var ai = ctx.ai || {};
        var axis = ctx.axis || {};
        var overall = Number(ai.overall) || 0;
        var grade =
          overall >= 90 ? "かなり自信あり" : overall >= 80 ? "前向きに狙える" : overall >= 70 ? "様子見しつつ少点数" : "抑えめが安心";
        var topTicket = (ctx.tickets && ctx.tickets[0]) || null;
        var rival = (ctx.rivals && ctx.rivals[0]) || null;

        var html =
          "受け取ったよ！詳細戦略を評価するね。<br><br>" +
          "<strong>" +
          (ctx.place || "対象レース") +
          (ctx.name ? " " + ctx.name : "") +
          "</strong> の戦略、総合は <strong>" +
          grade +
          "</strong>（AI " +
          (ai.overall || "—") +
          "%）。<br><br>" +
          "■ 評価ポイント<br>" +
          "・軸の <strong>" +
          (axis.num || "") +
          " " +
          (axis.name || "本命") +
          "</strong> は明確で良いよ<br>" +
          "・パラメータは血統" +
          (ai.pedigree || "—") +
          " / 展開" +
          (ai.pace || "—") +
          " / 近走" +
          (ai.form || "—") +
          " が特に効いてる<br>";

        if (rival) {
          html +=
            "・相手筆頭の <strong>" +
            rival.num +
            " " +
            rival.name +
            "</strong>（" +
            rival.role +
            "）も妥当<br>";
        }

        html += "<br>■ 改善アドバイス<br>";
        if (overall >= 85) {
          html += "・主軸配分を少し厚めにして、三連単は今の点数のままでOK<br>";
        } else {
          html += "・三連単は抑えめにして、ワイド〜馬連中心に寄せると安定するよ<br>";
        }
        if (topTicket) {
          html +=
            "・いちばん優先すべきは <strong>" +
            topTicket.type +
            "</strong>（" +
            topTicket.legs +
            "）<br>";
        }
        html +=
          "・波乱シナリオ用の穴は1頭までに限定して点数を守ろう<br><br>" +
          "■ 最終おすすめ<br>" +
          "このままの軸で進めて大丈夫。資金は合計 " +
          ((ctx.bankroll && ctx.bankroll.total) || "推奨額") +
          " を上限に、<strong>主軸 → 保険 → 一発</strong> の順で入れてね！";

        return html;
      }

      function setBusy(on) {
        var formEl = document.getElementById("chatForm");
        var sendBtn = document.getElementById("chatSend");
        if (formEl) formEl.classList.toggle("is-busy", !!on);
        if (sendBtn) sendBtn.classList.toggle("is-busy", !!on);
        if (input) input.disabled = !!on;
      }

      var sessionId = null;

      function renderConversationExtras(data) {
        // 本番チャットでは開発用 sections/context JSON を出さない
        var parts = [];
        if (data && data.prediction_meta && data.prediction_meta.engine_source === "real_ai") {
          parts.push("<p class='muted'>AI予想を参照して回答しています</p>");
        }
        return parts.join("");
      }

      function dispatchChat(text) {
        var payload = {
          message: text,
          session_id: sessionId,
          race_id: raceId || (strategyCtx && strategyCtx.raceId) || null,
          context: strategyCtx
            ? {
                ui: "strategy",
                type: "strategy_review",
                bundle_ref: strategyCtx.raceId || raceId,
                strategy: strategyCtx,
              }
            : { ui: "chat", bundle_ref: raceId || null },
          history: history.slice(-8),
        };

        function viaKaoba() {
          if (!window.ExpectApi || !ExpectApi.Kaoba || !ExpectApi.Kaoba.chat) {
            return Promise.reject(new Error("no kaoba"));
          }
          return ExpectApi.Kaoba.chat({
            message: text,
            race_id: payload.race_id,
            context: payload.context,
            history: payload.history,
          }).then(function (data) {
            var reply =
              (data && (data.reply || data.message)) ||
              "うまく答えられなかったみたい。もう一度聞いてね。";
            addMsg(reply, "ai");
            history.push({ role: "assistant", content: reply });
          });
        }

        if (window.ExpectApi && ExpectApi.Conversation && ExpectApi.Conversation.chat) {
          return ExpectApi.Conversation.chat(payload)
            .then(function (data) {
              sessionId = data.session_id || sessionId;
              var reply = (data && data.reply) || "うまく答えられなかったみたい。";
              var html = reply.replace(/\n/g, "<br>") + renderConversationExtras(data);
              addMsg(html, "ai", true);
              history.push({ role: "assistant", content: reply });
            })
            .catch(function () {
              return viaKaoba();
            });
        }

        return viaKaoba();
      }

      function send(text, options) {
        options = options || {};
        text = (text || "").trim();
        if (!text || (input && input.disabled)) return;
        var userVisible = options.userDisplay || text;
        addMsg(userVisible, "user");
        if (!options.keepInput) input.value = "";
        history.push({ role: "user", content: text });
        setBusy(true);

        var delay = options.delay != null ? options.delay : 180;

        setTimeout(function () {
          if (window.ExpectUx) {
            log.appendChild(ExpectUx.typingRow());
            ExpectUx.scrollLogToBottom(log);
          }

          if (options.strategyReply && strategyCtx && !window.ExpectApi) {
            var html = buildStrategyReview(strategyCtx);
            addMsg(html, "ai", true);
            history.push({ role: "assistant", content: html.replace(/<[^>]+>/g, "") });
            setBusy(false);
            return;
          }

          if (!window.ExpectApi || (!ExpectApi.Conversation && !ExpectApi.Kaoba)) {
            if (options.strategyReply && strategyCtx) {
              var local = buildStrategyReview(strategyCtx);
              addMsg(local, "ai", true);
              history.push({ role: "assistant", content: local.replace(/<[^>]+>/g, "") });
            } else {
              addMsg("API クライアントが読み込めていないよ。", "ai");
            }
            setBusy(false);
            return;
          }

          dispatchChat(text)
            .catch(function () {
              if (options.strategyReply && strategyCtx) {
                var fallback = buildStrategyReview(strategyCtx);
                addMsg(fallback, "ai", true);
                history.push({ role: "assistant", content: fallback.replace(/<[^>]+>/g, "") });
              } else {
                addMsg("いま通信が不安定みたい。少し待ってからもう一度ね。", "ai");
              }
            })
            .finally(function () {
              setBusy(false);
            });
        }, delay);
      }

      function readStrategyContext() {
        try {
          var raw = sessionStorage.getItem("expect_chat_context_v1");
          if (!raw) return null;
          var data = JSON.parse(raw);
          sessionStorage.removeItem("expect_chat_context_v1");
          if (!data || data.type !== "strategy_review") return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      var live2d = document.getElementById("live2dSlot");
      var live2dDismiss = document.getElementById("live2dDismiss");
      if (live2dDismiss && live2d) {
        live2dDismiss.addEventListener("click", function () {
          live2d.hidden = true;
        });
      }

      // 初期表示
      if (fromStrategy) {
        strategyCtx = readStrategyContext();
        var returnRow = document.getElementById("chatReturnRow");
        var returnLink = document.getElementById("chatReturnStrategy");
        if (back && raceId) {
          back.href = "strategy.html?race_id=" + encodeURIComponent(raceId);
        } else if (back) {
          back.href = "races.html";
        }
        if (returnRow) returnRow.hidden = false;
        if (returnLink && raceId) {
          returnLink.href = "strategy.html?race_id=" + encodeURIComponent(raceId);
        }

        addMsg(
          "買い目戦略を受け取ったよ。内容を確認して評価するね！",
          "ai"
        );

        if (strategyCtx && strategyCtx.summaryText) {
          setTimeout(function () {
            send(strategyCtx.summaryText, {
              strategyReply: true,
              delay: 700,
              userDisplay: strategyCtx.displaySummary || "この戦略を評価して",
            });
          }, 350);
        } else {
          setTimeout(function () {
            addMsg(
              "戦略データの読み込みに失敗したみたい。戦略画面からもう一度「KAOBAに相談する」を押してみてね。",
              "ai"
            );
          }, 400);
        }
      } else {
        addMsg(
          "こんにちは！今日のレース、何が気になる？展開・血統・買い目、なんでも聞いてね。",
          "ai"
        );
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = input.value;
        // 戦略相談の続きなら、評価トーンで返す
        if (strategyCtx && /評価|買い目|戦略|どう思う|改善/.test(text)) {
          send(text, { strategyReply: true });
        } else {
          send(text);
        }
      });

      document.getElementById("quickChips").addEventListener("click", function (e) {
        var chip = e.target.closest("[data-q]");
        if (!chip) return;
        if (strategyCtx && chip.getAttribute("data-q") === "買い目を提案して") {
          send("この戦略の買い目をもう少し最適化して", { strategyReply: true });
        } else {
          send(chip.getAttribute("data-q"));
        }
      });
    })();
  </script>
</body>
</html>
