<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · KAOBAチャット</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/screens.css" />
  <link rel="stylesheet" href="assets/ux.css?v=15" />
  <link rel="stylesheet" href="assets/vqa.css" />
  <script src="assets/api/calendar-weekend.js?v=14"></script>
  <script src="assets/auto-maintenance.js?v=12.4"></script>
  <script src="assets/auth.js?v=6"></script>
  <script>
    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }
  </script>
  <script src="assets/favorites.js?v=4" defer></script>
  <script src="assets/shell.js" defer></script>
  <script src="assets/reminders.js" defer></script>
</head>
<body class="page-screen page-chat" data-nav="mypage">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left chat-head">
          <a class="back-btn" id="chatBack" href="mypage.html" aria-label="戻る">‹</a>
          <img src="assets/images/mascot-ka0ba.webp?v=10" alt="" />
          <div class="brand-block topbar-text topbar-title-only">
            <h1 class="brand-name">KAOBA</h1>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen chat-shell">
      <div class="chat-live2d-slot is-compact" id="live2dSlot" aria-label="KAOBA">
        <span><strong>KAOBA</strong> がチャットでサポートします</span>
      </div>
      <div class="chat-log" id="chatLog"></div>

      <div class="chat-composer">
        <div class="chat-quick chip-row" id="quickChips">
          <button type="button" class="chip" data-q="展開予想を教えて">展開予想</button>
          <button type="button" class="chip" data-q="オッズの動きは？">オッズ変動</button>
          <button type="button" class="chip" data-q="血統について教えて">血統</button>
          <button type="button" class="chip" data-q="買い目を提案して">買い目提案</button>
        </div>
        <form class="chat-input-row" id="chatForm">
          <input id="chatInput" type="text" placeholder="KAOBAにメッセージ…" autocomplete="off" />
          <button class="chat-send" type="submit" aria-label="送信" id="chatSend">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12 20 4l-6 16-2.5-6.5L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/conversation.js?v=8"></script>
  <script src="assets/api/conversation-ui.js?v=7"></script>
  <script src="assets/api/kaoba.js"></script>
  <script src="assets/ux.js?v=14"></script>
  <script>
    (function () {
      var log = document.getElementById("chatLog");
      var form = document.getElementById("chatForm");
      var input = document.getElementById("chatInput");
      var back = document.getElementById("chatBack");
      var params = new URLSearchParams(location.search);
      var fromStrategy = params.get("from") === "strategy";
      var raceId = params.get("race_id") || "";
      var promptParam = params.get("prompt") || "";
      var displayParam = params.get("display") || "";
      var modeParam =
        window.ExpectApi && ExpectApi.Conversation
          ? ExpectApi.Conversation.normalizeMode(params.get("mode"))
          : String(params.get("mode") || "").toLowerCase();
      if (!modeParam && fromStrategy) modeParam = "review";
      var strategyCtx = null;
      var history = [];
      var sessionId = null;

      function isPersonalChat() {
        return modeParam === "chat";
      }
      function isExplain() {
        return modeParam === "explain";
      }
      function isReview() {
        return modeParam === "review";
      }

      (function applyModeChrome() {
        var brand = document.querySelector(".brand-name");
        var chips = document.getElementById("quickChips");
        var liveSpan = document.querySelector("#live2dSlot span");
        if (isPersonalChat()) {
          if (brand) brand.textContent = "日常会話";
          document.title = "Expect ～ KEIBA AI ～ · 日常会話";
          if (input) input.placeholder = "気軽に話しかけてね…";
          if (liveSpan) liveSpan.innerHTML = "<strong>日常会話</strong> パートナーです";
          if (chips) {
            chips.innerHTML =
              '<button type="button" class="chip" data-q="こんにちは">あいさつ</button>' +
              '<button type="button" class="chip" data-q="今日の気分は？">雑談</button>' +
              '<button type="button" class="chip" data-q="使い方を教えて">使い方</button>';
          }
          if (back) back.href = "mypage.html";
        } else if (isExplain()) {
          if (brand) brand.textContent = "KAOBA · 予想の説明";
          document.title = "Expect ～ KEIBA AI ～ · KAOBA · 予想の説明";
          if (input) input.placeholder = "◎や馬について聞く…";
          if (liveSpan) {
            liveSpan.innerHTML = "<strong>KAOBA</strong> · 予想の見方を説明します";
          }
          if (chips) {
            chips.innerHTML =
              '<button type="button" class="chip" data-q="なぜ本命なの？理由を教えて">なぜ本命？</button>' +
              '<button type="button" class="chip" data-q="2番との差は？">2番との差</button>' +
              '<button type="button" class="chip" data-q="不安材料は？">不安材料</button>' +
              '<button type="button" class="chip" data-q="穴馬は？">穴馬</button>';
          }
        } else if (isReview()) {
          if (brand) brand.textContent = "相談AI";
          document.title = "Expect ～ KEIBA AI ～ · 相談AI";
          if (input) input.placeholder = "買い方や立ち回りを相談…";
          if (liveSpan) {
            liveSpan.innerHTML = "<strong>相談AI</strong> · レース全体・買い方を一緒に考える";
          }
          if (chips) {
            chips.innerHTML =
              '<button type="button" class="chip" data-q="この買い方どう？">この買い方どう？</button>' +
              '<button type="button" class="chip" data-q="見送るべき？">見送るべき？</button>' +
              '<button type="button" class="chip" data-q="初心者なら？">初心者なら？</button>';
          }
        }
      })();

      function addMsg(text, who, asHtml) {
        if (window.ExpectUx) ExpectUx.removeTyping(log);
        var row = document.createElement("div");
        row.className = "msg msg-" + who;
        if (who === "ai") {
          row.innerHTML = '<img src="assets/images/mascot-ka0ba.webp?v=10" alt="" /><div class="msg-bubble"></div>';
        } else {
          row.innerHTML = '<div class="msg-bubble"></div>';
        }
        var bubble = row.querySelector(".msg-bubble");
        if (asHtml) bubble.innerHTML = text;
        else bubble.textContent = text;
        log.appendChild(row);
        if (window.ExpectUx) ExpectUx.scrollLogToBottom(log);
        else log.scrollTop = log.scrollHeight;
        return row;
      }

      /** API不通時の短い会話フォールバック（レポート形式にしない） */
      function buildStrategyChatFallback(ctx, question) {
        var axis = (ctx && ctx.axis) || {};
        var axisLabel =
          (axis.num ? axis.num + "番" : "") + (axis.name || "中心の馬");
        var q = String(question || "");
        if (/穴/.test(q)) {
          return (
            "穴は相手の端に1頭まで、がおすすめだよ。\n" +
            "理由は、点数を守りつつ波乱にも少し触れるため。\n" +
            "くわしい候補名は、予想画面の印もあわせて見てね。"
          );
        }
        if (/少額|予算/.test(q)) {
          return (
            "少額なら、主軸（馬連・ワイド）だけに寄せるのがおすすめだよ。\n" +
            "保険や一発は後回しにして、総額を普段どおりに抑えよう。\n" +
            "軸の " +
            axisLabel +
            " 中心はそのままで大丈夫。"
          );
        }
        if (/雨|馬場|重馬場|不良/.test(q)) {
          return (
            "雨なら、想定より前が残るか崩れやすいかが変わりやすいよ。\n" +
            "軸は変えず、相手を1頭増やすか減らすかで調整するのが無難。\n" +
            "馬場発表を見てから最終判断しよう。"
          );
        }
        if (/オッズ/.test(q)) {
          return (
            "オッズが動いても、軸をすぐ変えないのがおすすめだよ。\n" +
            "人気が急上昇した相手は点数を少し抑え、穴側は増やしすぎない。\n" +
            "総額の上限は戦略画面のまま守ろう。"
          );
        }
        if (/◎|本命|詳しく/.test(q)) {
          return (
            "中心は " +
            axisLabel +
            " で見るのがよさそうだよ。\n" +
            "戦略でも同じ軸を前提にしているから、まずはこの馬の形を確認しよう。\n" +
            "差や不安材料も聞きたいときは、そのまま聞いてね。"
          );
        }
        return (
          "この買い方なら、軸の " +
          axisLabel +
          " を中心に進めて大丈夫だと思うよ。\n" +
          "大きく崩すより、点数と総額を守るほうが安心。\n" +
          "穴馬・少額・雨・オッズの話も、気になるところから聞いてね。"
        );
      }

      function setBusy(on) {
        var formEl = document.getElementById("chatForm");
        var sendBtn = document.getElementById("chatSend");
        if (formEl) formEl.classList.toggle("is-busy", !!on);
        if (sendBtn) sendBtn.classList.toggle("is-busy", !!on);
        if (input) input.disabled = !!on;
      }

      function renderConversationExtras(data) {
        // 本番チャット吹き出しに mode / agent / LLM / Prediction Read Only は出さない
        return "";
      }

      function buildContext() {
        if (strategyCtx) {
          return {
            ui: "strategy",
            type: "strategy_review",
            mode: "review",
            bundle_ref: strategyCtx.raceId || raceId,
            strategy: strategyCtx,
          };
        }
        if (isPersonalChat()) {
          return { ui: "mypage", type: "personal_chat", mode: "chat" };
        }
        if (isExplain()) {
          return { ui: "race", type: "honmei_reason", mode: "explain", bundle_ref: raceId || null };
        }
        if (isReview()) {
          return { ui: "race", type: "consult", mode: "review", bundle_ref: raceId || null };
        }
        return { ui: "chat", bundle_ref: raceId || null };
      }

      function dispatchChat(text) {
        var payload = {
          message: text,
          session_id: sessionId,
          race_id: isPersonalChat() ? null : raceId || (strategyCtx && strategyCtx.raceId) || null,
          mode: modeParam || undefined,
          context: buildContext(),
          history: history.slice(-8),
        };

        function viaKaoba() {
          if (!window.ExpectApi || !ExpectApi.Kaoba || !ExpectApi.Kaoba.chat) {
            return Promise.reject(new Error("no kaoba"));
          }
          return ExpectApi.Kaoba.chat({
            message: text,
            race_id: payload.race_id,
            context: payload.context,
            history: payload.history,
          }).then(function (data) {
            var reply =
              (data && (data.reply || data.message)) ||
              "うまく答えられなかったみたい。もう一度聞いてね。";
            reply = String(reply).replace(/\n?（対象:\s*[^）]+）\s*/g, "").trim();
            addMsg(reply, "ai");
            history.push({ role: "assistant", content: reply });
          });
        }

        if (window.ExpectApi && ExpectApi.Conversation && ExpectApi.Conversation.chat) {
          return ExpectApi.Conversation.chat(payload)
            .then(function (data) {
              sessionId = data.session_id || sessionId;
              var reply = (data && data.reply) || "うまく答えられなかったみたい。";
              // 開発者向けの race_id 注記は表示しない
              reply = String(reply).replace(/\n?（対象:\s*[^）]+）\s*/g, "").trim();
              var html = reply.replace(/\n/g, "<br>") + renderConversationExtras(data);
              addMsg(html, "ai", true);
              history.push({ role: "assistant", content: reply });
            })
            .catch(function () {
              return viaKaoba();
            });
        }

        return viaKaoba();
      }

      function send(text, options) {
        options = options || {};
        text = (text || "").trim();
        if (!text || (input && input.disabled)) return;
        var userVisible = options.userDisplay || text;
        addMsg(userVisible, "user");
        if (!options.keepInput) input.value = "";
        history.push({ role: "user", content: text });
        setBusy(true);

        var delay = options.delay != null ? options.delay : 180;

        setTimeout(function () {
          if (window.ExpectUx) {
            log.appendChild(ExpectUx.typingRow());
            ExpectUx.scrollLogToBottom(log);
          }

          if (options.localFallback && strategyCtx && !window.ExpectApi) {
            var plain = buildStrategyChatFallback(strategyCtx, text);
            addMsg(plain.replace(/\n/g, "<br>"), "ai", true);
            history.push({ role: "assistant", content: plain });
            setBusy(false);
            return;
          }

          if (!window.ExpectApi || (!ExpectApi.Conversation && !ExpectApi.Kaoba)) {
            if (strategyCtx) {
              var local = buildStrategyChatFallback(strategyCtx, text);
              addMsg(local.replace(/\n/g, "<br>"), "ai", true);
              history.push({ role: "assistant", content: local });
            } else {
              addMsg("API クライアントが読み込めていないよ。", "ai");
            }
            setBusy(false);
            return;
          }

          dispatchChat(text)
            .catch(function () {
              if (strategyCtx) {
                var fallback = buildStrategyChatFallback(strategyCtx, text);
                addMsg(fallback.replace(/\n/g, "<br>"), "ai", true);
                history.push({ role: "assistant", content: fallback });
              } else {
                addMsg("いま通信が不安定みたい。少し待ってからもう一度ね。", "ai");
              }
            })
            .finally(function () {
              setBusy(false);
            });
        }, delay);
      }

      function readStrategyContext() {
        try {
          var raw = sessionStorage.getItem("expect_chat_context_v1");
          if (!raw) return null;
          var data = JSON.parse(raw);
          sessionStorage.removeItem("expect_chat_context_v1");
          if (!data || data.type !== "strategy_review") return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      var live2d = document.getElementById("live2dSlot");

      // 初期表示
      if (fromStrategy) {
        strategyCtx = readStrategyContext();
        if (back && raceId) {
          back.href = "strategy.html?race_id=" + encodeURIComponent(raceId);
        } else if (back) {
          back.href = "races.html";
        }

        var openPlace =
          (strategyCtx && (strategyCtx.place || strategyCtx.name)) || "";
        var openAxis =
          strategyCtx && strategyCtx.axis
            ? (strategyCtx.axis.num ? strategyCtx.axis.num + "番" : "") +
              (strategyCtx.axis.name || "")
            : "";
        var opening =
          "買い目戦略を確認したよ。気になることがあれば一緒に見ていこう。" +
          (openPlace ? "\n" + openPlace + "の買い方や立ち回り、何でも聞いてね。" : "") +
          (openAxis ? "\nいまの軸は " + openAxis.trim() + " だよ。" : "");
        addMsg(opening, "ai");
      } else if (isExplain()) {
        if (back && raceId) back.href = "race.html?race_id=" + encodeURIComponent(raceId);
        addMsg("こんにちは！◎の理由や馬の見方について、気になることがあれば聞いてね😊", "ai");
        setTimeout(function () {
          var apiText = promptParam || "なぜ本命（◎）なの？理由を教えて";
          send(apiText, {
            delay: 400,
            userDisplay: displayParam || "◎の理由を教えて",
          });
        }, 350);
      } else if (isReview()) {
        if (back && raceId) back.href = "race.html?race_id=" + encodeURIComponent(raceId);
        addMsg("相談AIだよ。このレースの買い方や立ち回りを一緒に考えよう。", "ai");
        if (promptParam) {
          setTimeout(function () {
            send(promptParam, {
              delay: 400,
              userDisplay: displayParam || promptParam,
            });
          }, 350);
        }
      } else if (isPersonalChat()) {
        addMsg(
          "こんにちは。マイページの日常会話だよ。競馬の予想変更はしないから、気軽に話そう。",
          "ai"
        );
      } else {
        addMsg(
          "こんにちは！今日のレース、何が気になる？展開・血統・買い目、なんでも聞いてね。",
          "ai"
        );
        if (promptParam && raceId) {
          setTimeout(function () {
            send(promptParam, { delay: 400 });
          }, 350);
        }
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        send(input.value);
      });

      document.getElementById("quickChips").addEventListener("click", function (e) {
        var chip = e.target.closest("[data-q]");
        if (!chip) return;
        send(chip.getAttribute("data-q"));
      });
    })();
  </script>
</body>
</html>
