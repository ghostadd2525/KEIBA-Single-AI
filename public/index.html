  <script>
    document.addEventListener("DOMContentLoaded", function () {
      SingleDemo.initIndex();

      var chrome = document.getElementById("homeChrome");
      var main = document.getElementById("main");
      var mascot = document.getElementById("mascotKa0ba");

      function syncView() {
        var hash = location.hash || "";
        var nested = /^#\/meeting\//.test(hash);
        var catalog = hash === "#catalog" || nested;
        if (chrome) chrome.hidden = catalog;
        if (main) main.classList.toggle("is-catalog", catalog);
        if (mascot) mascot.hidden = catalog;
        document.body.classList.toggle("is-catalog-view", catalog);
      }

      /** タチE��はネイチE��ブ、�EウスはドラチE��で横スクロール */
      function enableSwipeScroll(el, options) {
        options = options || {};
        if (!el || el.dataset.swipeBound === "1") return;
        el.dataset.swipeBound = "1";
        var pointerId = null;
        var startX = 0;
        var startScrollLeft = 0;
        var moved = false;
        var linkSelector = options.linkSelector || "";

        el.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "touch") return;
          if (e.pointerType === "mouse" && e.button !== 0) return;
          if (linkSelector && e.target.closest(linkSelector)) return;
          pointerId = e.pointerId;
          startX = e.clientX;
          startScrollLeft = el.scrollLeft;
          moved = false;
          el.setPointerCapture(e.pointerId);
          el.classList.add("is-dragging");
        });

        el.addEventListener("pointermove", function (e) {
          if (pointerId !== e.pointerId) return;
          var dx = e.clientX - startX;
          if (Math.abs(dx) > 3) moved = true;
          el.scrollLeft = startScrollLeft - dx;
        });

        function endDrag(e) {
          if (pointerId !== e.pointerId) return;
          pointerId = null;
          el.classList.remove("is-dragging");
          try { el.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ }
          if (moved) {
            window.setTimeout(function () {
              moved = false;
            }, 0);
          }
        }

        el.addEventListener("pointerup", endDrag);
        el.addEventListener("pointercancel", endDrag);
        el.addEventListener("click", function (e) {
          if (!moved) return;
          e.preventDefault();
          e.stopPropagation();
          moved = false;
        }, true);
      }

      function refreshFavorites() {
        var rail = document.getElementById("favoritesRail");
        ExpectFavorites.renderHome(rail);
      }
      ExpectFavorites.bindHomeEdit();
      refreshFavorites();
      enableSwipeScroll(document.getElementById("favoritesRail"), { linkSelector: ".fav-card" });
      window.addEventListener("expect:favorites-changed", refreshFavorites);

      /* 今日の本命 + ヒ�Eト�EチE�E + ダチE��ュメトリクス */
      (function loadHomeRealData() {
        var cardsMount = document.getElementById("aiCards");
        var predictCard = document.querySelector(".ai-card--predict");
        var loadMount = predictCard || cardsMount;
        if (!window.ExpectApi || !ExpectApi.Prediction || !window.ExpectPredictionBind) return;

        function withTimeout(promise, ms, label) {
          return new Promise(function (resolve, reject) {
            var settled = false;
            var timer = setTimeout(function () {
              if (settled) return;
              settled = true;
              var err = new Error(label || "timeout");
              err.code = "TIMEOUT";
              reject(err);
            }, ms);
            Promise.resolve(promise).then(
              function (value) {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                resolve(value);
              },
              function (err) {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                reject(err);
              }
            );
          });
        }

        if (window.ExpectRealDataBind && ExpectRealDataBind.startHeatmapPolling) {
          // 会場は週次解決�E��E場表示を避ける�E�E
          ExpectRealDataBind.startHeatmapPolling({ intervalMs: 60000 });
        }

        var listDate =
          window.ExpectRealDataBind && ExpectRealDataBind.resolveHomeDate
            ? ExpectRealDataBind.resolveHomeDate()
            : "";
        var honmeiCached =
          ExpectPredictionBind.readHomeHonmeiCache &&
          ExpectPredictionBind.readHomeHonmeiCache(listDate);

        function paintHeatAndMetrics(bundles, coverage, history) {
          if (window.ExpectRealDataBind) {
            ExpectRealDataBind.cacheBundles(bundles);
            ExpectRealDataBind.paintDashMetrics(coverage, history);
            var venues = [];
            (bundles || []).forEach(function (b) {
              var v = b.race_info && b.race_info.venue;
              if (v && venues.indexOf(v) < 0) venues.push(v);
            });
            if (!venues.length && honmeiCached && honmeiCached.venues) {
              venues = honmeiCached.venues.slice();
            }
            function applyVenues(vlist) {
              if (vlist && vlist.length && ExpectRealDataBind.fetchAndPaintHeatmap) {
                ExpectRealDataBind.fetchAndPaintHeatmap({ venues: vlist });
              }
            }
            if (venues.length) applyVenues(venues);
            else if (ExpectRealDataBind.resolveWeekVenues) {
              ExpectRealDataBind.resolveWeekVenues().then(applyVenues).catch(function () {});
            }
          }
        }

        function paintHonmeiFromBundles(bundles) {
          var filtered = window.ExpectContractGuard
            ? ExpectContractGuard.filterValidBundles(bundles)
            : { ok: bundles || [], rejected: [] };
          if (filtered.ok.length) {
            if (window.ExpectContractGuard) ExpectContractGuard.clearErrorCard(cardsMount);
            ExpectPredictionBind.applyHomeHonmeiCard(
              ExpectPredictionBind.pickTopByConfidence(filtered.ok)
            );
            try {
              var snap = ExpectPredictionBind.readHomeHonmeiCache(listDate);
              if (snap) {
                var venues = [];
                filtered.ok.forEach(function (b) {
                  var v = b.race_info && b.race_info.venue;
                  if (v && venues.indexOf(v) < 0) venues.push(v);
                });
                if (venues.length) {
                  snap.venues = venues;
                  localStorage.setItem("expect_home_honmei_v1", JSON.stringify(snap));
                }
              }
            } catch (e) { /* ignore */ }
          }
        }

        function clearMountLoading() {
          if (predictCard) predictCard.classList.remove("is-updating");
          if (cardsMount) cardsMount.classList.remove("is-loading");
          if (loadMount && window.ExpectUx && ExpectUx.hideLoading) {
            ExpectUx.hideLoading(loadMount);
          }
          if (cardsMount && window.ExpectUx && ExpectUx.hideLoading) {
            ExpectUx.hideLoading(cardsMount);
          }
          if (cardsMount) {
            var sk = cardsMount.querySelector(".v11-home-skel");
            if (sk) sk.remove();
          }
        }

        function fail(msg) {
          clearMountLoading();
          if (honmeiCached) return;
          if (window.ExpectUiFeatures && ExpectUiFeatures.enabled("v11_loading_errors") && window.ExpectUx && cardsMount) {
            ExpectUx.showIn(
              cardsMount,
              ExpectUx.stateCard({
                kind: "error",
                title: "チE�Eタを更新できません",
                message: msg || "Prediction API に接続できません、E,
                onRetry: function () {
                  location.reload();
                },
              })
            );
            return;
          }
          if (window.ExpectContractGuard && cardsMount) {
            ExpectContractGuard.showErrorCard(cardsMount, {
              title: "チE�Eタを更新できません",
              message: msg || "Prediction API に接続できません、E,
            });
          }
        }

        /* 当日キャチE��ュがあれ�E本命カード�E即表示・再ロードしなぁE*/
        if (honmeiCached && ExpectPredictionBind.applyHomeHonmeiSnapshot(honmeiCached)) {
          clearMountLoading();
          var sideReqs = [];
          if (ExpectApi.Supply) sideReqs.push(ExpectApi.Supply.coverage().catch(function () { return null; }));
          else sideReqs.push(Promise.resolve(null));
          if (ExpectApi.User) sideReqs.push(ExpectApi.User.history().catch(function () { return null; }));
          else sideReqs.push(Promise.resolve(null));
          Promise.all(sideReqs)
            .then(function (parts) {
              paintHeatAndMetrics([], parts[0], parts[1]);
            })
            .catch(function () { /* ignore */ });
          return;
        }

        if (predictCard) predictCard.classList.add("is-updating");
        if (cardsMount) cardsMount.classList.add("is-loading");
        if (loadMount && window.ExpectUx && ExpectUx.showLoading) {
          ExpectUx.showLoading(loadMount, {
            replace: false,
            compact: true,
            title: "ロード中...",
            message: "し�Eらくお征E��ください、E,
          });
        }

        var reqs = [
          // ホ�Eムは本命カード用。�Eレース予想の一括取得�E重いので短めに打ち刁E��
          withTimeout(
            ExpectApi.Prediction.list({ date: listDate }),
            18000,
            "predictions timeout"
          ),
        ];
        if (ExpectApi.Supply) reqs.push(ExpectApi.Supply.coverage().catch(function () { return null; }));
        else reqs.push(Promise.resolve(null));
        if (ExpectApi.User) reqs.push(ExpectApi.User.history().catch(function () { return null; }));
        else reqs.push(Promise.resolve(null));

        Promise.all(reqs)
          .then(function (parts) {
            var bundles = parts[0] || [];
            paintHonmeiFromBundles(bundles);
            paintHeatAndMetrics(bundles, parts[1], parts[2]);
          })
          .catch(function (err) {
            if (err && err.code === "TIMEOUT") {
              fail("予想チE�Eタの取得がタイムアウトしました。�E読み込みしてください、E);
              return;
            }
            fail("Prediction API からレース一覧を取得できませんでした、E);
          })
          .finally(function () {
            clearMountLoading();
          });
      })();

      enableSwipeScroll(document.querySelector(".heatmap-scroll"));
      enableSwipeScroll(document.querySelector(".cond-table-wrap"));

      /* KA0BA: タチE�Eで吹き�Eしトーク */
      (function initMascotTalk() {
        var root = document.getElementById("mascotKa0ba");
        var btn = document.getElementById("mascotTalkBtn");
        var bubble = document.getElementById("mascotBubble");
        if (!root || !btn || !bubble) return;

        var idx = 0;
        var hideTimer = null;
        var typeTimer = null;

        function clearTimers() {
          if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
          if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
        }

        function hideBubble() {
          clearTimers();
          root.classList.remove("is-speaking");
        }

        var mascotLines = null;

        function speak(html) {
          clearTimers();
          root.classList.remove("is-speaking");
          void root.offsetWidth;
          root.classList.add("is-speaking");

          var plain = html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/?strong>/gi, "");
          var cursor = 0;
          bubble.innerHTML = "";
          typeTimer = setInterval(function () {
            cursor += 1;
            var slice = plain.slice(0, cursor)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\n/g, "<br>");
            bubble.innerHTML = slice;
            if (cursor >= plain.length) {
              clearInterval(typeTimer);
              typeTimer = null;
              bubble.innerHTML = html;
              hideTimer = setTimeout(hideBubble, 4200);
            }
          }, 28);
        }

        btn.addEventListener("click", function () {
          var pool = mascotLines || [
            "お疲れさま�E�Ebr>今日も一緒に<br>レースを見てぁE��ぁE��E
          ];
          var line = pool[idx % pool.length];
          idx += 1;
          speak(line);
        });

        Promise.all([
          ExpectApi.Prediction.list({}).catch(function () { return []; }),
          ExpectApi.Supply ? ExpectApi.Supply.coverage().catch(function () { return null; }) : Promise.resolve(null),
        ]).then(function (pair) {
          if (window.ExpectRealDataBind) {
            mascotLines = ExpectRealDataBind.mascotLinesFromData(pair[0], pair[1]);
          }
        });

        // 操作説明が無ぁE��きだけ�E回�Eとこと
        setTimeout(function () {
          if (!root.hidden && ExpectAuth && !ExpectAuth.needsOnboarding()) {
            speak(
              (mascotLines && mascotLines[0]) ||
                "お疲れさま�E�Ebr>今日も一緒に<br>レースを見てぁE��ぁE��E
            );
          }
        }, 700);
      })();

      // 初回ログイン後�Eみスポットライト操作説昁E
      setTimeout(function () {
        if (window.ExpectOnboarding) ExpectOnboarding.start();
      }, 450);

      window.addEventListener("hashchange", syncView);
      syncView();
    });
  </script>
