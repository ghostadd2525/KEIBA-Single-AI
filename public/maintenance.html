<!DOCTYPE html>
<html lang="ja" data-skip-auto-maintenance>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <title>Expect ～ KEIBA AI ～ · メンテナンス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/login.css" />
  <style>
    .maint-shell {
      max-width: 420px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
      color: #e8e6e1;
    }
    .maint-shell h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin: 1.25rem 0 0.5rem;
    }
    .maint-shell .lede {
      color: #a8a59c;
      line-height: 1.6;
      font-size: 0.95rem;
      margin: 0 0 1.5rem;
    }
    .maint-block {
      border-top: 1px solid rgba(232, 230, 225, 0.12);
      padding: 1.1rem 0;
    }
    .maint-block h2 {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a8680;
      margin: 0 0 0.45rem;
      font-weight: 600;
    }
    .maint-block p {
      margin: 0;
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .maint-actions {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 1.5rem;
    }
    .maint-actions a {
      display: block;
      text-align: center;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .maint-actions a.primary {
      background: #c9a227;
      color: #1a1508;
    }
    .maint-actions a.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #e8e6e1;
      border: 1px solid rgba(232, 230, 225, 0.18);
    }
    .maint-chat-note {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #b8a56a;
      line-height: 1.5;
    }
    .maint-brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      letter-spacing: 0.06em;
    }
    .maint-brand span {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: #8a8680;
      margin-top: 0.15rem;
      font-family: "Noto Sans JP", sans-serif;
    }
  </style>
  <script src="assets/api/ui-features.js?v=11"></script>
  <script src="assets/api/calendar-weekend.js?v=11"></script>
  <script src="assets/auto-maintenance.js?v=11"></script>
</head>
<body class="page-login page-maintenance">
  <div class="maint-shell">
    <p class="maint-brand">Expect<span>～ KEIBA AI ～</span></p>
    <h1>現在メンテナンス中</h1>
    <p class="lede" id="maintMessage">ただいま公開時間外です。開催日のみご利用いただけます。</p>

    <div class="maint-block">
      <h2>次回公開予定</h2>
      <p id="maintNextOpen">読み込み中…</p>
    </div>

    <div class="maint-block">
      <h2>招待制サービス</h2>
      <p>本サービスは招待制です。お持ちの一時IDでログイン・初回設定を行えます（開催日に全機能が利用可能になります）。</p>
    </div>

    <div class="maint-block">
      <h2>会話型AI（KAOBA）</h2>
      <p>開催日には AI パートナー KAOBA と会話できます。</p>
      <p class="maint-chat-note" id="maintChatNote">会話型AIは開催日に利用できます</p>
    </div>

    <div class="maint-actions">
      <a class="primary" href="login.html">ログイン / 招待ID</a>
      <a class="secondary" href="chat.html">会話型AIを見る</a>
    </div>
  </div>
  <script>
    ExpectAutoMaintenance.bindMaintenancePage();
  </script>
</body>
</html>
