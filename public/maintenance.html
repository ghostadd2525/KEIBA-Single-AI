<!DOCTYPE html>
<html lang="ja" data-skip-auto-maintenance>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <meta name="robots" content="noindex" />
  <title>メンテナンス中 — Expect ～ KEIBA AI ～</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/login.css" />
  <style>
    body.page-maintenance {
      margin: 0;
      min-height: 100dvh;
      background: #05070c;
      overflow: hidden;
    }

    .maintenance-app {
      width: 100%;
      max-width: var(--max, 430px);
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      box-sizing: border-box;
      background:
        radial-gradient(ellipse 90% 55% at 50% 18%, rgba(193, 162, 109, 0.14), transparent 58%),
        linear-gradient(180deg, #070a12 0%, #05070c 42%, #0a0e16 100%);
    }

    .maintenance-app::before {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 42%;
      background:
        linear-gradient(180deg, rgba(5, 7, 12, 0.15), rgba(5, 7, 12, 0.92)),
        url("assets/images/bg-fav-1.png") center / cover no-repeat;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .maintenance-content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .maintenance-figure {
      display: block;
      width: min(68%, 280px);
      height: auto;
      max-height: 48dvh;
      object-fit: contain;
      background: transparent;
      border: 0;
      outline: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.45));
    }

    .maintenance-note {
      margin: 0;
      width: 100%;
      max-width: none;
      text-align: center;
      font-family: "Noto Sans JP", "Hiragino Sans", "Segoe UI", Meiryo, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.75;
      letter-spacing: 0.01em;
      color: rgba(254, 249, 231, 0.88);
      white-space: nowrap;
    }

    .maintenance-note br {
      display: block;
      content: "";
      margin: 0;
    }

    @media (max-width: 380px) {
      .maintenance-note {
        font-size: 13px;
        letter-spacing: 0;
      }
    }
  </style>
  <script src="assets/api/calendar-weekend.js?v=11.1"></script>
  <script src="assets/auto-maintenance.js?v=11.1"></script>
</head>
<body class="page-maintenance">
  <main class="maintenance-app" aria-label="メンテナンス中">
    <div class="maintenance-content">
      <img
        class="maintenance-figure"
        src="assets/images/maintenance-ka0ba.png"
        alt="メンテナンス中・・・"
        width="1024"
        height="1024"
      />
      <p class="maintenance-note">
        月曜日～金曜日はメンテナンスをおこなっております。<br />
        土曜日または日曜日のご利用をお待ちしております。
      </p>
    </div>
  </main>
  <script>if (window.ExpectAutoMaintenance) ExpectAutoMaintenance.bindMaintenancePage();</script>
</body>
</html>
