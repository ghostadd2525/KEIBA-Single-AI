<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expect ～ KEIBA AI ～ · 購入履歴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=23" />
  <link rel="stylesheet" href="assets/screens.css?v=37" />
  <link rel="stylesheet" href="assets/ux.css?v=17" />
  <script src="assets/api/calendar-weekend.js?v=14"></script>
  <script src="assets/auto-maintenance.js?v=12.4"></script>
  <script src="assets/auth.js?v=6"></script>
  <script>
    if (ExpectAuth.requireAuth() && window.ExpectAutoMaintenance) {
      ExpectAutoMaintenance.run();
    }
  </script>
</head>
<body class="page-screen page-history page-tab" data-nav="mypage">
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-block topbar-text topbar-title-only">
            <p class="brand-name">購入履歴</p>
          </div>
        </div>
        <div class="topbar-tools" aria-hidden="true"></div>
      </div>
    </header>

    <div class="screen">
      <p class="ph-lead muted">月単位の購入実績です。レースを開くと買い目・AI印の結果を確認できます。</p>
      <div id="purchaseHistoryMount" class="ph-root" aria-live="polite">
        <p class="muted">購入履歴を読み込み中…</p>
      </div>
    </div>

    <aside class="mascot-ka0ba" id="mascotKa0ba" data-mascot-mode="png">
      <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
      <button type="button" class="mascot-figure" id="mascotTalkBtn" aria-label="KA0BAに話しかける">
        <img data-mascot-fallback src="assets/images/mascot-ka0ba.webp?v=10" alt="" height="140" draggable="false" />
      </button>
    </aside>

    <div data-expect-nav></div>
  </div>
  <script src="assets/api/mock-gate.js"></script>
  <script src="assets/api/auth.js"></script>
  <script src="assets/api/user.js?v=6"></script>
  <script src="assets/api/user-race-results.js?v=2"></script>
  <script src="assets/api/race-detail-cache.js?v=4"></script>
  <script src="assets/favorites.js?v=4"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/reminders.js"></script>
  <script src="assets/partials-nav.js"></script>
  <script>
    ExpectUserRaceResults.bindPurchaseHistory(document);
    if (window.ExpectShell && ExpectShell.initMascotTalk) {
      ExpectShell.initMascotTalk([
        "購入履歴を<br>月ごとにまとめたよ！",
        "レースを開くと<br>買い目の結果も見られるよ♪"
      ]);
    }
    (function () {
      try {
        var d = new Date();
        var today =
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0");
        if (window.ExpectRaceDetailCache && ExpectRaceDetailCache.applyDayArchiveFromApi) {
          ExpectRaceDetailCache.applyDayArchiveFromApi(today);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
