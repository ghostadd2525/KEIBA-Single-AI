# Cloudflare Pages project config
# このファイルに pages_build_output_dir があることで、Cloudflare は
# 本リポジトリを「Worker」ではなく「Pages」プロジェクトとして認識します。
name = "keiba-single-ai"
pages_build_output_dir = "public"
compatibility_date = "2026-07-19"

# -----------------------------------------------------------------------------
# Pages Functions 環境変数 / Secrets（Phase9-A）
# 実際の値は Dashboard または `wrangler pages secret put` で環境別に設定。
# テンプレート: infra/cloudflare/env/{development,staging,production}.env.example
# IaC:         infra/cloudflare/terraform/
# -----------------------------------------------------------------------------
# AI_BASE_URL              = Tunnel 上の AI ホスト（例 https://ai-staging....）※公開 Origin 禁止
# AI_API_KEY               = BFF→Python 共有鍵（X-AI-Key）
# CF_ACCESS_CLIENT_ID      = Access Service Token（Tunnel AI 用）
# CF_ACCESS_CLIENT_SECRET  = Access Service Token secret
# AUTH_MODE                = stub
# KAOBA_PROVIDER           = auto | python | rule
# AI_ENGINE                = auto | mock | real（観測用）
# VALIDATE_CONTRACTS       = soft | strict | off
# EXPECT_ENV               = development | staging | production

# Non-secret defaults (override in Dashboard / secrets as needed)
[vars]
AUTH_MODE = "stub"
VALIDATE_CONTRACTS = "soft"
KAOBA_PROVIDER = "auto"
AI_ENGINE = "real"
